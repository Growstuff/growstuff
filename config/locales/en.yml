  pages:
    community_guidelines:
      title: "Growstuff Community Guidelines"
      body_html: |
        <p>
        Growstuff is a community by and for food-gardeners. Together, we are building a website where we can share our
        experience, knowledge, and the products of our harvest. The most important thing about Growstuff is the people. For
        Growstuff to thrive, we need people to add their crops, share their knowledge, and help build the site itself.
        </p>
        <p>Whatever your interest in Growstuff, you are welcome here, and will be treated with respect. In particular:</p>
        <ul>
        <li>
        <p>
        We welcome people of any age, gender identity or expression, ethnicity, nationality, religion or absence thereof,
        political opinion, sexual orientation, marital status, family structure, ability or disability, appearance,
        subculture, or other identity or self-identification.
        </p>
        </li>
        <li>
        <p>
        Although Growstuff is primarily focused on food gardening, we welcome all kinds of gardeners, including organic
        and conventional growers; those who grow their crops in fields or on balconies or in hydroponic systems; those who
        garden commercially or non-commercially; those who subsist on their crops and those who garden for other reasons.
        </p>
        </li>
        <li>
        <p>
        We welcome people of all skill and experience levels, and we don't believe in being dismissive or commenting
        rudely just because you are new or learning.
        </p>
        </li>
        <li>
        <p>
        Every role in our community is important, including gardeners who contribute skills, knowledge, and information to
        our site; coders, designers and other techies who help build it; moderators and others who help our community
        thrive; or any other form of participation. We believe in working together, and prioritise communication and
        mutual understanding.
        </p>
        </li>
        </ul>
        <p>
        If you want to participate in the Growstuff community (which includes our website and any auxiliary forums such as our
        mailing list(s), IRC channel, etc), you need to agree to our general commitment to inclusiveness and mutual respect,
        as well as to the following specific policies:
        </p>
        <ul>
        <li>
        <p>
        Harassment of any Growstuff community member is forbidden. Harassment includes slurs directed at individuals or
        groups; unwanted sexual remarks directed at any person or group; sexually explicit comments or imagery in public
        spaces; stalking or other repeated, unwanted contact; or any repeated or sustained behaviour which disrupts
        someone else's enjoyment of the Growstuff site or community.
        </p>
        </li>
        <li>
        <p>
        The privacy of our community members is very important. You may not disclose any member's personal details
        (including names by which they are known outside of Growstuff, their location, employment details, family details,
        outside-of-Growstuff contact details, or any other identifying or personal information) without their explicit
        consent.
        </p>
        </li>
        <li>
        <p>
        Although we let you choose your own name on our site, and don't insist that you use the same name on our website
        as you have on the cards in your wallet, you're not allowed to create or use a pseudonymous account to mislead
        people, evade accountability, or otherwise cause trouble. (This is commonly known as a "sockpuppet" account.)
        </p>
        </li>
        </ul>
        <p>
        If you experience or witness behaviour that goes against these community guidelines, you can report it to
        support@growstuff.org. We will listen carefully and take your report seriously. Once we've looked into the situation,
        we may take any action we deem necessary. For instance, we may issue a warning, or in serious cases we may suspend or
        ban people from our community. If this happens, we will always tell the person affected the reason for our action,
        with reference to our policy documents.
        </p>
        <p>
        We don't want to make these guidelines too long or legalistic, so we'll leave it there, except for one final
        guideline. As Bill and Ted said: <em>be excellent to each other</em>. And grow stuff.
        </p>
        <h2>Creative Commons License</h2>
        <p>
        These Community Guidelines are licensed under a
        <a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">Creative Commons Attribution-ShareAlike (CC-BY-SA)
        3.0 Unported License</a>.
        </p>
    copyright:
      title: "Copyright Infringement Policy"
      body_html: |
        <p>
        We hate legalese, so we've tried to make this policy readable. If you've got any questions, feel free to
        <a href="mailto:support@growstuff.org">ask us</a>, and we'll do our best to answer.
        </p>
        <p>
        This Copyright Infringement Policy covers all websites (such as <a href="http://www.growstuff.org">growstuff.org</a>)
        owned and operated by the Growstuff maintainers ("Growstuff", "we", "us", "our") and all associated services,
        collectively referred to as "the Service". It describes how you may report a violation of copyright on the Service.
        </p>
        <p>
        Growstuff respects the intellectual property of others, and we ask our users to do the same. Growstuff members are
        required by the <a href="http://www.growstuff.org/policy/tos">Terms of Service</a> to ensure that they have the legal
        right to post content to the Service.
        </p>
        <p>
        Growstuff is based in Melbourne, Australia and is not subject to the provisions of the United States Digital
        Millennium Copyright Act (DMCA). However, we have established policy and procedures which are similar to those
        required by the DMCA, as we believe they constitute best practice for web services operating in Australia.
        </p>
        <h2>1. Notifying us of an infringement</h2>
        <p>
        If you believe that a Growstuff member has infringed your intellectual property rights by posting Content to the
        service, you may follow these steps to notify us and ask for the removal of the Content.
        </p>
        <p>Notifications may be submitted by email to <a href="mailto:support@growstuff.org">support@growstuff.org</a></p>
        <p>We prefer to receive notifications by email.</p>
        <p>Copyright infringement notifications sent through any other mechanism or forum will not be acted upon.</p>
        <p>You must provide the following information:</p>
        <ul>
        <li>
        Sufficient information to identify the copyrighted work being infringed. For instance, if the work is a published
        book, provide the title, author, and ISBN; if the work is a magazine article, provide the title, author, magazine
        name, and magazine issue; if the work is available on the Internet, provide the URL of the work.
        </li>
        <li>
        The URL of the specific page on Growstuff where your work was reproduced without permission. General descriptions or
        non-specific links (such as to Growstuff's homepage) cannot be acted upon.
        </li>
        <li>Your postal address, telephone number, and email address.</li>
        <li>
        A statement by you that the above information is accurate and that you are the copyright or intellectual property
        owner or authorized to act on the copyright or intellectual property owner's behalf.
        </li>
        <li>
        A physical signature or digital signature in a recognized industry-standard format such as PGP, of the copyright or
        intellectual property owner or the person authorized to act on their behalf. Unsigned notifications will not be
        processed.
        </li>
        </ul>
        <h2>2. Responding to notifications</h2>
        <p>We will respond to copyright infringement notifications within two business days.</p>
        <p>
        If we are not provided with enough information to act on the notification, including all the items listed in the
        section above, we will reject the notification and notify the submitter that it cannot be acted upon.
        </p>
        <p>
        If the Content is not hosted on our servers (for instance, if the notification concerns an image hosted on another
        site which is merely displayed on or linked from our site) we will respond, notifying the submitter that the Content
        is not hosted by us and referring them to the hosting site.
        </p>
        <p>
        Provided we are able to act upon the notification, we will contact the member who posted the Content and inform them
        of the notification and claim of intellectual property rights.
        </p>
        <p>The member will have two business days to respond. They may respond as follows:</p>
        <ul>
        <li>
        Admit that they have posted something to which they do not hold intellectual property rights. In this case, the
        member may delete the Content from the Service, or we may render it inaccessible.
        </li>
        <li>
        Submit a counter-notification, stating that they have the right to post the Content, and that they are prepared to
        uphold this claim in court. The process for this is outlined below.
        </li>
        <li>
        Respond saying that they do not believe they have infringed any intellectual property rights, but that they do not
        wish to formally submit a counter-notification. In this case, the member may delete the Content from the Service, or
        we may render the Content inaccessible.
        </li>
        <li>If the member fails to respond, we will render the Content inaccessible.</li>
        </ul>
        <p>
        When Content is deleted or rendered inaccessible, we will take reasonable efforts to ensure it cannot be accessed via
        the Service. However, caching or external references may mean that Content remains accessible for some time, including
        on third-party sites or applications. Third-party sites and applications are not under Growstuff's control. If
        infringing Content has been removed or rendered inaccessible via the Service but is still available via third-party
        sites and applications, the copyright or intellectual property holder may contact the operators of those
        sites/applications to notify them of the infringement.
        </p>
        <h2>3. Counter-notification and restoration process</h2>
        <p>
        A counter-notification is a statement that you do not believe your content infringes on another person's rights, or
        that your use of another person's copyrighted material falls into a protected category under law.
        </p>
        <p>
        By filing a counter-notification, you are indicating that you are willing to defend your use of the material in court,
        if the copyright owner chooses to bring a lawsuit against you for your use of the material. This may involve civil
        and/or criminal penalties. We strongly suggest you contact an intellectual property lawyer licensed to practice law in
        your jurisdiction before you do this, so that you are aware of your rights and obligations under the law.
        </p>
        <p>A counter-notification must contain the following items:</p>
        <ul>
        <li>
        Your signature. Signatures may be a physical signature or a digital signature in a recognized industry-standard
        format such as PGP.
        </li>
        <li>
        The URL of the Content that has been called into question (this will have been provided in the original
        notification).
        </li>
        <li>
        A statement that you have a good faith belief that the copyright infringement notification was sent as a result of
        a mistake or misidentification of the material. This should include any reasons why you believe your use of the
        material is not infringing.
        </li>
        <li>Your name, address, and telephone number.</li>
        </ul>
        <p>
        We will forward your counter-notification, in full, to the submitter of the original notification. They will then have
        14 days to initiate legal action and notify us that they have done so.
        </p>
        <p>In the meantime, we will render the Content inaccessible.</p>
        <p>If, after 14 days, we have not been informed that legal proceedings have been initiated, we will restore the Content.</p>
        <p>
        If you have filed a counter-notification, you may not re-post the allegedly infringing material until we notify you
        that the waiting period has expired.
        </p>
        <h2>4. Repeat offenses</h2>
        <p>Members who receive three or more valid copyright infringement notices will have their accounts terminated.</p>
        <p>
        If a counter-notification is filed, or if the member has stated that they do not accept the allegation of copyright
        infringement but do not wish to formally file a counter-notification, the notification will not be counted toward
        termination.
        </p>
        <p>
        We also reserve the right to terminate the accounts of those who, in our opinion, misuse or abuse the copyright
        infringement notification process against other members.
        </p>
        <h2>5. Changes</h2>
        <p>
        We may change our Copyright Infringement Policy from time to time. A history of changes to this Policy is available
        via our public source code repository at
        <a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>. We will take reasonable steps
        to notify you of any substantial changes to this Policy; however, it is your responsibility to check this Policy
        periodically for changes. Your continued use of this site after any change in this Policy will constitute your
        acceptance of such change.
        </p>
        <h2>6. Creative Commons license</h2>
        <p>
        This Copyright Infringement Policy is based on one developed by Dreamwidth
        (<a href="http://www.dreamwidth.org/legal/dmca">http://www.dreamwidth.org/legal/dmca</a>) and is licensed under a
        <a href="http://creativecommons.org/licenses/by-sa/2.5/">Creative Commons Attribution-ShareAlike 2.5 License</a>.
        </p>
    data_use:
      title: "API and Data Use Policy"
      body_html: |
        <p>
        We hate legalese, so we've tried to make this policy readable. If you've got any questions, feel free to
        <a href="mailto:support@growstuff.org">ask us</a>, and we'll do our best to answer.
        </p>
        <p>
        This API and Data Use Policy covers all websites (such as <a href="http://www.growstuff.org">growstuff.org</a>) owned
        and operated by the Growstuff Maintainers ("Growstuff", "we", "us", "our") and all associated services, collectively
        referred to as "the Service".
        </p>
        <p>
        In particular, this policy covers any access to the Service via any Application Programming Interface, feeds,
        spidering, scraping, or any other automated or programmatic access to the Structured Data or Content available via the
        Service (collectively, the "API"). This policy applies to anyone who uses the API ("you", "developer").
        </p>
        <h2>1. API Provided As-Is, and Subject to Change</h2>
        <p>
        Growstuff provides its API on an as-is basis, as described under "Disclaimer of Warranties" in our
        <a href="http://www.growstuff.org/policy/tos">Terms of Service</a>.
        </p>
        <p>
        Growstuff's API is subject to change. We will make reasonable efforts to notify developers of changes and of the
        release status of any API features. You should make reasonable efforts to keep up with Growstuff technical news via
        our forums, mailing lists, or other channels.
        </p>
        <h2>2. Don't overload our servers</h2>
        <p>
        You agree to limit your access to the API in such a way as to prevent excessive load on the Service. Growstuff
        reserves the right to restrict or rate-limit access to the API if necessary to maintain the performance of the
        Service.
        </p>
        <h2>3. Use of Growstuff Data and Content</h2>
        <p>
        You agree to observe the terms of the <a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">Creative
        Commons Attribution-ShareAlike (CC-BY-SA) 3.0 Unported License</a> under which our Structured Data is made available.
        You agree to observe the copyright and intellectual property rights of Growstuff's members with regard to their
        Content posted on the Service, including but not limited to posts, comments, images, etc.
        </p>
        <p>
        You agree to respect any privacy settings which pertain to the Structured Data or Content you access via the API. You
        agree not to republish any Structured Data or Content with more permissive access than was originally intended by the
        member who posted it.
        </p>
        <p>
        Growstuff acknowledges that Structured Data and Content made available under the API may be cached or retained by
        third parties for any length of time. However, we request that if you are building an application using current
        Structured Data and Content, you will make reasonable efforts to regularly update it, including removing any
        Structured Data or Content that is deleted from the Service, and reflecting any changes in privacy settings that
        pertain to it.
        </p>
        <p>
        Growstuff contains data from the
        <a href="https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd">Australian Food Composition
        Database</a> by <a href="https://www.foodstandards.gov.au/legal-policies/copyright">Food Standards Australia New
        Zealand</a> under a CC-BY-4.0 license.
        </p>
        <h2>4. Authentication</h2>
        <p>
        Growstuff reserves the right to require authentication and/or app registration as a condition of use of the API and
        Data.
        </p>
        <p>
        If you provide users with the ability to log in to Growstuff, you must do so via OAuth. You may not require users to
        provide their Growstuff login name and password.
        </p>
        <h2>5. Penalties</h2>
        <p>If you violate the terms of this Policy, Growstuff may restrict your access to the API.</p>
        <h2>6. Changes</h2>
        <p>
        We may change our API and Data Use Policy from time to time. A history of changes to this Policy is available via our
        public source code repository at
        <a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>. We will take reasonable steps
        to notify you of any substantial changes to this Policy; however, it is your responsibility to check this Policy
        periodically for changes. Your continued use of this site after any change in this Policy will constitute your
        acceptance of such change.
        </p>
        <h2>7. Creative Commons License</h2>
        <p>
        This API and Data Use Policy is licensed under a
        <a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">Creative Commons Attribution-ShareAlike (CC-BY-SA)
        3.0 Unported License</a>.
        </p>
    privacy:
      title: "Privacy Policy"
      body_html: |
        <p>
        We hate legalese, so we've tried to make this policy readable. If you've got any questions, feel free to
        <a href="mailto:support@growstuff.org">ask us</a>, and we'll do our best to answer.
        </p>
        <p>
        This privacy statement ("Privacy Policy") covers all websites (such as
        <a href="http://www.growstuff.org/">growstuff.org</a>) owned and operated by the Growstuff maintainers ("Growstuff",
        "we", "us", "our") and all associated services, collectively referred to as "the Service".
        </p>
        <p>
        We use information you share with us for our internal business purposes. We do not sell your information. This notice
        tells you what information we collect, how we use it, and steps we take to protect and secure it.
        </p>
        <h2>1. Information we collect</h2>
        <h3>1.1 Non-Personal Data</h3>
        <p>
        Like most website operators, we collect Non-Personal Data such as browser type, language preference, referring site,
        and the date and time of each visitor request.
        </p>
        <p>
        We collect this to understand how our visitors and members use our service, and use it to make decisions about how to
        change and adapt the service.
        </p>
        <p>
        From time to time, we may release Non-Personal Data in aggregate form (for instance, by publishing trends in site
        usage) to explain our reasoning in making decisions. We will not release individual information, only aggregate
        information.
        </p>
        <h3>1.2 Personal Data</h3>
        <p>
        Personal Data is anything which can be used to identify or contact you, such as your legal name, email address, IP
        address, or physical location.
        </p>
        <h4>1.2.1 Automatically collected Personal Data</h4>
        <p>
        We automatically collect some Personal Data, such as IP address, provided by your browser and your computer whenever
        you visit our website.
        </p>
        <p>We collect this information for several purposes:</p>
        <ul>
        <li>To diagnose and repair network issues with your use of the site;</li>
        <li>To estimate the number of users accessing the service from specific geographic regions;</li>
        <li>To help prevent fraud and abuse.</li>
        </ul>
        <h4>1.2.2 Email address</h4>
        <p>
        In order to register for the service, you must give us your email address. We will use your email address to send
        confirmation of certain actions, such as when you change your password. We will contact you when it's necessary to
        complete a request that you've initiated, or if there's a critical or administrative issue affecting your use of
        the service.
        </p>
        <p>
        Once you have created your account, you can choose to subscribe to certain events and have notifications of those
        events sent to you via email. You will be able to change your mind and opt out of receiving notifications via email at
        any time.
        </p>
        <p>
        We will never sell or provide your email address to any third party for marketing purposes, or for any other reason
        except as set out below.
        </p>
        <h4>1.2.3 Optional Personal Data you provide to us</h4>
        <p>
        As you use the service, you have the option to provide more Personal Data, through your profile and other activity on
        the site. Providing this information is strictly optional.
        </p>
        <p>
        You have the option to provide us with your location. You may provide this at whatever level of detail you wish. For
        instance, you may provide your street address, your country of residence, or nothing at all. We use this location to
        provide you with relevant content.
        </p>
        <p>
        Many of your activities on the Service may allow you to post Personal Data or to directly or indirectly disclose
        Personal Data about yourself. For instance, you may disclose Personal Data in a post or comment on the site, by
        uploading a picture, by linking to another website you use, or by recording your gardening activity in detail. All of
        these activities are optional. You should use due caution when disclosing Personal Data through your activity on the
        Service.
        </p>
        <p>
        We will show the information you provide, including any Personal Data it may contain, to others viewing the site, in
        accordance with the privacy options you've selected.
        </p>
        <p>
        The information you provide is also made available to third parties via our API and feeds, in accordance with the
        privacy options you've selected and subject to the terms of our API and Data Use Policy which is available at
        <a href="http://www.growstuff.org/policy/api">http://www.growstuff.org/policy/api</a>.
        </p>
        <p>
        Some of the information you provide is categorised as Structured Data, which is defined more fully in our
        <a href="/policy/tos">Terms of Service</a>. We make Structured Data freely available under a
        Creative Commons Attribution ShareAlike (CC-BY-SA) 3.0 Unported license for use by third parties, in accordance with
        the privacy options you've selected.
        </p>
        <p>
        We may also use any Personal Data you provide, in aggregate, to make decisions about how to change and adapt the
        service. From time to time, we may release information in aggregate form (for instance, by publishing trends in site
        usage) to explain our reasoning in making decisions. We will not release individual information, only aggregate
        information.
        </p>
        <h2>2. Disclosure of Personal Data</h2>
        <p>
        We disclose Personal Data, including optional personal information you have provided but which is not normally
        available to other site users, only to those of our employees, contractors, and volunteers who (i) need to know that
        information in order to operate the service and (ii) have agreed not to disclose it to others. Circumstances in which
        this is necessary include, but are not limited to: troubleshooting and diagnosing technical problems, investigating
        possible Terms of Service violations, and legal compliance issues.
        </p>
        <p>
        We contract with third-party vendors to provide some site features. We will only share personal information with
        third-party vendors to the extent that is necessary for them to provide these site features. We require our
        third-party vendors to provide the same level of privacy protection that we do, and they do not have the right to
        share or use personal information for any purpose other than providing those site features.
        </p>
        <p>
        We may disclose Personal Data or potentially personally-identifying data when that release is required by law or by
        court order, or when we believe in good faith that disclosure is reasonably necessary to protect the safety or rights
        of us, third parties, or the public at large.
        </p>
        <p>
        We reserve the right to transfer your Personal Data to a third party in the event of a sale, merger, liquidation,
        receivership or transfer of all or substantially all of the assets of our company provided that the third party agrees
        to adhere to the terms of the Growstuff Privacy Policy and provided that the third party only uses your Personal Data
        for the purposes that you provided it to us. You will be notified in the event of any such transfer and you will be
        afforded an opportunity to opt out.
        </p>
        <h2>3. Cookies</h2>
        <p>
        A cookie is a string of information that a website stores on a visitor's computer, and that the visitor's browser
        provides to the website each time the visitor returns. We use cookies to help us identify and track visitors, their
        usage of the website, and their website access preferences. We also use cookies to govern logging into your account.
        </p>
        <p>
        Visitors who do not wish to have cookies placed on their computers should set their browsers to refuse cookies before
        using the site, with the drawback that certain features of the site may not function properly without the aid of
        cookies.
        </p>
        <h2>4. Confidentiality and security</h2>
        <p>
        No data transmission over the Internet can ever be guaranteed to be 100% secure. You use this service at your own
        risk. However, we will take all reasonable steps (including appropriate technical and organisational measures) to
        protect your Personal Data.
        </p>
        <p>
        Your account information is password-protected. We recommend that you choose a strong and secure password. We use
        industry-standard encryption to protect your password on our servers.
        </p>
        <p>
        If we learn of a system security breach, we will notify you electronically so you can take appropriate steps to
        protect yourself.
        </p>
        <h2>5. Deleting your information</h2>
        <p>
        You can change or delete any optional information that you've provided us at any time. If you change or delete any
        optional information you've provided, the change will take place immediately on the Service. However, caching or
        references to the data, including in third-party applications based on the Service, may mean that formerly available
        data remains available for some time.
        </p>
        <p>
        As part of the day-to-day operation of the Service, we will make regular copies of the data contained in the databases
        for backup purposes. These backups can potentially contain deleted data for several weeks or months. These backups
        will also be governed by the rules for Disclosure of Personal Data.
        </p>
        <h2>6. Changes</h2>
        <p>
        We may change our Privacy Policy from time to time. A history of changes to this Policy is available via our public
        source code repository at <a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>. We
        will take reasonable steps to notify you of any substantial changes to this Policy; however, it is your responsibility
        to check this Policy periodically for changes. Your continued use of this site after any change in this Privacy Policy
        will constitute your acceptance of such change.
        </p>
        <h2>7. Contacting us</h2>
        <p>
        If you have questions about this policy, you can contact us at
        <a href="mailto:support@growstuff.org">support@growstuff.org</a>.
        </p>
        <h2>8. Creative Commons</h2>
        <p>
        This privacy policy is based on one developed by Automattic
        (<a href="http://automattic.com/privacy/">http://automattic.com/privacy/</a>) and amended by Dreamwidth
        (<a href="http://dreamwidth.org/legal/privacy">http://dreamwidth.org/legal/privacy</a>) and is licensed under a
        <a href="http://creativecommons.org/licenses/by-sa/2.5/">Creative Commons Attribution-ShareAlike 2.5 License</a>.
        </p>
    support:
      title: "Support - Frequently Asked Questions"
      body_html: |
        <h2>About Growstuff</h2>
        <h3>Who runs Growstuff?</h3>
        <p>
        Growstuff was started by Alex Bayley (<a href="/members/skud">Skud</a>), an open source software developer and keen
        veggie gardener from Melbourne, Australia. It is now maintained by the community.
        </p>
        <h3>How did Growstuff get started?</h3>
        <p>
        The idea of Growstuff came out of a discussion at an open source conference in Spain in 2012. We wanted a free, open
        source of information about planting and growing crops, and realised the best way to do this would be to crowdsource
        it from gardeners around the world.
        </p>
        <p>We first set up Growstuff as an open source project in August 2012, and quietly launched it in March 2013.</p>
        <h3>Is Growstuff a non-profit?</h3>
        <p>
        Growstuff is a community-run project. You should also know that software and aggregated data about crops and who's
        growing them are freely available under open licenses.
        </p>
        <h3>Can I advertise on Growstuff?</h3>
        <p>Sorry, we're 100% ad-free!</p>
        <p>
        If you're a member, you can post things to trade or sell in our trading post area, but we don't have and will never
        have banner ads or the like. We believe that supporting a website through outside advertising makes for a less
        pleasant experience for our members and visitors, and is not a sustainable business model.
        </p>
        <h3>What's the status of Growstuff? Is it in beta?</h3>
        <p>
        We don't much like the word "beta" or the idea it represents. Growstuff is in a constant state of change and
        improvement, and we hope we will always be adding new features and making things better for our members.
        </p>
        <p>
        If you find any bugs or problems, please let us know via our support forum. If a feature you want isn't available yet,
        check back soon!
        </p>
        <h2>Membership</h2>
        <h3>Can I use Growstuff for free?</h3>
        <p>Absolutely! If you enjoy the site, we'd appreciate you considering a donation (see the link in the footer).</p>
        <h3>Can I get a membership for my family, school, or community group?</h3>
        <p>Yup! Feel free to sign up as "JonesFamily" or "SmithfieldCommunity" or whatever floats your boat.</p>
        <p>
        Just keep in mind that you are responsible for anything that happens under that account, so be careful who you allow
        to use it. In due course, we are hoping to develop features to help community gardens share with their
        members/gardeners, so that they can track what's planted in the community garden without having to log in as the
        community garden account. We'll publicise this widely when it's ready, so keep an ear to the ground.
        </p>
        <h2>Profile, settings, and privacy</h2>
        <h3>How do I add a picture to my profile?</h3>
        <p>
        Profile pictures are provided by <a href="https://gravatar.com">Gravatar</a>, a service that provides "Globally
        Recognised Avatars", run by the people who operate the WordPress blogging platform.
        </p>
        <p>
        If you have ever signed up for Gravatar in the past, using the same address as you signed up for Growstuff, you will
        already have a picture for your profile.
        </p>
        <p>
        If you have signed up for Growstuff with a different email address than your Gravatar address, you will need to add it
        on Gravatar.
        </p>
        <p>
        If you have never signed up for Gravatar before, you can create an account and upload a picture, which will appear not
        only on Growstuff, but on any other site which supports Gravatars and where you use the same email address.
        </p>
        <h3>Do I have to fill in all this personal stuff?</h3>
        <p>
        Your profile asks several questions about you, which you can choose to answer (or not) as you see fit. We don't
        require personal information like your legal name, gender, or age for tracking or demographic purposes -- one of the
        benefits of not having ads on our site!
        </p>
        <p>
        When it comes to location, it really helps if you can provide that to Growstuff because we use it to suggest things to
        grow. However, you can do it at whatever level of detail you're comfortable with: perhaps the name of your town, or
        your state or province, or even your country if the country is small enough and has a fairly consistent climate. Just
        choose something that is close enough to give you accurate growing advice, and vague enough to feel safe.
        </p>
        <p>
        You can read more about the privacy of your information in our <a href="http://growstuff.org/policy/privacy">Privacy
        Policy</a>.
        </p>
        <h2>Crops, gardens, and planting</h2>
        <h3>How can I add a new crop?</h3>
        <p>
        For now, please drop a note in <a href="http://www.growstuff.org/posts/skud-20130319-requests-for-new-crops">Requests
        for new crops</a> on our <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp; Support
        forum</a>.
        </p>
        <h3>Will you add non-edible plants?</h3>
        <p>
        We do not currently have plans to add plants which are not edible or which are not "useful" in a food-growing or
        sustainability context -- these might include companion plants, green manure crops, plants used to manage pests or
        diseases, and the like. If you're thinking of purely ornamental plants, we probably won't be adding them anytime soon.
        </p>
        <p>
        However, we are hoping, in future, to support the ability for any member to plant "unofficial" plants that aren't in
        our crop database.
        </p>
        <h2>Posting, commenting, and forums</h2>
        <h3>What formatting can I use in posts and comments?</h3>
        <p>
        We use <a href="http://daringfireball.net/projects/markdown/syntax/">Markdown</a> syntax, which offers a pretty wide
        range of options from simple emphasis (bold and italics) to links, pictures, and more. We're hoping to install a
        toolbar to help you generate the right syntax, but in the meantime I'm afraid all we can offer is the rather technical
        documentation linked above.
        </p>
        <h2>Forthcoming features</h2>
        <h3>Where can I see what features are planned?</h3>
        <p>
        Our software developers use a tracking tool called Pivotal Tracker, and you can see ours at
        <a href="http://tracker.growstuff.org">http://tracker.growstuff.org/</a>. This tells you what features we are
        currently working on and plan to work on soon.
        </p>
        <p>Pivotal Tracker's interface shows three columns of information:</p>
        <ul>
        <li>the "Current" section shows the features (called "stories") that we're working on at the moment</li>
        <li>"Backlog" shows you stories that we're planning to work on in the nearish future</li>
        <li>
        "Icebox" contains stories that we've identified as things we'd like to do, but which don't have a timeframe set yet.
        </li>
        </ul>
        <h3>Where can I suggest a feature I'd like to see?</h3>
        <p>
        We suggest checking the <a href="http://tracker.growstuff.org/">tracker</a> first (see above) to see if it's something
        we're already planning or talking about. Once you've done that, if it's not already planned or you have some other
        comments to make, you can post your suggestion in the <a href="/forums/growstuff-feedback-support">Feedback &amp;
        Support forum</a>.
        </p>
        <h2>Developers and API</h2>
        <h3>Is there a Growstuff API?</h3>
        <p>
        At present there is no official API, as our site is still changing so rapidly. However, we do expose some of our data
        via JSON and/or RSS feeds, and you're welcome to play with it, on the understanding that it may change under you. You
        can find <a href="https://github.com/Growstuff/growstuff/wiki/API">API docs on our wiki</a>.
        </p>
        <p>Use of our API and data is subject to the <a href="http://www.growstuff.org/policy/api">API and Data Use Policy</a>.</p>
        <h3>What license is your data under?</h3>
        <p>
        Growstuff's data is available under the <a href="http://creativecommons.org/licenses/by-sa/3.0/">Creative Commons
        Attribution-ShareAlike (CC-BY-SA) 3.0 Unported license</a>. This means you can re-use it as long as you
        attribute it to Growstuff (by linking back to our site), and as long as your own app/site/project shares its own
        content or data under CC-BY-SA.
        </p>
        <p>See our <a href="http://growstuff.org/policy/api">API and Data Use Policy</a> for more information.</p>
        <h2>Volunteering and jobs</h2>
        <h3>Are you hiring?</h3>
        <p>Sadly, no. We're a self-funded/bootstrapped community group.</p>
        <p>If you want to get involved, see below.</p>
        <h3>How can I volunteer to help Growstuff?</h3>
        <p>
        First and foremost, by being an active member of the site -- growing crops, tracking your harvests, posting in our
        forums, getting to know other members -- you help build our database and our community, without which Growstuff would
        be completely pointless. So, thanks for that!
        </p>
        <p>
        Secondly, we'd love it if you could spread the word about Growstuff to your friends who grow their own food or who
        might like to try. You can see some tips on how to do that below.
        </p>
        <p>
        Growstuff's software is built with the help of volunteer developers, too. If you're a coder or would like to learn how
        to code, you can join us in that. All are welcome, regardless of experience.
        </p>
        <p>
        We also have volunteer crop wranglers, who manage our crops database, and moderators, who help keep the forums running
        smoothly. These are usually chosen from among our most active and helpful members.
        </p>
        <h3>How can I get involved as a coder?</h3>
        <p>
        Start by checking out our <a href="https://github.com/Growstuff/growstuff/wiki/">wiki</a>, code on
        <a href="http://github.com/Growstuff/growstuff">GitHub</a>, and <a href="http://tracker.growstuff.org">tracker</a> to
        get an idea of how we work.
        </p>
        <p>
        If you want to get involved, you should join our
        <a href="http://lists.growstuff.org/mailman/listinfo/discuss">discussion mailing list</a>.
        </p>
        <h3>My coding skills are rusty or non-existent. Can I still get involved?</h3>
        <p>
        Sure! We love to mentor new coders, people who haven't coded in a while, or people who are just learning our platform
        (Ruby on Rails) for the first time. We work by pair programming, and can get you started on easy stories, starting
        with something as simple as fixing a typo or HTML tag (check the "easy" tag in our
        <a href="http://tracker.growstuff.org">tracker</a> for some examples).
        </p>
        <h3>How can I help spread the word about Growstuff?</h3>
        <p>
        First and foremost, by telling your friends and inviting them to join and be part of it. We don't want to be spammy
        about it, so we'll never ask to scrape your address book or automatically post Facebook updates or tweet on your
        behalf. But we would really love it if you'd tell people in your own words.
        </p>
        <p>
        Places to spread the word online: Facebook, Twitter, and other social media; your own blog or website; gardening or
        sustainability forums you participate in.
        </p>
        <p>
        Or offline: tell friends, family and neighbours; spread the word through your local community gardens, farmers
        markets, or produce swaps; contact your local sustainability or Transition group; or any other place where you think
        food-growers might be.
        </p>
        <h2>Terms of service, copyright, and other abuse</h2>
        <h3>Where can I report a violation of the Terms of Service or Community Guidelines?</h3>
        <p>
        You can post in our <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp; Support
        forum</a> or send email to <a href="mailto:support@growstuff.org">support@growstuff.org</a>.
        </p>
        <h3>What do you consider spam, and how can I report it?</h3>
        <p>
        There are many kinds of spam. The most obvious is repeated, unwanted commercial advertising. Many spammers also post
        irrelevant, nonsensical, or low-value content to forums to try and get you to click on a link, or just to see what
        they can get away with.
        </p>
        <p>Please report all these kinds of spam!</p>
        <p>
        For now, because we're so new, we don't have a good spam reporting mechanism set up. However, you can drop a link in
        our <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp; Support forum</a> and we'll do
        what we can.
        </p>
        <h3>Someone posted something I believe infringes copyright. Where can I report it?</h3>
        <p>
        If you are the copyright owner, you can submit a complaint by following the procedure outlined in our
        <a href="http://growstuff.org/policy/copyright">Copyright Infringement Policy</a>.
        </p>
        <h3>Is Growstuff safe for kids to use?</h3>
        <p>
        As a website that's focused on growing food, we expect Growstuff to be a pretty safe and friendly environment.
        However, some parts of the site (such as posts made by members) may contain mature concepts, coarse language, and the
        like. If you don't want your kids exposed to these, we strongly suggest you supervise their use of Growstuff. We also
        suggest you be careful about what personal information your kids share on Growstuff.
        </p>
        <h2>Further support</h2>
        <h3>Where can I find a list of known issues with the site?</h3>
        <p>In our GitHub <a href="https://github.com/Growstuff/growstuff/issues">Known Issues</a>.</p>
        <h3>My question's not answered here. Where can I ask for further support?</h3>
        <p>
        On our <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp; Support forum</a>. Please
        check the list of known issues before posting.
        </p>
        <h3>Where can I post feedback/kudos?</h3>
        <p>
        We love feedback! Drop us a note in our <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback
        &amp; Support forum</a>. (Is there an echo in here?)
        </p>
        <h3>How else can I contact you?</h3>
        <p>
        If you need help with something that hasn't been covered here, then you can send an email to
        <a href="mailto:support@growstuff.org">support@growstuff.org</a>.
        </p>
        <p>Media/press enquiries can go to <a href="mailto:media@growstuff.org">media@growstuff.org</a>.</p>
        <p>
        If you have an enquiry about the site in general (eg. businessy stuff, or just want to get in touch with someone
        official in a non-support-like way), you can send an email to
        <a href="mailto:info@growstuff.org">info@growstuff.org</a>.
        </p>
    tos:
      title: "Growstuff Terms of Service"
      body_html: |
        <p>
        We hate legalese, so we've tried to make our Terms of Service readable. If you've got any questions, feel free to
        <a href="mailto:support@growstuff.org">ask us</a>, and we'll do our best to answer.
        </p>
        <p>
        The Growstuff maintainers ("we", "us", "our", "Growstuff") present the following terms and conditions, which govern
        your use of the Growstuff website at <a href="http://www.growstuff.org">growstuff.org</a>, and all content, services
