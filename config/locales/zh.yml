  pages:
    community_guidelines:
      title: "Growstuff 社区准则"
      body_html: |
        <p>Growstuff 是一个由食品园丁创建并为食品园丁服务的社区。我们正在共同建立一个网站，在这里我们可以分享我们的经验、知识和我们收获的产品。 Growstuff 最重要的是人。为了让 Growstuff 蓬勃发展，我们需要人们添加他们的作物，分享他们的知识，并帮助建立网站本身。</p>
        <p>无论您对 Growstuff 有什么兴趣，这里都欢迎您，并将受到尊重。特别是：</p>
        <ul>
        <li>
        <p>我们欢迎任何年龄、性别认同或表达、种族、国籍、宗教或无宗教信仰、政治观点、性取向、婚姻状况、家庭结构、能力或残疾、外表、亚文化或其他身份或自我认同的人。</p>
        </li>
        <li>
        <p>虽然Growstuff主要专注于食品园艺，但我们欢迎各种园丁，包括有机和传统种植者；在田地、阳台或水培系统中种植作物的人；从事商业或非商业园艺的人；那些靠农作物维生的人和那些出于其他原因从事园艺的人。</p>
        </li>
        <li>
        <p>我们欢迎各种技能和经验水平的人，我们不认为仅仅因为您是新手或正在学习而轻蔑或粗鲁地发表评论。</p>
        </li>
        <li>
        <p>我们社区中的每个角色都很重要，包括为我们的网站贡献技能、知识和信息的园丁；帮助构建它的编码员、设计师和其他技术人员；版主和其他帮助我们社区蓬勃发展的人；或任何其他形式的参与。我们相信共同努力，并优先考虑沟通和相互理解。</p>
        </li>
        </ul>
        <p>如果您想参与 Growstuff 社区（包括我们的网站和任何辅助论坛，例如我们的邮件列表、IRC 频道等），您需要同意我们对包容性和相互尊重的总体承诺，以及以下具体政策：</p>
        <ul>
        <li>
        <p>禁止骚扰任何 Growstuff 社区成员。骚扰包括针对个人或团体的诽谤；针对任何个人或团体的不受欢迎的性言论；公共场所露骨的色情评论或图像；跟踪或其他重复的、不必要的接触；或任何重复或持续的行为，扰乱他人享受 Growstuff 网站或社区的乐趣。</p>
        </li>
        <li>
        <p>我们社区成员的隐私非常重要。未经会员明确同意，您不得披露任何会员的个人详细信息（包括在 Growstuff 之外为人所知的姓名、位置、就业详细信息、家庭详细信息、Growstuff 之外的联系方式或任何其他身份信息或个人信息）。</p>
        </li>
        <li>
        <p>虽然我们让您在我们的网站上选择自己的名字，并且不坚持要求您在我们的网站上使用与钱包中卡上的名字相同的名字，但您不得创建或使用假名帐户来误导他人、逃避责任或以其他方式造成麻烦。 （这通常称为“sockpuppet”帐户。）</p>
        </li>
        </ul>
        <p>如果您经历或目睹了违反这些社区准则的行为，您可以向support@growstuff.org举报。我们将认真听取并认真对待您的报告。一旦我们调查了情况，我们可能会采取我们认为必要的任何行动。例如，我们可能会发出警告，或者在严重的情况下，我们可能会暂停或禁止人们进入我们的社区。如果发生这种情况，我们将始终参考我们的政策文件，告诉受影响的人我们采取行动的原因。</p>
        <p>我们不想让这些指南太长或过于墨守成规，所以除了最后一条指南外，我们将其留在那里。正如比尔和泰德所说：<em>彼此优秀</em>。并种植东西。</p>
        <h2>知识共享许可证</h2>
        <p>这些社区准则根据<a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">知识共享署名-相同方式共享 (CC-BY-SA) 3.0 未移植许可证</a> 获得许可。</p>
    copyright:
      title: "版权侵权政策"
      body_html: |
        <p>我们讨厌法律术语，因此我们努力使本政策易于阅读。如果您有任何疑问，请随时<a href="mailto:support@growstuff.org">询问我们</a>，我们会尽力解答。</p>
        <p>本版权侵权政策涵盖 Growstuff 维护者（“Growstuff”、“我们”、“我们的”、“我们的”）拥有和运营的所有网站（例如 <a href="http://www.growstuff.org">growstuff.org</a>）以及所有相关服务，统称为“服务”。它描述了您如何举报侵犯服务版权的行为。</p>
        <p>Growstuff 尊重他人的知识产权，我们也要求我们的用户也这样做。 Growstuff 会员需要根据<a href="http://www.growstuff.org/policy/tos">服务条款</a>确保他们拥有向服务发布内容的合法权利。</p>
        <p>Growstuff 总部位于澳大利亚墨尔本，不受美国数字千年版权法案 (DMCA) 的规定约束。但是，我们制定了与 DMCA 要求类似的政策和程序，因为我们相信它们构成了在澳大利亚运营的网络服务的最佳实践。</p>
        <h2>1。通知我们侵权行为</h2>
        <p>如果您认为 Growstuff 会员在服务中发布内容侵犯了您的知识产权，您可以按照以下步骤通知我们并要求删除该内容。</p>
        <p>通知可通过电子邮件提交至<a href="mailto:support@growstuff.org">support@growstuff.org</a></p>
        <p>我们更喜欢通过电子邮件接收通知。</p>
        <p>通过任何其他机制或论坛发送的版权侵权通知将不会被采取行动。</p>
        <p>您必须提供以下信息：</p>
        <ul>
        <li>足够的信息来识别被侵权的版权作品。例如，如果作品是出版的书籍，请提供标题、作者和 ISBN；如果作品是杂志文章，请提供标题、作者、杂志名称和杂志期；如果该作品可在互联网上找到，请提供该作品的 URL。</li>
        <li>Growstuff 上未经许可复制您作品的特定页面的 URL。一般性描述或非特定链接（例如 Growstuff 的主页）无法执行。</li>
        <li>您的邮寄地址、电话号码和电子邮件地址。</li>
        <li>您声明上述信息准确无误，并且您是版权或知识产权所有者或被授权代表版权或知识产权所有者行事。</li>
        <li>版权或知识产权所有者或授权代表其行事的人采用公认的行业标准格式（例如 PGP）的物理签名或数字签名。未签名的通知将不会被处理。</li>
        </ul>
        <h2>2。回复通知</h2>
        <p>我们将在两个工作日内回复版权侵权通知。</p>
        <p>如果我们没有提供足够的信息来对通知采取行动，包括上一节中列出的所有项目，我们将拒绝该通知并通知提交者无法采取行动。</p>
        <p>如果内容未托管在我们的服务器上（例如，如果通知涉及托管在其他网站上的图像，而该图像仅显示在我们的网站上或从我们的网站链接），我们将做出回应，通知提交者该内容不是由我们托管，并将他们转至托管网站。</p>
        <p>如果我们能够根据通知采取行动，我们将联系发布内容的会员并向他们告知通知和知识产权主张。</p>
        <p>会员将有两个工作日的时间回复。他们可能会做出如下回应：</p>
        <ul>
        <li>承认他们发布了不拥有知识产权的内容。在这种情况下，会员可以从服务中删除内容，或者我们可能使其无法访问。</li>
        <li>提交反通知，声明他们有权发布内容，并准备在法庭上支持这一主张。下面概述了此过程。</li>
        <li>回应称他们不认为自己侵犯了任何知识产权，但他们不希望正式提交反通知。在这种情况下，会员可以从服务中删除内容，或者我们可以使内容无法访问。</li>
        <li>如果会员未能回复，我们将导致内容无法访问。</li>
        </ul>
        <p>当内容被删除或变得无法访问时，我们将采取合理的努力确保无法通过服务访问该内容。但是，缓存或外部引用可能意味着内容在一段时间内仍可访问，包括在第三方网站或应用程序上。第三方网站和应用程序不受 Growstuff 的控制。如果侵权内容已被删除或无法通过服务访问，但仍可通过第三方网站和应用程序获得，版权或知识产权持有人可以联系这些网站/应用程序的运营商，通知他们侵权情况。</p>
        <h2>3。反通知和恢复流程</h2>
        <p>反通知是一种声明，表明您不认为您的内容侵犯了他人的权利，或者您对他人受版权保护的材料的使用属于法律保护类别。</p>
        <p>通过提交反通知，您表明如果版权所有者选择因您使用该材料而对您提起诉讼，您愿意在法庭上为您对该材料的使用进行辩护。这可能涉及民事和/或刑事处罚。我们强烈建议您在执行此操作之前联系在您所在司法管辖区获得执业资格的知识产权律师，以便您了解法律规定的权利和义务。</p>
        <p>反通知必须包含以下内容：</p>
        <ul>
        <li>你的签名。签名可以是物理签名或采用公认的行业标准格式（例如 PGP）的数字签名。</li>
        <li>受到质疑的内容的 URL（这将在原始通知中提供）。</li>
        <li>一份声明，表明您真诚地相信版权侵权通知是由于材料错误或错误识别而发送的。这应包括您认为您对该材料的使用不侵权的任何理由。</li>
        <li>您的姓名、地址和电话号码。</li>
        </ul>
        <p>我们会将您的反通知完整转发给原始通知的提交者。然后他们将有 14 天的时间提起法律诉讼并通知我们他们已采取行动。</p>
        <p>同时，我们将使内容无法访问。</p>
        <p>如果 14 天后我们仍未收到已启动法律诉讼的通知，我们将恢复内容。</p>
        <p>如果您已提交反通知，则在我们通知您等待期已过之前，您不得重新发布涉嫌侵权的材料。</p>
        <h2>4。重复犯罪</h2>
        <p>收到三份或三份以上有效版权侵权通知的会员将被终止其帐户。</p>
        <p>如果提出反通知，或者会员声明不接受侵犯版权的指控但不希望正式提出反通知，则该通知将不会计入终止。</p>
        <p>我们还保留终止那些我们认为滥用或滥用针对其他会员的版权侵权通知流程的人的帐户的权利。</p>
        <h2>5。变化</h2>
        <p>我们可能会不时更改我们的版权侵权政策。可通过我们的公共源代码存储库<a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>获取本政策的变更历史记录。我们将采取合理措施通知您本政策的任何重大变更；但是，您有责任定期检查本政策是否有变更。本政策发生任何变更后，您继续使用本网站即表示您接受此类变更。</p>
        <h2>6。知识共享许可</h2>
        <p>本版权侵权政策基于 Dreamwidth (<a href="http://www.dreamwidth.org/legal/dmca">http://www.dreamwidth.org/legal/dmca</a>) 制定的政策，并根据<a href="http://creativecommons.org/licenses/by-sa/2.5/">知识共享署名-相同方式共享 2.5 许可证</a> 获得许可。</p>
    data_use:
      title: "API和数据使用政策"
      body_html: |
        <p>我们讨厌法律术语，因此我们努力使本政策易于阅读。如果您有任何疑问，请随时<a href="mailto:support@growstuff.org">询问我们</a>，我们会尽力解答。</p>
        <p>本 API 和数据使用政策涵盖 Growstuff 维护者（“Growstuff”、“我们”、“我们的”）拥有和运营的所有网站（例如 <a href="http://www.growstuff.org">growstuff.org</a>）以及所有相关服务，统称为“服务”。</p>
        <p>特别是，本政策涵盖通过任何应用程序编程接口、提要、蜘蛛抓取、抓取对服务的任何访问，或对通过服务提供的结构化数据或内容（统称为“API”）的任何其他自动或编程访问。本政策适用于任何使用 API 的人（“您”、“开发者”）。</p>
        <h2>1。 API 按原样提供，可能会发生变化</h2>
        <p>Growstuff 按原样提供其 API，如我们的<a href="http://www.growstuff.org/policy/tos">服务条款</a>中的“免责声明”所述。</p>
        <p>Growstuff 的 API 可能会发生变化。我们将尽合理努力通知开发人员任何 API 功能的更改和发布状态。您应该做出合理的努力，通过我们的论坛、邮件列表或其他渠道了解 Growstuff 技术新闻。</p>
        <h2>2。不要让我们的服务器超载</h2>
        <p>您同意限制您对 API 的访问，以防止服务负载过大。 Growstuff 保留在必要时限制对 API 访问或速率限制的权利，以维持服务的性能。</p>
        <h2>3。 Growstuff 数据和内容的使用</h2>
        <p>您同意遵守<a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">知识共享署名-相同方式共享 (CC-BY-SA) 3.0 未移植许可证</a>，根据该条款我们的结构化数据可用。您同意遵守 Growstuff 会员在服务上发布的内容（包括但不限于帖子、评论、图像等）的版权和知识产权。</p>
        <p>您同意尊重与您通过 API 访问的结构化数据或内容相关的任何隐私设置。您同意不会重新发布任何具有比发布者最初意图更宽松的访问权限的结构化数据或内容。</p>
        <p>Growstuff 承认 API 下提供的结构化数据和内容可能会被第三方缓存或保留任意时间。但是，我们要求，如果您使用当前的结构化数据和内容构建应用程序，您将做出合理的努力定期更新它，包括删除从服务中删除的任何结构化数据或内容，并反映与其相关的隐私设置的任何更改。</p>
        <p>Growstuff 包含<a href="https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd">澳大利亚食品成分数据库</a>，由<a href="https://www.foodstandards.gov.au/legal-policies/copyright">澳大利亚新西兰食品标准</a>根据 CC-BY-4.0 许可证提供。</p>
        <h2>4。认证</h2>
        <p>Growstuff 保留要求身份验证和/或应用程序注册作为使用 API 和数据的条件的权利。</p>
        <p>如果您为用户提供登录 Growstuff 的功能，则必须通过 OAuth 进行。您可能不要求用户提供其 Growstuff 登录名和密码。</p>
        <h2>5。处罚</h2>
        <p>如果您违反本政策的条款，Growstuff 可能会限制您对 API 的访问。</p>
        <h2>6。变化</h2>
        <p>我们可能会不时更改我们的 API 和数据使用政策。可通过我们的公共源代码存储库<a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>获取本政策的变更历史记录。我们将采取合理措施通知您本政策的任何重大变更；但是，您有责任定期检查本政策是否有变更。本政策发生任何变更后，您继续使用本网站即表示您接受此类变更。</p>
        <h2>7。知识共享许可</h2>
        <p>本 API 和数据使用政策根据 <a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">知识共享署名-相同方式共享 (CC-BY-SA) 3.0 未移植许可证</a> 获得许可。</p>
    privacy:
      title: "隐私政策"
      body_html: |
        <p>我们讨厌法律术语，因此我们努力使本政策易于阅读。如果您有任何疑问，请随时<a href="mailto:support@growstuff.org">询问我们</a>，我们会尽力解答。</p>
        <p>本隐私声明（“隐私政策”）涵盖 Growstuff 维护者（“Growstuff”、“我们”、“我们的”）拥有和运营的所有网站（例如 <a href="http://www.growstuff.org/">growstuff.org</a>）以及所有相关服务，统称为“服务”。</p>
        <p>我们将您与我们分享的信息用于我们的内部业务目的。我们不会出售您的信息。本通知告诉您我们收集哪些信息、我们如何使用这些信息以及我们为保护这些信息而采取的步骤。</p>
        <h2>1。我们收集的信息</h2>
        <h3>1.1 非个人数据</h3>
        <p>与大多数网站运营商一样，我们收集非个人数据，例如浏览器类型、语言偏好、推荐网站以及每个访问者请求的日期和时间。</p>
        <p>我们收集这些信息是为了了解我们的访客和会员如何使用我们的服务，并用它来做出有关如何更改和调整服务的决策。</p>
        <p>我们可能会不时以汇总形式发布非个人数据（例如，通过发布网站使用趋势）来解释我们做出决策的理由。我们不会发布个人信息，只会发布汇总信息。</p>
        <h3>1.2 个人数据</h3>
        <p>个人数据是可用于识别或联系您的任何信息，例如您的法定姓名、电子邮件地址、IP 地址或物理位置。</p>
        <h4>1.2.1 自动收集的个人数据</h4>
        <p>每当您访问我们的网站时，我们都会自动收集您的浏览器和计算机提供的一些个人数据，例如 IP 地址。</p>
        <p>我们收集这些信息有几个目的：</p>
        <ul>
        <li>诊断和修复您使用网站时的网络问题；</li>
        <li>估计特定地理区域访问该服务的用户数量；</li>
        <li>帮助防止欺诈和滥用。</li>
        </ul>
        <h4>1.2.2 电子邮件地址</h4>
        <p>为了注册该服务，您必须向我们提供您的电子邮件地址。我们将使用您的电子邮件地址发送某些操作的确认信息，例如当您更改密码时。当需要完成您发起的请求，或者存在影响您使用服务的关键或管理问题时，我们将与您联系。</p>
        <p>创建帐户后，您可以选择订阅某些活动并通过电子邮件向您发送这些活动的通知。您可以随时改变主意并选择不再通过电子邮件接收通知。</p>
        <p>我们绝不会出于营销目的或出于任何其他原因向任何第三方出售或提供您的电子邮件地址，下文所述除外。</p>
        <h4>1.2.3 您向我们提供的可选个人数据</h4>
        <p>当您使用该服务时，您可以选择通过您的个人资料和网站上的其他活动提供更多个人数据。提供此信息完全是可选的。</p>
        <p>您可以选择向我们提供您的位置。您可以按照您希望的任何详细程度提供此信息。例如，您可以提供您的街道地址、您的居住国家/地区，或者什么也不提供。我们使用此位置为您提供相关内容。</p>
        <p>您在服务上的许多活动可能允许您发布个人数据或直接或间接披露有关您自己的个人数据。例如，您可以在网站上的帖子或评论中、通过上传图片、链接到您使用的其他网站或详细记录您的园艺活动来披露个人数据。所有这些活动都是可选的。通过您在服务上的活动披露个人数据时，您应谨慎行事。</p>
        <p>我们将根据您选择的隐私选项向浏览该网站的其他人展示您提供的信息，包括其中可能包含的任何个人数据。</p>
        <p>您提供的信息也会根据您选择的隐私选项并遵守我们的 API 和数据使用政策的条款（可在<a href="http://www.growstuff.org/policy/api">http://www.growstuff.org/policy/api</a>）通过我们的 API 和 Feed 向第三方提供。</p>
        <p>您提供的一些信息被归类为结构化数据，我们的<a href="/policy/tos">服务条款</a>对此进行了更完整的定义。我们根据 Creative Commons Attribution ShareAlike (CC-BY-SA) 3.0 Unported 许可证免费提供结构化数据，供第三方根据您选择的隐私选项使用。</p>
        <p>我们还可能使用您提供的任何个人数据来共同决定如何更改和调整服务。我们可能会不时以汇总形式发布信息（例如，通过发布网站使用趋势）来解释我们做出决策的理由。我们不会发布个人信息，只会发布汇总信息。</p>
        <h2>2。个人资料的披露</h2>
        <p>我们披露个人数据，包括您提供的可选个人信息，但其他网站用户通常无法获得这些信息，仅披露给我们的员工、承包商和志愿者，他们 (i) 需要了解该信息以运营服务，并且 (ii) 已同意不向其他人披露该信息。需要这样做的情况包括但不限于：故障排除和诊断技术问题、调查可能的服务条款违规行为以及法律合规性问题。</p>
        <p>我们与第三方供应商签约以提供一些网站功能。我们只会在第三方供应商提供这些网站功能所需的范围内与他们共享个人信息。我们要求我们的第三方供应商提供与我们相同级别的隐私保护，并且他们无权出于提供这些网站功能以外的任何目的共享或使用个人信息。</p>
        <p>当法律或法院命令要求披露个人数据或潜在的个人身份数据时，或者当我们真诚地认为披露对于保护我们、第三方或广大公众的安全或权利是合理必要的时，我们可能会披露个人数据或潜在的个人身份数据。</p>
        <p>在出售、合并、清算、接管或转让我们公司的全部或大部分资产时，我们保留将您的个人数据转移给第三方的权利，前提是第三方同意遵守 Growstuff 隐私政策的条款，并且第三方仅将您的个人数据用于您向我们提供的目的。如果发生任何此类转让，您将收到通知，并且您将有机会选择退出。</p>
        <h2>3。饼干</h2>
        <p>Cookie 是网站存储在访问者计算机上的一串信息，并且每次访问者返回时访问者的浏览器都会向网站提供该信息。我们使用 cookie 来帮助我们识别和跟踪访问者、他们对网站的使用情况以及他们的网站访问偏好。我们还使用 cookie 来管理您帐户的登录。</p>
        <p>不希望在计算机上放置 Cookie 的访问者应在使用网站之前将浏览器设置为拒绝 Cookie，但缺点是，如果没有 Cookie 的帮助，网站的某些功能可能无法正常运行。</p>
        <h2>4。保密和安全</h2>
        <p>互联网上的数据传输无法保证 100% 安全。您使用此服务的风险由您自行承担。但是，我们将采取一切合理措施（包括适当的技术和组织措施）来保护您的个人数据。</p>
        <p>您的帐户信息受密码保护。我们建议您选择一个强且安全的密码。我们使用行业标准加密来保护您在我们服务器上的密码。</p>
        <p>如果我们发现系统安全漏洞，我们将以电子方式通知您，以便您采取适当的措施来保护自己。</p>
        <h2>5。删除您的信息</h2>
        <p>您可以随时更改或删除您向我们提供的任何可选信息。如果您更改或删除您提供的任何可选信息，更改将立即在服务上发生。但是，对数据的缓存或引用（包括在基于服务的第三方应用程序中）可能意味着以前可用的数据在一段时间内仍然可用。</p>
        <p>作为服务日常运营的一部分，我们将定期复制数据库中包含的数据以进行备份。这些备份可能包含几周或几个月内已删除的数据。这些备份也将受个人数据披露规则的约束。</p>
        <h2>6。变化</h2>
        <p>我们可能会不时更改我们的隐私政策。可通过我们的公共源代码存储库<a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>获取本政策的变更历史记录。我们将采取合理措施通知您本政策的任何重大变更；但是，您有责任定期检查本政策是否有变更。本隐私政策发生任何变更后，您继续使用本网站即表示您接受此类变更。</p>
        <h2>7。联系我们</h2>
        <p>如果您对此政策有疑问，可以通过<a href="mailto:support@growstuff.org">support@growstuff.org</a>联系我们。</p>
        <h2>8。知识共享</h2>
        <p>本隐私政策基于 Automattic (<a href="http://automattic.com/privacy/">http://automattic.com/privacy/</a>) 制定并由 Dreamwidth (<a href="http://dreamwidth.org/legal/privacy">http://dreamwidth.org/legal/privacy</a>) 修订，并根据 <a href="http://creativecommons.org/licenses/by-sa/2.5/">知识共享署名-相同方式共享 2.5 获得许可许可证</a>。</p>
    support:
      title: "支持 - 常见问题"
      body_html: |
        <h2>关于Growstuff</h2>
        <h3>Growstuff 是谁运营的？</h3>
        <p>Growstuff 由 Alex Bayley (<a href="/members/skud">Skud</a>) 创立，他是一位来自澳大利亚墨尔本的开源软件开发人员和热心的蔬菜园丁。现在由社区维护。</p>
        <h3>Growstuff 是如何开始的？</h3>
        <p>Growstuff 的想法源于 2012 年在西班牙举行的一次开源会议上的讨论。我们想要一个关于种植和种植农作物的免费、开源信息，并意识到实现这一目标的最佳方法是从世界各地的园丁那里众包。</p>
        <p>我们于2012年8月首次将Growstuff设立为开源项目，并于2013年3月悄然推出。</p>
        <h3>Growstuff 是非营利组织吗？</h3>
        <p>Growstuff 是一个社区运行的项目。您还应该知道，有关农作物以及种植者的软件和汇总数据可以在开放许可下免费获得。</p>
        <h3>我可以在 Growstuff 上做广告吗？</h3>
        <p>抱歉，我们100%无广告！</p>
        <p>如果您是会员，您可以在我们的交易站区域发布要交易或出售的东西，但我们没有也永远不会有横幅广告等。我们认为，通过外部广告支持网站会给我们的会员和访问者带来不太愉快的体验，并且不是可持续的商业模式。</p>
        <h3>Growstuff 的状况如何？它处于测试阶段吗？</h3>
        <p>我们不太喜欢“beta”这个词或其代表的想法。 Growstuff 处于不断变化和改进的状态，我们希望我们能够始终添加新功能并为我们的会员提供更好的服务。</p>
        <p>如果您发现任何错误或问题，请通过我们的支持论坛告知我们。如果您想要的功能尚不可用，请尽快回来查看！</p>
        <h2>会员资格</h2>
        <h3>我可以免费使用Growstuff吗？</h3>
        <p>绝对！如果您喜欢该网站，我们将不胜感激您考虑捐赠（请参阅页脚中的链接）。</p>
        <h3>我可以为我的家庭、学校或社区团体申请会员资格吗？</h3>
        <p>是的！请随意注册为“JonesFamily”或“SmithfieldCommunity”或任何您感兴趣的账户。</p>
        <p>请记住，您对该帐户下发生的任何事情负责，因此请小心您允许的使用者。在适当的时候，我们希望开发一些功能来帮助社区花园与其成员/园丁共享，以便他们可以跟踪社区花园中种植的植物，而无需以社区花园帐户登录。准备就绪后，我们将广泛宣传这一点，因此请密切关注。</p>
        <h2>个人资料、设置和隐私</h2>
        <h3>如何将图片添加到我的个人资料中？</h3>
        <p>个人资料图片由<a href="https://gravatar.com">Gravatar</a>提供，该服务提供“全球认可的头像”，由运营WordPress博客平台的人员运营。</p>
        <p>如果您过去曾使用与注册 Growstuff 相同的地址注册过 Gravatar，那么您的个人资料中已经有一张照片。</p>
        <p>如果您使用与 Gravatar 地址不同的电子邮件地址注册 Growstuff，则需要将其添加到 Gravatar 上。</p>
        <p>如果您以前从未注册过 Gravatar，您可以创建一个帐户并上传图片，该图片不仅会出现在 Growstuff 上，还会出现在任何其他支持 Gravatar 且您使用相同电子邮件地址的网站上。</p>
        <h3>我必须填写所有这些个人资料吗？</h3>
        <p>您的个人资料会询问几个有关您的问题，您可以根据需要选择回答（或不回答）。我们不需要您的法定姓名、性别或年龄等个人信息来进行跟踪或人口统计目的——这是我们网站上没有广告的好处之一！</p>
        <p>说到位置，如果您可以将其提供给 Growstuff，那真的很有帮助，因为我们用它来建议植物的生长。但是，您可以按照您喜欢的任何详细程度进行操作：也许是您的城镇名称，或者您的州或省，甚至您的国家（如果该国家足够小并且气候相当一致）。只需选择足够接近的内容即可为您提供准确的成长建议，同时又足够模糊以让您感到安全。</p>
        <p>您可以在我们的<a href="http://growstuff.org/policy/privacy">隐私政策</a>中阅读有关您信息隐私的更多信息。</p>
        <h2>农作物、花园和种植</h2>
        <h3>如何添加新作物？</h3>
        <p>目前，请在我们的<a href="http://www.growstuff.org/forums/growstuff-feedback-support">反馈&amp;支持论坛</a>上的<a href="http://www.growstuff.org/posts/skud-20130319-requests-for-new-crops">新作物请求</a>留言。</p>
        <h3>你会添加非食用植物吗？</h3>
        <p>我们目前没有计划添加不可食用或在粮食种植或可持续发展背景下“无用”的植物——这些可能包括伴生植物、绿肥作物、用于防治害虫或疾病的植物等。如果您考虑的是纯粹的观赏植物，我们可能不会很快添加它们。</p>
        <p>但是，我们希望将来能够支持任何成员种植不在我们作物数据库中的“非官方”植物。</p>
        <h2>发帖、评论和论坛</h2>
        <h3>我可以在帖子和评论中使用什么格式？</h3>
        <p>我们使用<a href="http://daringfireball.net/projects/markdown/syntax/">Markdown</a>语法，它提供了相当广泛的选项，从简单的强调（粗体和斜体）到链接、图片等。我们希望安装一个工具栏来帮助您生成正确的语法，但与此同时，恐怕我们所能提供的只是上面链接的相当技术性的文档。</p>
        <h2>即将推出的功能</h2>
        <h3>在哪里可以看到计划的功能？</h3>
        <p>我们的软件开发人员使用名为 Pivotal Tracker 的跟踪工具，您可以在 <a href="http://tracker.growstuff.org">http://tracker.growstuff.org/</a> 看到我们的。这告诉您我们当前正在开发和计划很快开发哪些功能。</p>
        <p>Pivotal Tracker 界面显示三栏信息：</p>
        <ul>
        <li>“当前”部分显示了我们目前正在开发的功能（称为“故事”）</li>
        <li>“Backlog”向您展示我们计划在不久的将来处理的故事</li>
        <li>“冰箱”包含我们已确定为我们想做的事情的故事，但尚未设定时间范围。</li>
        </ul>
        <h3>在哪里可以推荐我想看的功能？</h3>
        <p>我们建议首先检查<a href="http://tracker.growstuff.org/">tracker</a>（见上文），看看这是否是我们已经在计划或讨论的事情。完成此操作后，如果尚未计划或您还有其他意见要提出，您可以在<a href="/forums/growstuff-feedback-support">反馈&amp;支持论坛</a>中发布您的建议。</p>
        <h2>开发者和API</h2>
        <h3>有Growstuff API吗？</h3>
        <p>目前还没有官方API，因为我们的网站还在快速变化。不过，我们确实通过 JSON 和/或 RSS 源公开了一些数据，欢迎您使用它，但您要理解它可能会发生变化。您可以在我们的 wiki</a> 上找到<a href="https://github.com/Growstuff/growstuff/wiki/API">API 文档。</p>
        <p>使用我们的API和数据须遵守<a href="http://www.growstuff.org/policy/api">API和数据使用政策</a>。</p>
        <h3>您的数据使用什么许可证？</h3>
        <p>Growstuff 的数据可根据<a href="http://creativecommons.org/licenses/by-sa/3.0/">知识共享署名-相同方式共享 (CC-BY-SA) 3.0 未移植许可证</a> 获取。这意味着您可以重复使用它，只要您将其归属于 Growstuff（通过链接回我们的网站），并且只要您自己的应用程序/网站/项目在 CC-BY-SA 下共享其自己的内容或数据。</p>
        <p>请参阅我们的<a href="http://growstuff.org/policy/api">API 和数据使用政策</a> 了解更多信息。</p>
        <h2>志愿服务和工作</h2>
        <h3>你们招人吗？</h3>
        <p>遗憾的是，没有。我们是一个自筹资金/自力更生的社区团体。</p>
        <p>如果你想参与，请参阅下文。</p>
        <h3>我如何志愿帮助 Growstuff？</h3>
        <p>首先，通过成为该网站的活跃会员——种植农作物、跟踪您的收成、在我们的论坛上发帖、了解其他成员——您可以帮助建立我们的数据库和社区，没有这些，Growstuff 将完全毫无意义。所以，谢谢你！</p>
        <p>其次，如果您能向自己种植食物或想尝试的朋友传播有关 Growstuff 的信息，我们将非常高兴。您可以在下面查看一些有关如何执行此操作的提示。</p>
        <p>Growstuff 的软件也是在志愿者开发人员的帮助下构建的。如果您是一名编码员或想学习如何编码，您可以加入我们。欢迎所有人，无论经验如何。</p>
        <p>我们还有志愿者作物管理员，负责管理我们的作物数据库，还有版主，帮助保持论坛顺利运行。这些成员通常是从我们最活跃和最乐于助人的成员中选出的。</p>
        <h3>我如何参与成为一名编码员？</h3>
        <p>首先查看我们的<a href="https://github.com/Growstuff/growstuff/wiki/">wiki</a>、<a href="http://github.com/Growstuff/growstuff">GitHub</a>和<a href="http://tracker.growstuff.org">tracker</a>，了解我们的工作方式。</p>
        <p>如果您想参与，您应该加入我们的<a href="http://lists.growstuff.org/mailman/listinfo/discuss">讨论邮件列表</a>。</p>
        <h3>我的编码技能已经生疏或根本不存在。我还能参与吗？</h3>
        <p>当然！我们喜欢指导新编码员、一段时间没有编码的人或刚刚第一次学习我们的平台（Ruby on Rails）的人。我们通过结对编程的方式工作，可以帮助您开始编写简单的故事，从修复拼写错误或 HTML 标签等简单的事情开始（查看我们的 <a href="http://tracker.growstuff.org">tracker</a> 中的“简单”标签以获取一些示例）。</p>
        <h3>我如何帮助传播有关 Growstuff 的信息？</h3>
        <p>首先，也是最重要的，告诉你的朋友并邀请他们加入并成为其中的一部分。我们不想发送垃圾邮件，因此我们绝不会要求抓取您的地址簿或代表您自动发布 Facebook 更新或推文。但如果您能用自己的话告诉人们，我们真的会很高兴。</p>
        <p>网上传播信息的地方：Facebook、Twitter 和其他社交媒体；您自己的博客或网站；您参加的园艺或可持续发展论坛。</p>
        <p>或离线：告诉朋友、家人和邻居；通过当地社区花园、农贸市场或农产品交换进行宣传；联系您当地的可持续发展或过渡小组；或您认为粮食种植者可能在的任何其他地方。</p>
        <h2>服务条款、版权和其他滥用</h2>
        <h3>我可以在哪里举报违反服务条款或社区准则的行为？</h3>
        <p>您可以在我们的<a href="http://www.growstuff.org/forums/growstuff-feedback-support">反馈&amp;支持论坛</a>发帖或发送邮件至<a href="mailto:support@growstuff.org">support@growstuff.org</a>。</p>
        <h3>您认为什么是垃圾邮件？我该如何举报？</h3>
        <p>垃圾邮件有很多种。最明显的是重复的、不需要的商业广告。许多垃圾邮件发送者还会在论坛上发布不相关、无意义或低价值的内容，试图让您点击链接，或者只是为了看看他们能逃脱什么惩罚。</p>
        <p>请举报所有此类垃圾邮件！</p>
        <p>目前，因为我们还很新，所以我们还没有建立良好的垃圾邮件报告机制。但是，您可以在我们的<a href="http://www.growstuff.org/forums/growstuff-feedback-support">反馈&amp;支持论坛</a>中添加链接，我们会尽力而为。</p>
        <h3>有人发布了一些我认为侵犯版权的内容。我可以在哪里举报？</h3>
        <p>如果您是版权所有者，您可以按照我们的<a href="http://growstuff.org/policy/copyright">版权侵权政策</a>中概述的程序提交投诉。</p>
        <h3>Growstuff 儿童使用安全吗？</h3>
        <p>作为一个专注于种植食物的网站，我们希望 Growstuff 能够成为一个非常安全和友好的环境。然而，网站的某些部分（例如会员发布的帖子）可能包含成熟的概念、粗俗的语言等。如果您不希望您的孩子接触这些物质，我们强烈建议您监督他们使用 Growstuff。我们还建议您谨慎对待您的孩子在 Growstuff 上分享的个人信息。</p>
        <h2>进一步支持</h2>
        <h3>在哪里可以找到该网站的已知问题列表？</h3>
        <p>在我们的 GitHub <a href="https://github.com/Growstuff/growstuff/issues">已知问题</a>。</p>
        <h3>我的问题没有在这里得到解答。我可以在哪里寻求进一步的支持？</h3>
        <p>在我们的<a href="http://www.growstuff.org/forums/growstuff-feedback-support">反馈&amp;支持论坛</a>。请在发布前检查已知问题列表。</p>
        <h3>我可以在哪里发布反馈/荣誉？</h3>
        <p>我们喜欢反馈！请在我们的<a href="http://www.growstuff.org/forums/growstuff-feedback-support">反馈&amp;支持论坛</a>中给我们留言。 （这里有回声吗？）</p>
        <h3>我还能怎样联系你？</h3>
        <p>如果您需要此处未涵盖的帮助，那么您可以发送电子邮件至<a href="mailto:support@growstuff.org">support@growstuff.org</a>。</p>
        <p>媒体/媒体查询可前往<a href="mailto:media@growstuff.org">media@growstuff.org</a>。</p>
        <p>如果您对网站有一般疑问（例如，商业问题，或者只是想以非支持方式与官方取得联系），您可以发送电子邮件至<a href="mailto:info@growstuff.org">info@growstuff.org</a>。</p>
    tos:
      title: "Growstuff 服务条款"
      body_html: |
        <p>我们讨厌法律术语，因此我们努力使我们的服务条款易于阅读。如果您有任何疑问，请随时<a href="mailto:support@growstuff.org">询问我们</a>，我们会尽力解答。</p>
        <p>Growstuff 维护者（“我们”、“我们的”、“Growstuff”）提出以下条款和条件，用于管理您对 Growstuff 网站（<a href="http://www.growstuff.org">growstuff.org</a>）的使用，以及在网站上或通过网站提供的所有内容、服务和产品，我们统称为“服务”。</p>
        <p>要使用本服务，您需要同意这些服务条款以及我们发布的所有其他政策（包括但不限于 Growstuff 的隐私政策、API 和数据使用政策、版权侵权政策和社区准则）。我们将此称为“协议”。</p>
        <p>请您在访问或使用本服务前仔细阅读本协议。通过访问或使用服务的任何部分，您同意受本协议的条款和条件的约束。如果您不同意本协议的所有条款和条件，则您不得访问服务。</p>
        <h2>1。您的帐户</h2>
        <p>如果您在服务上创建帐户，您有责任维护帐户的安全。您应对该帐户下发生的所有活动负责。您必须采取合理的措施来保护您帐户的安全。如果您因未能保护帐户安全而导致帐户安全遭到破坏，我们将不承担任何责任。</p>
        <h2>2。账户结构</h2>
        <p>Growstuff 有一种类型的帐户，而且是免费的。</p>
        <p>使用本服务，即表示您同意 Growstuff 有权随时更改、修改或终止您帐户可用的功能。</p>
        <h2>3。内容政策</h2>
        <p>我们的内容政策涉及您可能在 Growstuff 网站或通过服务发布的任何材料，我们称之为“内容”。这包括个人资料信息、帖子和评论、有关您的粮食种植活动的信息，以及您可以在 Growstuff 上发布或从 Growstuff 链接到的任何其他材料，无论是文本、图形还是任何其他格式。</p>
        <p>以任何方式发布到服务的所有内容均由所有者负责。如果对您有管辖权的任何法律认为内容非法，您同意我们可以向有关当局提交任何必要的信息。</p>
        <p>我们对您发布到服务的任何内容不拥有任何所有权或控制权。根据适用法律，您保留您发布的内容的任何知识产权。通过发布内容，您声明您有权复制该内容（以及允许我们提供此类内容的权利），而不会侵犯任何第三方的权利。您同意您将承担因发布您无权发布的任何内容而产生的任何责任。</p>
        <p>您授予我们全球范围内的、免版税的、非排他性的许可，以复制、修改、改编和发布内容，仅用于通过服务的任何部分（包括通过我们的 API、源和外部客户端）展示、分发和推广您帐户的内容。</p>
        <p>如果您删除内容，我们将尽合理努力将其从服务中删除，但您承认对内容的缓存或引用可能不会立即变得不可用。</p>
        <h3>3.1 结构化数据</h3>
        <p>内容有一个子集，我们将其称为“结构化数据”。结构化数据是代表简单事实的内容，而不是创造性的努力。例如，位置、日期或您种植的农作物的类型和数量都是结构化数据。结构化数据可能由您显式创建，也可能由网站隐式创建，以响应您的活动。</p>
        <p>使用本服务，即表示您承认 Growstuff 将收集和存储结构化数据，并且与您或您的活动有关的任何结构化数据可以根据知识共享署名相同方式共享 (CC-BY-SA) 许可提供给第三方使用。您还同意，根据知识共享许可条款，结构化数据的归属将归属于 Growstuff。</p>
        <h3>3.2 其他网站发布的内容</h3>
        <p>我们尚未审查也无法审查通过我们、任何用户或任何内容链接提供商或链接到我们的网站和网页提供的所有材料，包括计算机软件。我们对这些网站和网页没有任何控制权，也不对其内容或使用负责。通过链接到外部网站或网页，我们并不代表或暗示我们认可此类网站或网页。您有责任采取必要的预防措施，保护您自己和您的计算机系统免受病毒、蠕虫、特洛伊木马和其他有害或破坏性内容的侵害。对于因您使用外部网站和网页而造成的任何损害，无论该链接是由我们还是由服务内容的任何提供商提供，我们均不承担任何责任。</p>
        <h3>3.3 我们如何处理问题 内容</h3>
        <p>您同意，通过使用服务，您可能会接触到您认为令人反感或令人反感的内容。</p>
        <p>我们不会预先筛选内容。但是，您承认我们有权（但没有义务）自行决定删除或拒绝删除服务中的任何内容。如果向我们报告此类内容，我们将自行决定应采取什么行动（如果有）。</p>
        <p>如果您提交的任何内容被报告给我们违反本协议，您同意我们可以要求您在我们定义的合理时间内更改、修改或删除该内容。如果您不遵守此指令，我们可能会终止您的帐户。</p>
        <h2>4。会员行为</h2>
        <p>您同意您不会使用本服务来：</p>
        <ol>
        <li>上传、发布或以其他方式传输任何有害、威胁、辱骂、仇恨、侵犯任何人的隐私和公开权的内容，或违反任何适用的地方、州、国家或国际法律（包括任何具有法律效力的法规）的内容；</li>
        <li>上传、发布或以其他方式传输任何垃圾内容，或包含不道德或不需要的商业内容，旨在增加第三方网站的流量或提高第三方网站的搜索引擎排名，或进一步实施非法行为（例如网络钓鱼）或误导收件人了解材料的来源（例如欺骗）；</li>
        <li>恶意冒充任何真实的个人或实体，包括但不限于 Growstuff 工作人员或志愿者，或以其他方式歪曲您与任何个人或实体的关系；</li>
        <li>上传、发布或以其他方式传输您根据任何法律或合同或信托关系无权传输的任何内容（例如作为雇佣关系的一部分或根据保密协议了解到或披露的内幕信息、专有和机密信息）；</li>
        <li>上传、发布或以其他方式传输侵犯任何一方的任何专利、商标、商业秘密、版权或其他专有权的任何内容；</li>
        <li>干扰或破坏本服务或与本服务连接的服务器或网络，或违反与本服务连接的网络的任何要求、程序、政策或规定；</li>
        <li>出于非预期、商业或非法目的向其他用户索取密码或个人识别信息；</li>
        <li>上传、发布或以其他方式传输任何包含病毒、蠕虫、恶意软件、特洛伊木马或其他有害或破坏性内容的内容；</li>
        <li>允许他人以违反本协议的方式使用；</li>
        <li>过度或以其他方式有害地自动使用服务；</li>
        <li>访问任何他人的账户，或超出您所注册的服务范围；例如，访问和使用您无权使用的功能。</li>
        </ol>
        <p>您同意遵守社区准则，目前可在<a href="http://www.growstuff.org/policy/community">http://www.growstuff.org/policy/community</a>获取。</p>
        <h2>5。志愿者</h2>
        <p>我们感谢志愿者在 Growstuff 运营的许多方面提供的服务。志愿者活动包括但不限于开发软件、提供技术支持、编写文档、履行站点管理职责、提供专家建议、研究、技术写作、审查、分类以及支持服务运营所需的其他职责。</p>
        <p>所有志愿者均应达到法定年龄，或在法定父母或监护人同意的情况下参与志愿活动。</p>
        <p>通过志愿服务，您同意在法律允许的范围内，您因志愿活动而创作的任何作品均应在全球范围内永久、不可撤销地授权给 Growstuff。您同意 Growstuff 可以确定将您的志愿者工作许可给他人的基础，包括根据可能允许进一步更改或传播您的工作的开源或知识共享许可。如果法律禁止此类许可，您同意永远不会因使用上述作品而起诉 Growstuff。</p>
        <p>通过志愿服务，您同意您提供工作，Growstuff 不期望报酬或未来考虑。您还同意您已尽合理努力确保工作正确、准确且无缺陷。您同意不会披露或分享您在志愿工作过程中获得的任何专有或机密信息。</p>
        <p>不要求用户自愿，不自愿的用户将得到同等的关心、支持和关注。</p>
        <h2>6。隐私政策</h2>
        <p>您对本网站的使用受隐私政策的约束，当前位于<a href="http://www.growstuff.org/policy/privacy">http://www.growstuff.org/policy/privacy</a>。</p>
        <h2>7。 API 和数据使用政策</h2>
        <p>您对我们的 API 和/或数据的使用受我们的 API 和数据使用政策的约束，目前位于 <a href="http://www.growstuff.org/policy/api">http://www.growstuff.org/policy/api</a>。</p>
        <h2>8。版权侵权</h2>
        <p>如果您认为本网站上的材料侵犯了您的版权，您可以根据我们的版权侵权政策通知我们，目前位于<a href="http://www.growstuff.org/policy/copyright">http://www.growstuff.org/policy/copyright</a>。</p>
        <h2>9。服务转售</h2>
        <p>您同意不复制、复制、复制、出售、转售或利用本服务的任何部分、本服务的使用或对本服务的访问，除非我们的 API 和数据使用政策、与本服务源代码相关的开源许可证或与本服务上发布的内容或其他材料相关的知识共享许可证允许。</p>
        <h2>10。赔偿</h2>
        <p>您同意赔偿 Growstuff、其承包商、其许可方及其各自的董事、管理人员、员工和代理人，使其免受因您使用本服务（包括但不限于您违反本协议）而产生的任何及所有索赔和费用，包括律师费。</p>
        <h2>11。终止

        如果我们认为您违反了本协议，</h2>
        <p>Growstuff 可以随时终止您的帐户或以其他方式限制您使用服务。如果发生这种情况，您将收到电子邮件通知，我们将告诉您我们认为您违反了协议的哪一部分。我们可以自行决定选择发出警告而不是终止您的帐户，在这种情况下，您还将收到电子邮件通知，并被告知我们认为您违反了协议的哪一部分。我们还将向您提供联系地址，您可以对我们的决定提出上诉；但是，我们不保证我们会改变主意。</p>
        <p>您同意，终止您对服务的访问可能涉及删除或丢弃您提供的任何内容。</p>
        <p>我们可以自行决定随时停止提供服务，无论是否发出通知。</p>
        <p>如果您希望终止本协议，您可以删除您的帐户并停止使用服务。您同意，在删除您的帐户后，我们可以（但不是必须）在删除您的帐户后的任何时间删除您提供的任何内容。</p>
        <p>本协议中本质上应在终止后继续有效的所有条款，包括但不限于所有权条款、保证免责声明、赔偿和责任限制。</p>
        <h2>12。变化</h2>
        <p>我们保留自行决定随时修改或替换本协议任何部分的权利。可通过我们的公共源代码存储库<a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>获取本协议的变更历史记录。我们将采取合理措施通知您本协议的任何重大变更；但是，您有责任定期检查本协议是否有变更。您在发布本协议的任何更改后继续使用服务即表示您接受这些更改。</p>
        <p>我们将来还可能通过本服务提供新的功能或服务。此类新功能和/或服务应遵守本协议的条款和条件。</p>
        <h2>13。免责声明</h2>
        <p>本服务“按原样”提供。 Growstuff 维护者及其供应商和许可方特此否认任何形式的明示或暗示的保证，包括但不限于适销性、特定用途的适用性和不侵权的保证。 Growstuff 维护者及其供应商和许可方均不保证服务不会出现错误，或者对服务的访问将连续或不间断。您同意任何服务中断都没有资格获得报销或赔偿。您了解，您自行决定从本服务下载内容或通过本服务获取内容或服务，并自行承担风险。</p>
        <p>您以任何方式获得的任何口头或书面建议或信息均不构成本协议中未明确规定的任何保证。</p>
        <h2>14。责任限制</h2>
        <p>您明确理解并同意，在任何情况下，Growstuff 维护者或其供应商或许可方均不对本协议的任何标的物根据任何合同、疏忽、严格责任或其他法律或衡平理论承担以下责任： (i) 任何特殊、偶然或后果性损害； (ii) 采购或替代产品或服务的成本； (iii) 使用中断或数据丢失或损坏； (iv) 任何第三方在服务上的任何声明或行为； (v) 对您的内容进行任何未经授权的访问或更改。对于因超出我们合理控制范围的情况而导致的任何失败或延误，我们不承担任何责任。</p>
        <p>前述规定不适用于适用法律禁止的范围。</p>
        <h2>15。一般信息</h2>
        <p>本协议构成我们与您之间关于您使用服务的完整协议。本协议只能通过 Growstuff 维护者授权代表签署的书面修订或通过将修订版本发布到此位置来进行修改。除非适用法律（如有）另有规定，您与 Growstuff 维护者之间就本服务条款和/或您使用或访问本服务而产生的任何争议将受维多利亚州法律和澳大利亚联邦法律管辖，不包括任何法律冲突条款。您同意对于因您使用本服务或接受本协议而引起的或与之相关的任何争议，接受位于澳大利亚墨尔本的州法院和联邦法院的管辖。</p>
        <p>如果本协议的任何部分被视为无效或不可执行，该部分将被解释为反映双方的原始意图，其余部分将仍然具有完全效力。在任何一种情况下，任何一方放弃本协议的任何条款或条件或任何违反行为，并不放弃该条款或条件或随后的任何违反行为。</p>
        <p>本协议中的章节标题仅为方便起见，不具有法律或合同效力。</p>
        <h2>16。举报违规行为</h2>
        <p>要举报违反本协议的行为，请发送电子邮件至<a href="mailto:support@growstuff.org">support@growstuff.org</a>。</p>
        <h2>17。知识共享</h2>
        <p>本服务条款文档基于 Automattic (<a href="http://wordpress.com/tos/">http://wordpress.com/tos/</a>) 开发的文档，并由 Dreamwidth (<a href="http://www.dreamwidth.org/legal/tos">http://www.dreamwidth.org/legal/tos</a>) 修订，并根据 <a href="http://creativecommons.org/licenses/by-sa/2.5/">知识共享署名-相同方式共享 2.5 获得许可许可证</a>。</p>
