    what_is_a_nursery:
      description_html: 'Une <strong>pépinière</strong> est l''endroit où vous cultivez des semis : des graines semées dans des plateaux ou des pots avant d''entrer dans un jardin. Semer vos graines dans la pépinière, puis les transplanter dans un jardin, ou diviser un lot entre plusieurs, quand elles sont prêtes.'
  pages:
    community_guidelines:
      title: "Directives de la communauté Growstuff"
      body_html: |
        <p>Growstuff est une communauté par et pour les jardiniers vivriers. Ensemble, nous construisons un site Web sur lequel nous pouvons partager notre expérience, nos connaissances et les produits de notre récolte. La chose la plus importante chez Growstuff, ce sont les gens. Pour que Growstuff prospère, nous avons besoin que les gens ajoutent leurs cultures, partagent leurs connaissances et aident à construire le site lui-même.</p>
        <p>Quel que soit votre intérêt pour Growstuff, vous êtes le bienvenu ici et serez traité avec respect. En particulier :</p>
        <ul>
        <li>
        <p>Nous accueillons les personnes de tout âge, identité ou expression de genre, origine ethnique, nationalité, religion ou absence de religion, opinion politique, orientation sexuelle, état civil, structure familiale, capacité ou handicap, apparence, sous-culture ou autre identité ou auto-identification.</p>
        </li>
        <li>
        <p>Bien que Growstuff se concentre principalement sur le jardinage vivrier, nous accueillons tous les types de jardiniers, y compris les producteurs biologiques et conventionnels ; ceux qui cultivent leurs cultures dans les champs, sur les balcons ou dans des systèmes hydroponiques ; ceux qui jardinent à des fins commerciales ou non commerciales ; ceux qui subsistent de leurs récoltes et ceux qui jardinent pour d’autres raisons.</p>
        </li>
        <li>
        <p>Nous accueillons des personnes de tous niveaux de compétence et d'expérience, et nous ne croyons pas qu'il faille être dédaigneux ou commenter grossièrement simplement parce que vous êtes nouveau ou en apprentissage.</p>
        </li>
        <li>
        <p>Chaque rôle dans notre communauté est important, y compris les jardiniers qui apportent leurs compétences, leurs connaissances et leurs informations à notre site ; les codeurs, concepteurs et autres techniciens qui aident à le construire ; les modérateurs et autres personnes qui aident notre communauté à prospérer ; ou toute autre forme de participation. Nous croyons au travail ensemble et accordons la priorité à la communication et à la compréhension mutuelle.</p>
        </li>
        </ul>
        <p>Si vous souhaitez participer à la communauté Growstuff (qui comprend notre site Web et tous les forums auxiliaires tels que nos listes de diffusion, notre canal IRC, etc.), vous devez accepter notre engagement général en faveur de l'inclusion et du respect mutuel, ainsi que des politiques spécifiques suivantes :</p>
        <ul>
        <li>
        <p>Le harcèlement de tout membre de la communauté Growstuff est interdit. Le harcèlement comprend les insultes dirigées contre des individus ou des groupes ; remarques sexuelles non désirées adressées à toute personne ou groupe ; commentaires ou images sexuellement explicites dans les espaces publics ; le harcèlement ou tout autre contact répété et indésirable ; ou tout comportement répété ou soutenu qui perturbe la jouissance par quelqu'un d'autre du site ou de la communauté Growstuff.</p>
        </li>
        <li>
        <p>La vie privée des membres de notre communauté est très importante. Vous ne pouvez pas divulguer les informations personnelles d'un membre (y compris les noms sous lesquels ils sont connus en dehors de Growstuff, leur emplacement, les détails de leur emploi, les détails de leur famille, leurs coordonnées en dehors de Growstuff ou toute autre information d'identification ou personnelle) sans leur consentement explicite.</p>
        </li>
        <li>
        <p>Bien que nous vous laissions choisir votre propre nom sur notre site et n'insistons pas pour que vous utilisiez le même nom sur notre site Web que celui que vous avez sur les cartes de votre portefeuille, vous n'êtes pas autorisé à créer ou à utiliser un compte pseudonyme pour induire les gens en erreur, échapper à toute responsabilité ou autrement causer des problèmes. (Ceci est communément appelé compte « sockpuppet ».)</p>
        </li>
        </ul>
        <p>Si vous êtes victime ou témoin d'un comportement qui va à l'encontre de ces directives communautaires, vous pouvez le signaler à support@growstuff.org. Nous vous écouterons attentivement et prendrons votre rapport au sérieux. Une fois que nous aurons examiné la situation, nous pourrons prendre toutes les mesures que nous jugerons nécessaires. Par exemple, nous pouvons émettre un avertissement ou, dans des cas graves, suspendre ou bannir des personnes de notre communauté. Si cela se produit, nous informerons toujours la personne concernée de la raison de notre action, en faisant référence à nos documents de politique.</p>
        <p>Nous ne voulons pas rendre ces lignes directrices trop longues ou trop légalistes, nous allons donc en rester là, à l'exception d'une dernière ligne directrice. Comme Bill et Ted l'ont dit : <em>soyez excellents l'un envers l'autre</em>. Et faire pousser des trucs.</p>
        <h2>Licence Creative Commons</h2>
        <p>Ces directives communautaires sont sous licence <a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">Creative Commons Attribution-ShareAlike (CC-BY-SA) 3.0 Licence non portée</a>.</p>
    copyright:
      title: "Politique de violation des droits d'auteur"
      body_html: |
        <p>Nous détestons le jargon juridique, nous avons donc essayé de rendre cette politique lisible. Si vous avez des questions, n'hésitez pas à nous les <a href="mailto:support@growstuff.org">demandez</a>, et nous ferons de notre mieux pour y répondre.</p>
        <p>Cette politique de violation du droit d'auteur couvre tous les sites Web (tels que <a href="http://www.growstuff.org">growstuff.org</a>) détenus et exploités par les mainteneurs de Growstuff (« Growstuff », « nous », « notre ») et tous les services associés, collectivement appelés « le Service ». Il décrit comment vous pouvez signaler une violation des droits d'auteur sur le Service.</p>
        <p>Growstuff respecte la propriété intellectuelle d'autrui et nous demandons à nos utilisateurs de faire de même. Les membres de Growstuff sont tenus par les <a href="http://www.growstuff.org/policy/tos">Conditions de service</a> de s'assurer qu'ils ont le droit légal de publier du contenu sur le service.</p>
        <p>Growstuff est basé à Melbourne, en Australie et n'est pas soumis aux dispositions du Digital Millennium Copyright Act (DMCA) des États-Unis. Cependant, nous avons établi une politique et des procédures similaires à celles requises par le DMCA, car nous pensons qu'elles constituent les meilleures pratiques pour les services Web opérant en Australie.</p>
        <h2>1. Nous signaler une infraction</h2>
        <p>Si vous pensez qu'un membre de Growstuff a violé vos droits de propriété intellectuelle en publiant du contenu sur le service, vous pouvez suivre ces étapes pour nous en informer et demander la suppression du contenu.</p>
        <p>Les notifications peuvent être soumises par e-mail à <a href="mailto:support@growstuff.org">support@growstuff.org</a></p>
        <p>Nous préférons recevoir des notifications par email.</p>
        <p>Les notifications de violation du droit d'auteur envoyées via tout autre mécanisme ou forum ne seront pas prises en compte.</p>
        <p>Vous devez fournir les informations suivantes :</p>
        <ul>
        <li>Informations suffisantes pour identifier l'œuvre protégée par le droit d'auteur faisant l'objet d'une violation. Par exemple, si l'œuvre est un livre publié, indiquez le titre, l'auteur et l'ISBN ; si l'œuvre est un article de magazine, indiquez le titre, l'auteur, le nom du magazine et le numéro du magazine ; si l'œuvre est disponible sur Internet, indiquez l'URL de l'œuvre.</li>
        <li>L'URL de la page spécifique sur Growstuff où votre travail a été reproduit sans autorisation. Les descriptions générales ou les liens non spécifiques (comme vers la page d'accueil de Growstuff) ne peuvent donner lieu à aucune action.</li>
        <li>Votre adresse postale, numéro de téléphone et adresse email.</li>
        <li>Une déclaration de votre part indiquant que les informations ci-dessus sont exactes et que vous êtes le propriétaire du droit d'auteur ou de la propriété intellectuelle ou autorisé à agir au nom du propriétaire du droit d'auteur ou de la propriété intellectuelle.</li>
        <li>Une signature physique ou une signature numérique dans un format standard reconnu de l'industrie tel que PGP, du propriétaire du droit d'auteur ou de la propriété intellectuelle ou de la personne autorisée à agir en son nom. Les notifications non signées ne seront pas traitées.</li>
        </ul>
        <h2>2. Répondre aux notifications</h2>
        <p>Nous répondrons aux notifications de violation du droit d'auteur dans un délai de deux jours ouvrables.</p>
        <p>Si nous ne disposons pas de suffisamment d'informations pour donner suite à la notification, y compris tous les éléments répertoriés dans la section ci-dessus, nous rejetterons la notification et informerons l'auteur de l'envoi qu'il ne peut pas être donné suite à celle-ci.</p>
        <p>Si le contenu n'est pas hébergé sur nos serveurs (par exemple, si la notification concerne une image hébergée sur un autre site qui est simplement affichée sur ou liée à partir de notre site), nous répondrons, informant l'auteur que le contenu n'est pas hébergé par nous et le renvoyant au site d'hébergement.</p>
        <p>À condition que nous soyons en mesure de donner suite à la notification, nous contacterons le membre qui a publié le contenu et l'informerons de la notification et de la revendication des droits de propriété intellectuelle.</p>
        <p>Le membre disposera de deux jours ouvrables pour répondre. Ils peuvent répondre de la manière suivante :</p>
        <ul>
        <li>Admettre qu'ils ont publié quelque chose sur lequel ils ne détiennent pas de droits de propriété intellectuelle. Dans ce cas, le membre pourra supprimer le Contenu du Service, ou nous pourrons le rendre inaccessible.</li>
        <li>Envoyez une contre-notification, indiquant qu'ils ont le droit de publier le contenu et qu'ils sont prêts à faire valoir cette réclamation devant le tribunal. Le processus pour cela est décrit ci-dessous.</li>
        <li>Répondez en disant qu'ils ne pensent pas avoir violé des droits de propriété intellectuelle, mais qu'ils ne souhaitent pas soumettre formellement de contre-notification. Dans ce cas, le membre peut supprimer le Contenu du Service, ou nous pouvons rendre le Contenu inaccessible.</li>
        <li>Si le membre ne répond pas, nous rendrons le contenu inaccessible.</li>
        </ul>
        <p>Lorsque le contenu est supprimé ou rendu inaccessible, nous ferons des efforts raisonnables pour garantir qu'il ne soit pas accessible via le Service. Toutefois, la mise en cache ou les références externes peuvent faire en sorte que le Contenu reste accessible pendant un certain temps, y compris sur des sites ou applications tiers. Les sites et applications tiers ne sont pas sous le contrôle de Growstuff. Si le Contenu contrefait a été supprimé ou rendu inaccessible via le Service mais est toujours disponible via des sites et applications tiers, le titulaire du droit d'auteur ou de la propriété intellectuelle peut contacter les opérateurs de ces sites/applications pour les informer de la violation.</p>
        <h2>3. Processus de contre-notification et de restauration</h2>
        <p>Une contre-notification est une déclaration selon laquelle vous ne pensez pas que votre contenu porte atteinte aux droits d'une autre personne, ou que votre utilisation du matériel protégé par le droit d'auteur d'une autre personne entre dans une catégorie protégée par la loi.</p>
        <p>En déposant une contre-notification, vous indiquez que vous êtes prêt à défendre votre utilisation du matériel devant le tribunal, si le titulaire des droits d'auteur choisit d'intenter une action en justice contre vous pour votre utilisation du matériel. Cela peut impliquer des sanctions civiles et/ou pénales. Nous vous suggérons fortement de contacter un avocat en propriété intellectuelle autorisé à exercer le droit dans votre juridiction avant de faire cela, afin que vous soyez conscient de vos droits et obligations en vertu de la loi.</p>
        <p>Une contre-notification doit contenir les éléments suivants :</p>
        <ul>
        <li>Votre signature. Les signatures peuvent être une signature physique ou une signature numérique dans un format standard reconnu tel que PGP.</li>
        <li>L'URL du Contenu mis en cause (cela aura été renseigné dans la notification originale).</li>
        <li>Une déclaration selon laquelle vous pensez de bonne foi que la notification de violation du droit d'auteur a été envoyée à la suite d'une erreur ou d'une mauvaise identification du matériel. Cela doit inclure toutes les raisons pour lesquelles vous pensez que votre utilisation du matériel ne constitue pas une contrefaçon.</li>
        <li>Votre nom, adresse et numéro de téléphone.</li>
        </ul>
        <p>Nous transmettrons votre contre-notification, dans son intégralité, à l'auteur de la notification originale. Ils auront alors 14 jours pour engager une action en justice et nous en informer.</p>
        <p>En attendant, nous rendrons le Contenu inaccessible.</p>
        <p>Si, au bout de 14 jours, nous ne sommes pas informés qu'une procédure judiciaire a été engagée, nous restaurerons le Contenu.</p>
        <p>Si vous avez déposé une contre-notification, vous ne pouvez pas republier le matériel prétendument en infraction jusqu'à ce que nous vous informions que le délai d'attente a expiré.</p>
        <h2>4. Récidive</h2>
        <p>Les membres qui reçoivent au moins trois avis de violation du droit d'auteur valides verront leur compte résilié.</p>
        <p>Si une contre-notification est déposée, ou si le membre a déclaré qu'il n'accepte pas l'allégation de violation du droit d'auteur mais ne souhaite pas déposer formellement de contre-notification, la notification ne sera pas prise en compte dans la résiliation.</p>
        <p>Nous nous réservons également le droit de résilier les comptes de ceux qui, à notre avis, abusent ou abusent du processus de notification de violation du droit d'auteur à l'encontre d'autres membres.</p>
        <h2>5. Changements</h2>
        <p>Nous pouvons modifier notre politique de violation des droits d'auteur de temps à autre. Un historique des modifications apportées à cette politique est disponible via notre référentiel de code source public à l'adresse <a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>. Nous prendrons des mesures raisonnables pour vous informer de toute modification substantielle de cette politique ; cependant, il est de votre responsabilité de vérifier périodiquement cette politique pour détecter les modifications. Votre utilisation continue de ce site après toute modification de cette politique constituera votre acceptation de cette modification.</p>
        <h2>6. Licence Creative Commons</h2>
        <p>Cette politique de violation du droit d'auteur est basée sur celle développée par Dreamwidth (<a href="http://www.dreamwidth.org/legal/dmca">http://www.dreamwidth.org/legal/dmca</a>) et est sous licence <a href="http://creativecommons.org/licenses/by-sa/2.5/">Creative Commons Attribution-ShareAlike 2.5 License</a>.</p>
    data_use:
      title: "API et politique d'utilisation des données"
      body_html: |
        <p>Nous détestons le jargon juridique, nous avons donc essayé de rendre cette politique lisible. Si vous avez des questions, n'hésitez pas à nous les <a href="mailto:support@growstuff.org">demandez</a>, et nous ferons de notre mieux pour y répondre.</p>
        <p>Cette API et cette politique d'utilisation des données couvrent tous les sites Web (tels que <a href="http://www.growstuff.org">growstuff.org</a>) détenus et exploités par les responsables de Growstuff (« Growstuff », « nous », « notre ») et tous les services associés, collectivement appelés « le Service ».</p>
        <p>En particulier, cette politique couvre tout accès au Service via toute interface de programmation d'application, flux, spidering, scraping ou tout autre accès automatisé ou programmatique aux données structurées ou au contenu disponible via le service (collectivement, l'« API »). Cette politique s'applique à toute personne utilisant l'API (« vous », « développeur »).</p>
        <h2>1. API fournie telle quelle et sujette à modification</h2>
        <p>Growstuff fournit son API telle quelle, comme décrit dans la section « Exclusion de garanties » dans nos <a href="http://www.growstuff.org/policy/tos">Conditions de service</a>.</p>
        <p>L'API de Growstuff est susceptible de changer. Nous ferons des efforts raisonnables pour informer les développeurs des modifications et de l'état de publication de toutes les fonctionnalités de l'API. Vous devez faire des efforts raisonnables pour suivre l'actualité technique de Growstuff via nos forums, listes de diffusion ou autres canaux.</p>
        <h2>2. Ne surchargez pas nos serveurs</h2>
        <p>Vous vous engagez à limiter votre accès à l'API de manière à éviter une charge excessive sur le Service. Growstuff se réserve le droit de restreindre ou de limiter l'accès à l'API si nécessaire pour maintenir les performances du Service.</p>
        <h2>3. Utilisation des données et du contenu de Growstuff</h2>
        <p>Vous acceptez d'observer les termes de la <a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">Creative Commons Attribution-ShareAlike (CC-BY-SA) 3.0 Unported License</a> sous laquelle nos données structurées sont mises à disposition. Vous acceptez de respecter les droits d'auteur et de propriété intellectuelle des membres de Growstuff en ce qui concerne leur Contenu publié sur le Service, y compris, mais sans s'y limiter, les publications, commentaires, images, etc.</p>
        <p>Vous acceptez de respecter tous les paramètres de confidentialité relatifs aux données structurées ou au contenu auquel vous accédez via l'API. Vous acceptez de ne republier aucune donnée structurée ou contenu avec un accès plus permissif que celui initialement prévu par le membre qui l'a publié.</p>
        <p>Growstuff reconnaît que les données structurées et le contenu mis à disposition dans le cadre de l'API peuvent être mis en cache ou conservés par des tiers pour une durée indéterminée. Toutefois, nous vous demandons, si vous créez une application à l'aide de données structurées et de contenu actuels, de faire des efforts raisonnables pour les mettre à jour régulièrement, notamment en supprimant toutes les données structurées ou tout contenu supprimé du service et en reflétant toute modification des paramètres de confidentialité qui s'y rapportent.</p>
        <p>Growstuff contient des données de la <a href="https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd">Australian Food Composition Database</a> de <a href="https://www.foodstandards.gov.au/legal-policies/copyright">Food Standards Australia New Zealand</a> sous une licence CC-BY-4.0.</p>
        <h2>4. Authentification</h2>
        <p>Growstuff se réserve le droit d'exiger une authentification et/ou un enregistrement de l'application comme condition d'utilisation de l'API et des données.</p>
        <p>Si vous offrez aux utilisateurs la possibilité de se connecter à Growstuff, vous devez le faire via OAuth. Vous ne pouvez pas demander aux utilisateurs de fournir leur nom de connexion et leur mot de passe Growstuff.</p>
        <h2>5. Pénalités</h2>
        <p>Si vous violez les termes de cette politique, Growstuff peut restreindre votre accès à l'API.</p>
        <h2>6. Changements</h2>
        <p>Nous pouvons modifier notre API et notre politique d'utilisation des données de temps à autre. Un historique des modifications apportées à cette politique est disponible via notre référentiel de code source public à l'adresse <a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>. Nous prendrons des mesures raisonnables pour vous informer de toute modification substantielle de cette politique ; cependant, il est de votre responsabilité de vérifier périodiquement cette politique pour détecter les modifications. Votre utilisation continue de ce site après toute modification de cette politique constituera votre acceptation de cette modification.</p>
        <h2>7. Licence Creative Commons</h2>
        <p>Cette API et cette politique d'utilisation des données sont sous licence <a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">Creative Commons Attribution-ShareAlike (CC-BY-SA) 3.0 Licence non portée</a>.</p>
    privacy:
      title: "Politique de confidentialité"
      body_html: |
        <p>Nous détestons le jargon juridique, nous avons donc essayé de rendre cette politique lisible. Si vous avez des questions, n'hésitez pas à nous les <a href="mailto:support@growstuff.org">demandez</a>, et nous ferons de notre mieux pour y répondre.</p>
        <p>Cette déclaration de confidentialité (« Politique de confidentialité ») couvre tous les sites Web (tels que <a href="http://www.growstuff.org/">growstuff.org</a>) détenus et exploités par les mainteneurs de Growstuff (« Growstuff », « nous », « notre ») et tous les services associés, collectivement appelés « le Service ».</p>
        <p>Nous utilisons les informations que vous partagez avec nous à des fins commerciales internes. Nous ne vendons pas vos informations. Cet avis vous indique quelles informations nous collectons, comment nous les utilisons et les mesures que nous prenons pour les protéger et les sécuriser.</p>
        <h2>1. Informations que nous collectons</h2>
        <h3>1.1 Données non personnelles</h3>
        <p>Comme la plupart des opérateurs de sites Web, nous collectons des données non personnelles telles que le type de navigateur, la préférence linguistique, le site référent ainsi que la date et l'heure de chaque demande de visiteur.</p>
        <p>Nous collectons ces informations pour comprendre comment nos visiteurs et membres utilisent notre service, et les utilisons pour prendre des décisions sur la manière de modifier et d'adapter le service.</p>
        <p>De temps en temps, nous pouvons divulguer des données non personnelles sous forme agrégée (par exemple, en publiant les tendances d'utilisation du site) pour expliquer notre raisonnement dans la prise de décisions. Nous ne divulguerons pas d’informations individuelles, mais uniquement des informations globales.</p>
        <h3>1.2 Données personnelles</h3>
        <p>Les données personnelles désignent tout ce qui peut être utilisé pour vous identifier ou vous contacter, comme votre nom légal, votre adresse e-mail, votre adresse IP ou votre emplacement physique.</p>
        <h4>1.2.1 Données personnelles collectées automatiquement</h4>
        <p>Nous collectons automatiquement certaines données personnelles, telles que l'adresse IP, fournies par votre navigateur et votre ordinateur chaque fois que vous visitez notre site Web.</p>
        <p>Nous collectons ces informations à plusieurs fins :</p>
        <ul>
        <li>Pour diagnostiquer et réparer les problèmes de réseau liés à votre utilisation du site ;</li>
        <li>Pour estimer le nombre d'utilisateurs accédant au service à partir de régions géographiques spécifiques ;</li>
        <li>Pour aider à prévenir la fraude et les abus.</li>
        </ul>
        <h4>1.2.2 Adresse e-mail</h4>
        <p>Pour vous inscrire au service, vous devez nous communiquer votre adresse email. Nous utiliserons votre adresse e-mail pour envoyer une confirmation de certaines actions, par exemple lorsque vous modifiez votre mot de passe. Nous vous contacterons lorsqu'il sera nécessaire de compléter une demande que vous avez initiée, ou s'il existe un problème critique ou administratif affectant votre utilisation du service.</p>
        <p>Une fois que vous avez créé votre compte, vous pouvez choisir de vous abonner à certains événements et de recevoir des notifications de ces événements par e-mail. Vous pourrez changer d’avis et refuser de recevoir des notifications par e-mail à tout moment.</p>
        <p>Nous ne vendrons ni ne fournirons jamais votre adresse e-mail à un tiers à des fins de marketing ou pour toute autre raison, sauf dans les cas indiqués ci-dessous.</p>
        <h4>1.2.3 Données personnelles facultatives que vous nous fournissez</h4>
        <p>Lorsque vous utilisez le service, vous avez la possibilité de fournir davantage de données personnelles, via votre profil et d'autres activités sur le site. La fourniture de ces informations est strictement facultative.</p>
        <p>Vous avez la possibilité de nous fournir votre localisation. Vous pouvez fournir ces informations avec le niveau de détail que vous souhaitez. Par exemple, vous pouvez fournir votre adresse postale, votre pays de résidence ou rien du tout. Nous utilisons cet emplacement pour vous fournir du contenu pertinent.</p>
        <p>Beaucoup de vos activités sur le Service peuvent vous permettre de publier des Données Personnelles ou de divulguer directement ou indirectement des Données Personnelles vous concernant. Par exemple, vous pouvez divulguer des données personnelles dans une publication ou un commentaire sur le site, en téléchargeant une photo, en créant un lien vers un autre site Web que vous utilisez ou en enregistrant en détail votre activité de jardinage. Toutes ces activités sont facultatives. Vous devez faire preuve de prudence lorsque vous divulguez des données personnelles dans le cadre de votre activité sur le Service.</p>
        <p>Nous montrerons les informations que vous fournissez, y compris toutes les données personnelles qu'elles peuvent contenir, aux autres personnes consultant le site, conformément aux options de confidentialité que vous avez sélectionnées.</p>
        <p>Les informations que vous fournissez sont également mises à la disposition de tiers via notre API et nos flux, conformément aux options de confidentialité que vous avez sélectionnées et sous réserve des termes de notre API et de notre politique d'utilisation des données qui est disponible au <a href="http://www.growstuff.org/policy/api">http://www.growstuff.org/policy/api</a>.</p>
        <p>Certaines des informations que vous fournissez sont classées comme données structurées, qui sont définies plus en détail dans nos <a href="/policy/tos">Conditions de service</a>. Nous mettons les données structurées à disposition gratuitement sous une licence Creative Commons Attribution ShareAlike (CC-BY-SA) 3.0 Unported pour une utilisation par des tiers, conformément aux options de confidentialité que vous avez sélectionnées.</p>
        <p>Nous pouvons également utiliser toutes les données personnelles que vous fournissez, dans leur ensemble, pour prendre des décisions sur la manière de modifier et d'adapter le service. De temps en temps, nous pouvons divulguer des informations sous forme globale (par exemple, en publiant les tendances d'utilisation du site) pour expliquer notre raisonnement dans la prise de décisions. Nous ne divulguerons pas d’informations individuelles, mais uniquement des informations globales.</p>
        <h2>2. Divulgation des données personnelles</h2>
        <p>Nous divulguons les données personnelles, y compris les informations personnelles facultatives que vous avez fournies mais qui ne sont normalement pas disponibles pour les autres utilisateurs du site, uniquement à ceux de nos employés, sous-traitants et bénévoles qui (i) ont besoin de connaître ces informations afin de faire fonctionner le service et (ii) ont accepté de ne pas les divulguer à des tiers. Les circonstances dans lesquelles cela est nécessaire incluent, sans s'y limiter : le dépannage et le diagnostic de problèmes techniques, l'enquête sur d'éventuelles violations des conditions d'utilisation et les problèmes de conformité légale.</p>
        <p>Nous concluons des contrats avec des fournisseurs tiers pour fournir certaines fonctionnalités du site. Nous ne partagerons des informations personnelles avec des fournisseurs tiers que dans la mesure où cela est nécessaire pour qu'ils puissent fournir les fonctionnalités de ce site. Nous exigeons de nos fournisseurs tiers qu'ils offrent le même niveau de protection de la vie privée que nous, et ils n'ont pas le droit de partager ou d'utiliser des informations personnelles à d'autres fins que la fourniture des fonctionnalités de ces sites.</p>
        <p>Nous pouvons divulguer des données personnelles ou des données potentiellement nominatives lorsque cette divulgation est requise par la loi ou par une ordonnance d'un tribunal, ou lorsque nous croyons de bonne foi que la divulgation est raisonnablement nécessaire pour protéger notre sécurité ou nos droits, ceux de tiers ou le grand public.</p>
        <p>Nous nous réservons le droit de transférer vos données personnelles à un tiers en cas de vente, fusion, liquidation, mise sous séquestre ou transfert de la totalité ou de la quasi-totalité des actifs de notre société à condition que le tiers accepte d'adhérer aux termes de la politique de confidentialité de Growstuff et à condition que le tiers utilise vos données personnelles uniquement aux fins pour lesquelles vous nous les avez fournies. Vous serez informé en cas de transfert de ce type et vous aurez la possibilité de vous désinscrire.</p>
        <h2>3. Biscuits</h2>
        <p>Un cookie est une chaîne d'informations qu'un site Web stocke sur l'ordinateur d'un visiteur et que le navigateur du visiteur fournit au site Web à chaque fois que le visiteur revient. Nous utilisons des cookies pour nous aider à identifier et suivre les visiteurs, leur utilisation du site Web et leurs préférences d'accès au site Web. Nous utilisons également des cookies pour gérer la connexion à votre compte.</p>
        <p>Les visiteurs qui ne souhaitent pas que des cookies soient placés sur leur ordinateur doivent configurer leur navigateur pour refuser les cookies avant d'utiliser le site, avec l'inconvénient que certaines fonctionnalités du site peuvent ne pas fonctionner correctement sans l'aide de cookies.</p>
        <h2>4. Confidentialité et sécurité</h2>
        <p>Aucune transmission de données sur Internet ne peut jamais être garantie comme étant sécurisée à 100 %. Vous utilisez ce service à vos propres risques. Cependant, nous prendrons toutes les mesures raisonnables (y compris les mesures techniques et organisationnelles appropriées) pour protéger vos données personnelles.</p>
        <p>Les informations de votre compte sont protégées par mot de passe. Nous vous recommandons de choisir un mot de passe fort et sécurisé. Nous utilisons un cryptage conforme aux normes de l'industrie pour protéger votre mot de passe sur nos serveurs.</p>
        <p>Si nous prenons connaissance d'une faille de sécurité du système, nous vous en informerons par voie électronique afin que vous puissiez prendre les mesures appropriées pour vous protéger.</p>
        <h2>5. Supprimer vos informations</h2>
        <p>Vous pouvez modifier ou supprimer toute information facultative que vous nous avez fournie à tout moment. Si vous modifiez ou supprimez des informations facultatives que vous avez fournies, la modification aura lieu immédiatement sur le Service. Cependant, la mise en cache ou les références aux données, y compris dans des applications tierces basées sur le Service, peuvent signifier que les données précédemment disponibles restent disponibles pendant un certain temps.</p>
        <p>Dans le cadre du fonctionnement quotidien du Service, nous effectuerons régulièrement des copies des données contenues dans les bases de données à des fins de sauvegarde. Ces sauvegardes peuvent potentiellement contenir des données supprimées pendant plusieurs semaines ou mois. Ces sauvegardes seront également régies par les règles de divulgation des données personnelles.</p>
        <h2>6. Changements</h2>
        <p>Nous pouvons modifier notre politique de confidentialité de temps à autre. Un historique des modifications apportées à cette politique est disponible via notre référentiel de code source public à l'adresse <a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>. Nous prendrons des mesures raisonnables pour vous informer de toute modification substantielle de cette politique ; cependant, il est de votre responsabilité de vérifier périodiquement cette politique pour détecter les modifications. Votre utilisation continue de ce site après toute modification de cette politique de confidentialité constituera votre acceptation de cette modification.</p>
        <h2>7. Nous contacter</h2>
        <p>Si vous avez des questions sur cette politique, vous pouvez nous contacter au <a href="mailto:support@growstuff.org">support@growstuff.org</a>.</p>
        <h2>8. Creative Commons</h2>
        <p>Cette politique de confidentialité est basée sur celle développée par Automattic (<a href="http://automattic.com/privacy/">http://automattic.com/privacy/</a>) et modifiée par Dreamwidth (<a href="http://dreamwidth.org/legal/privacy">http://dreamwidth.org/legal/privacy</a>) et est sous licence <a href="http://creativecommons.org/licenses/by-sa/2.5/">Creative Commons Attribution-ShareAlike 2.5 Licence</a>.</p>
    support:
      title: "Support - Questions fréquemment posées"
      body_html: |
        <h2>À propos de Growstuff</h2>
        <h3>Qui dirige Growstuff ?</h3>
        <p>Growstuff a été lancé par Alex Bayley (<a href="/members/skud">Skud</a>), développeur de logiciels open source et passionné de jardinage végétarien de Melbourne, en Australie. Il est désormais entretenu par la communauté.</p>
        <h3>Comment Growstuff a-t-il démarré ?</h3>
        <p>L'idée de Growstuff est née d'une discussion lors d'une conférence open source en Espagne en 2012. Nous voulions une source d'informations gratuite et ouverte sur la plantation et la culture des cultures, et avons réalisé que la meilleure façon d'y parvenir serait de la recueillir auprès des jardiniers du monde entier.</p>
        <p>Nous avons d'abord créé Growstuff en tant que projet open source en août 2012, et l'avons discrètement lancé en mars 2013.</p>
        <h3>Growstuff est-il une organisation à but non lucratif ?</h3>
        <p>Growstuff est un projet géré par la communauté. Vous devez également savoir que les logiciels et les données agrégées sur les cultures et sur ceux qui les cultivent sont disponibles gratuitement sous licences ouvertes.</p>
        <h3>Puis-je faire de la publicité sur Growstuff ?</h3>
        <p>Désolé, nous sommes 100 % sans publicité !</p>
        <p>Si vous êtes membre, vous pouvez publier des objets à échanger ou à vendre dans notre zone de comptoir commercial, mais nous n'avons pas et n'aurons jamais de bannières publicitaires ou autres. Nous pensons que soutenir un site Web par le biais de publicités extérieures rend l'expérience moins agréable pour nos membres et visiteurs et ne constitue pas un modèle commercial durable.</p>
        <h3>Quel est le statut de Growstuff ? Est-ce en version bêta ?</h3>
        <p>Nous n'aimons pas beaucoup le mot « bêta » ni l'idée qu'il représente. Growstuff est dans un état constant de changement et d'amélioration, et nous espérons que nous ajouterons toujours de nouvelles fonctionnalités et améliorerons les choses pour nos membres.</p>
        <p>Si vous rencontrez des bugs ou des problèmes, veuillez nous en informer via notre forum d'assistance. Si une fonctionnalité que vous souhaitez n’est pas encore disponible, revenez bientôt !</p>
        <h2>Adhésion</h2>
        <h3>Puis-je utiliser Growstuff gratuitement ?</h3>
        <p>Absolument ! Si vous appréciez le site, nous apprécierions que vous envisagiez un don (voir le lien en pied de page).</p>
        <h3>Puis-je obtenir un abonnement pour ma famille, mon école ou mon groupe communautaire ?</h3>
        <p>Ouais ! N'hésitez pas à vous inscrire en tant que « JonesFamily » ou « SmithfieldCommunity » ou tout ce qui fait flotter votre bateau.</p>
        <p>Gardez simplement à l'esprit que vous êtes responsable de tout ce qui se passe sous ce compte, alors faites attention à qui vous autorisez à l'utiliser. En temps voulu, nous espérons développer des fonctionnalités pour aider les jardins communautaires à partager avec leurs membres/jardiniers, afin qu'ils puissent suivre ce qui est planté dans le jardin communautaire sans avoir à se connecter en tant que compte du jardin communautaire. Nous le ferons largement connaître lorsqu’il sera prêt, alors restez à l’écoute.</p>
        <h2>Profil, paramètres et confidentialité</h2>
        <h3>Comment ajouter une photo à mon profil ?</h3>
        <p>Les photos de profil sont fournies par <a href="https://gravatar.com">Gravatar</a>, un service qui fournit des « avatars mondialement reconnus », gérés par les personnes qui exploitent la plateforme de blogs WordPress.</p>
        <p>Si vous vous êtes déjà inscrit à Gravatar dans le passé, en utilisant la même adresse que celle utilisée pour vous inscrire à Growstuff, vous aurez déjà une photo pour votre profil.</p>
        <p>Si vous vous êtes inscrit à Growstuff avec une adresse e-mail différente de votre adresse Gravatar, vous devrez l'ajouter sur Gravatar.</p>
        <p>Si vous ne vous êtes jamais inscrit à Gravatar auparavant, vous pouvez créer un compte et télécharger une photo, qui apparaîtra non seulement sur Growstuff, mais sur tout autre site prenant en charge Gravatars et où vous utilisez la même adresse e-mail.</p>
        <h3>Dois-je remplir toutes ces informations personnelles ?</h3>
        <p>Votre profil pose plusieurs questions sur vous, auxquelles vous pouvez choisir de répondre (ou non) comme bon vous semble. Nous n'avons pas besoin d'informations personnelles telles que votre nom légal, votre sexe ou votre âge à des fins de suivi ou à des fins démographiques : l'un des avantages de ne pas avoir de publicité sur notre site !</p>
        <p>En ce qui concerne l'emplacement, cela aide vraiment si vous pouvez le fournir à Growstuff car nous l'utilisons pour suggérer des choses à cultiver. Cependant, vous pouvez le faire avec n'importe quel niveau de détail avec lequel vous êtes à l'aise : peut-être le nom de votre ville, ou de votre état ou province, ou même de votre pays si le pays est suffisamment petit et a un climat assez constant. Choisissez simplement quelque chose qui est suffisamment proche pour vous donner des conseils de culture précis et suffisamment vague pour vous sentir en sécurité.</p>
        <p>Vous pouvez en savoir plus sur la confidentialité de vos informations dans notre <a href="http://growstuff.org/policy/privacy">Politique de confidentialité</a>.</p>
        <h2>Cultures, jardins et plantations</h2>
        <h3>Comment puis-je ajouter un nouveau recadrage ?</h3>
        <p>Pour l'instant, veuillez déposer une note dans <a href="http://www.growstuff.org/posts/skud-20130319-requests-for-new-crops">Demandes de nouvelles cultures</a> sur notre <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp; Forum d'assistance</a>.</p>
        <h3>Allez-vous ajouter des plantes non comestibles ?</h3>
        <p>Nous n'envisageons pas actuellement d'ajouter des plantes qui ne sont pas comestibles ou qui ne sont pas « utiles » dans un contexte de culture alimentaire ou de durabilité – celles-ci pourraient inclure des plantes compagnes, des cultures d'engrais vert, des plantes utilisées pour lutter contre les ravageurs ou les maladies, etc. Si vous pensez à des plantes purement ornementales, nous ne les ajouterons probablement pas de si tôt.</p>
        <p>Cependant, nous espérons, à l'avenir, permettre à tout membre de planter des plantes « non officielles » qui ne figurent pas dans notre base de données de cultures.</p>
        <h2>Publication, commentaires et forums</h2>
        <h3>Quelle mise en forme puis-je utiliser dans les publications et les commentaires ?</h3>
        <p>Nous utilisons la syntaxe <a href="http://daringfireball.net/projects/markdown/syntax/">Markdown</a>, qui offre une gamme assez large d'options allant de la simple emphase (gras et italique) aux liens, images, etc. Nous espérons installer une barre d'outils pour vous aider à générer la bonne syntaxe, mais en attendant, je crains que tout ce que nous puissions offrir soit la documentation plutôt technique liée ci-dessus.</p>
        <h2>Fonctionnalités à venir</h2>
        <h3>Où puis-je voir les fonctionnalités prévues ?</h3>
        <p>Nos développeurs de logiciels utilisent un outil de suivi appelé Pivotal Tracker, et vous pouvez voir le nôtre à <a href="http://tracker.growstuff.org">http://tracker.growstuff.org/</a>. Cela vous indique les fonctionnalités sur lesquelles nous travaillons actuellement et sur lesquelles nous prévoyons de travailler bientôt.</p>
        <p>L'interface de Pivotal Tracker affiche trois colonnes d'informations :</p>
        <ul>
        <li>la section "Actuel" montre les fonctionnalités (appelées "stories") sur lesquelles nous travaillons en ce moment</li>
        <li>"Backlog" vous montre les histoires sur lesquelles nous prévoyons de travailler dans un avenir proche</li>
        <li>« Icebox » contient des histoires que nous avons identifiées comme des choses que nous aimerions faire, mais pour lesquelles aucun calendrier n'est encore défini.</li>
        </ul>
        <h3>Où puis-je suggérer une fonctionnalité que j'aimerais voir ?</h3>
        <p>Nous vous suggérons de vérifier d'abord le <a href="http://tracker.growstuff.org/">tracker</a> (voir ci-dessus) pour voir si c'est quelque chose que nous planifions ou dont nous parlons déjà. Une fois cela fait, si ce n'est pas déjà prévu ou si vous avez d'autres commentaires à faire, vous pouvez poster votre suggestion dans le <a href="/forums/growstuff-feedback-support">Feedback &amp; Forum d'assistance</a>.</p>
        <h2>Développeurs et API</h2>
        <h3>Existe-t-il une API Growstuff ?</h3>
        <p>Actuellement, il n'existe pas d'API officielle, car notre site évolue toujours très rapidement. Cependant, nous exposons certaines de nos données via des flux JSON et/ou RSS, et vous êtes invités à jouer avec, étant entendu qu'elles peuvent changer sous votre contrôle. Vous pouvez trouver la documentation <a href="https://github.com/Growstuff/growstuff/wiki/API">API sur notre wiki</a>.</p>
        <p>L'utilisation de notre API et de nos données est soumise à la <a href="http://www.growstuff.org/policy/api">API et à la politique d'utilisation des données</a>.</p>
        <h3>Sous quelle licence se trouvent vos données ?

        Les données de</h3>
        <p>Growstuff sont disponibles sous la <a href="http://creativecommons.org/licenses/by-sa/3.0/">Creative Commons Attribution-ShareAlike (CC-BY-SA) 3.0 Licence non portée</a>. Cela signifie que vous pouvez le réutiliser tant que vous l'attribuez à Growstuff (en créant un lien vers notre site), et tant que votre propre application/site/projet partage son propre contenu ou ses propres données sous CC-BY-SA.</p>
        <p>Voir notre <a href="http://growstuff.org/policy/api">API et notre politique d'utilisation des données</a> pour plus d'informations.</p>
        <h2>Bénévolat et emplois</h2>
        <h3>Vous recrutez ?</h3>
        <p>Malheureusement non. Nous sommes un groupe communautaire autofinancé/amorcé.</p>
        <p>Si vous souhaitez vous impliquer, voir ci-dessous.</p>
        <h3>Comment puis-je me porter volontaire pour aider Growstuff ?</h3>
        <p>Tout d'abord, en étant un membre actif du site -- faire pousser des cultures, suivre vos récoltes, publier sur nos forums, apprendre à connaître les autres membres -- vous contribuez à construire notre base de données et notre communauté, sans lesquelles Growstuff serait complètement inutile. Alors merci pour ça !</p>
        <p>Deuxièmement, nous serions ravis que vous puissiez faire connaître Growstuff à vos amis qui cultivent leur propre nourriture ou qui aimeraient essayer. Vous pouvez voir quelques conseils sur la façon de procéder ci-dessous.</p>
        <p>Le logiciel de Growstuff est également construit avec l'aide de développeurs bénévoles. Si vous êtes codeur ou souhaitez apprendre à coder, vous pouvez nous rejoindre. Tous sont les bienvenus, quelle que soit leur expérience.</p>
        <p>Nous avons également des lutteurs de cultures bénévoles, qui gèrent notre base de données de cultures, et des modérateurs, qui contribuent au bon fonctionnement des forums. Ceux-ci sont généralement choisis parmi nos membres les plus actifs et les plus utiles.</p>
        <h3>Comment puis-je m'impliquer en tant que codeur ?</h3>
        <p>Commencez par consulter notre <a href="https://github.com/Growstuff/growstuff/wiki/">wiki</a>, le code sur <a href="http://github.com/Growstuff/growstuff">GitHub</a> et <a href="http://tracker.growstuff.org">tracker</a> pour avoir une idée de la façon dont nous travaillons.</p>
        <p>Si vous souhaitez vous impliquer, vous devez rejoindre notre liste de diffusion de discussion <a href="http://lists.growstuff.org/mailman/listinfo/discuss"></a>.</p>
        <h3>Mes compétences en codage sont rouillées ou inexistantes. Puis-je quand même m'impliquer ?</h3>
        <p>Bien sûr ! Nous aimons encadrer de nouveaux codeurs, des personnes qui n'ont pas codé depuis un certain temps ou des personnes qui apprennent tout juste notre plateforme (Ruby on Rails) pour la première fois. Nous travaillons par programmation en binôme et pouvons vous aider à démarrer des histoires faciles, en commençant par quelque chose d'aussi simple que corriger une faute de frappe ou une balise HTML (consultez la balise "facile" dans notre <a href="http://tracker.growstuff.org">tracker</a> pour quelques exemples).</p>
        <h3>Comment puis-je contribuer à faire connaître Growstuff ?</h3>
        <p>D'abord et avant tout, en le parlant à vos amis et en les invitant à nous rejoindre et à en faire partie. Nous ne voulons pas être spammés à ce sujet, c'est pourquoi nous ne vous demanderons jamais de supprimer votre carnet d'adresses, de publier automatiquement des mises à jour sur Facebook ou de tweeter en votre nom. Mais nous aimerions vraiment que vous le disiez aux gens avec vos propres mots.</p>
        <p>Lieux pour passer le mot en ligne : Facebook, Twitter et autres médias sociaux ; votre propre blog ou site Web ; les forums de jardinage ou de développement durable auxquels vous participez.</p>
        <p>Ou hors ligne : parlez-en à vos amis, votre famille et vos voisins ; faites passer le message dans vos jardins communautaires locaux, sur les marchés de producteurs ou dans les échanges de produits ; contactez votre groupe local de développement durable ou de transition ; ou tout autre endroit où vous pensez que les producteurs de denrées alimentaires pourraient se trouver.</p>
        <h2>Conditions d'utilisation, droits d'auteur et autres abus</h2>
        <h3>Où puis-je signaler une violation des conditions d'utilisation ou du règlement de la communauté ?</h3>
        <p>Vous pouvez publier dans notre <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp; Forum d'assistance</a> ou envoyer un e-mail à <a href="mailto:support@growstuff.org">support@growstuff.org</a>.</p>
        <h3>Qu'est-ce que vous considérez comme du spam et comment puis-je le signaler ?</h3>
        <p>Il existe de nombreux types de spam. Le plus évident est la publicité commerciale répétée et indésirable. De nombreux spammeurs publient également du contenu non pertinent, absurde ou de faible valeur sur des forums pour essayer de vous inciter à cliquer sur un lien, ou simplement pour voir ce qu'ils peuvent faire.</p>
        <p>Veuillez signaler tous ces types de spam !</p>
        <p>Pour l'instant, parce que nous sommes si nouveaux, nous n'avons pas mis en place un bon mécanisme de signalement du spam. Cependant, vous pouvez déposer un lien dans notre forum d'assistance <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp;</a> et nous ferons ce que nous pouvons.</p>
        <h3>Quelqu'un a publié quelque chose qui, selon moi, enfreint les droits d'auteur. Où puis-je le signaler ?</h3>
        <p>Si vous êtes le propriétaire des droits d'auteur, vous pouvez soumettre une plainte en suivant la procédure décrite dans notre <a href="http://growstuff.org/policy/copyright">Politique de violation des droits d'auteur</a>.</p>
        <h3>L'utilisation de Growstuff est-elle sans danger pour les enfants ?</h3>
        <p>En tant que site Web axé sur la culture alimentaire, nous nous attendons à ce que Growstuff soit un environnement plutôt sûr et convivial. Cependant, certaines parties du site (telles que les messages publiés par les membres) peuvent contenir des concepts matures, un langage grossier, etc. Si vous ne voulez pas que vos enfants y soient exposés, nous vous suggérons fortement de superviser leur utilisation de Growstuff. Nous vous suggérons également de faire attention aux informations personnelles que vos enfants partagent sur Growstuff.</p>
        <h2>Support supplémentaire</h2>
        <h3>Où puis-je trouver une liste des problèmes connus avec le site ?</h3>
        <p>Dans notre GitHub <a href="https://github.com/Growstuff/growstuff/issues">Problèmes connus</a>.</p>
        <h3>Ma question n'a pas de réponse ici. Où puis-je demander une assistance supplémentaire ?</h3>
        <p>Sur notre <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp; Forum d'assistance</a>. Veuillez vérifier la liste des problèmes connus avant de publier.</p>
        <h3>Où puis-je publier des commentaires/félicitations ?</h3>
        <p>Nous aimons les commentaires ! Envoyez-nous une note dans notre forum d'assistance <a href="http://www.growstuff.org/forums/growstuff-feedback-support">Feedback &amp;</a>. (Y a-t-il un écho ici ?)</p>
        <h3>Comment puis-je vous contacter autrement ?</h3>
        <p>Si vous avez besoin d'aide pour quelque chose qui n'a pas été abordé ici, vous pouvez envoyer un e-mail à <a href="mailto:support@growstuff.org">support@growstuff.org</a>.</p>
        <p>Les demandes des médias/presse peuvent être adressées à <a href="mailto:media@growstuff.org">media@growstuff.org</a>.</p>
        <p>Si vous avez une question sur le site en général (par exemple, des sujets professionnels, ou si vous souhaitez simplement entrer en contact avec quelqu'un de officiel sans assistance), vous pouvez envoyer un e-mail à <a href="mailto:info@growstuff.org">info@growstuff.org</a>.</p>
    tos:
      title: "Conditions d'utilisation de Growstuff"
      body_html: |
        <p>Nous détestons le jargon juridique, nous avons donc essayé de rendre nos conditions d'utilisation lisibles. Si vous avez des questions, n'hésitez pas à nous les <a href="mailto:support@growstuff.org">demandez</a>, et nous ferons de notre mieux pour y répondre.</p>
        <p>Les responsables de Growstuff ("nous", "notre", "notre", "Growstuff") présentent les termes et conditions suivants, qui régissent votre utilisation du site Web de Growstuff à l'adresse <a href="http://www.growstuff.org">growstuff.org</a>, et de tous les contenus, services et produits disponibles sur ou via le site Web, que nous appelons collectivement "le Service".</p>
        <p>Pour utiliser le Service, vous devez accepter les présentes Conditions d'utilisation, ainsi que toutes les autres politiques que nous publions (y compris, mais sans s'y limiter, la politique de confidentialité de Growstuff, la politique d'utilisation de l'API et des données, la politique de violation des droits d'auteur et les directives de la communauté). Nous appelons cela « l’Accord ».</p>
        <p>Veuillez lire attentivement cet accord avant d'accéder ou d'utiliser le service. En accédant ou en utilisant une partie du Service, vous acceptez d'être lié par les termes et conditions du présent Accord. Si vous n'acceptez pas tous les termes et conditions du présent Contrat, vous ne pourrez pas accéder au Service.</p>
        <h2>1. Votre compte</h2>
        <p>Si vous créez un compte sur le Service, vous êtes responsable du maintien de la sécurité de votre compte. Vous êtes responsable de toutes les activités qui se produisent sous le compte. Vous devez prendre des mesures raisonnables pour assurer la sécurité de votre compte. Nous ne serons pas responsables de tout ce qui se passerait si la sécurité de votre compte était violée en raison de votre incapacité à le protéger.</p>
        <h2>2. Structure du compte</h2>
        <p>Growstuff a un type de compte, et il est gratuit.</p>
        <p>En utilisant ce service, vous acceptez le droit de Growstuff de changer, modifier ou interrompre les fonctionnalités disponibles pour votre compte à tout moment.</p>
        <h2>3. Politique de contenu</h2>
        <p>Notre politique de contenu concerne tout matériel que vous pouvez publier sur le site Web Growstuff ou via le Service, que nous appelons « Contenu ». Cela inclut les informations de profil, les publications et les commentaires, les informations sur votre activité de culture alimentaire et tout autre matériel, qu'il s'agisse de texte, de graphiques ou de tout autre format, que vous pouvez publier sur Growstuff lui-même ou vers lequel créer un lien depuis Growstuff.</p>
        <p>Tout le contenu publié sur le service de quelque manière que ce soit relève de la responsabilité du propriétaire. Si le contenu est jugé illégal par toute loi ayant juridiction sur vous, vous acceptez que nous puissions soumettre toute information nécessaire aux autorités compétentes.</p>
        <p>Nous ne revendiquons aucune propriété ni aucun contrôle sur le contenu que vous publiez sur le service. Vous conservez tous les droits de propriété intellectuelle sur le contenu que vous publiez, conformément à la loi applicable. En publiant du contenu, vous déclarez que vous avez le droit de reproduire ce contenu (et le droit de nous permettre de diffuser ce contenu) sans violation des droits d'un tiers. Vous acceptez que vous assumerez toute responsabilité résultant de la publication de tout contenu que vous n'avez pas le droit de publier.</p>
        <p>Vous nous accordez une licence mondiale, libre de droits et non exclusive pour reproduire, modifier, adapter et publier le contenu, uniquement dans le but d'afficher, de distribuer et de promouvoir le contenu de votre compte, via toute partie du Service, y compris via notre API, nos flux et nos clients externes.</p>
        <p>Si vous supprimez du Contenu, nous déploierons des efforts raisonnables pour le supprimer du Service, mais vous reconnaissez que la mise en cache ou les références au Contenu ne peuvent pas être rendues immédiatement indisponibles.</p>
        <h3>3.1 Données structurées</h3>
        <p>Il existe un sous-ensemble de contenu que nous appelons « Données structurées ». Les données structurées sont du contenu qui représente des faits simples plutôt qu'un effort créatif. Par exemple, les lieux, les dates ou le type et le nombre de cultures que vous avez plantées sont des données structurées. Les données structurées peuvent être créées explicitement par vous ou implicitement par le site Web en réponse à votre activité.</p>
        <p>En utilisant le Service, vous reconnaissez que les données structurées seront collectées et stockées par Growstuff, et que toutes les données structurées vous concernant ou concernant votre activité peuvent être mises à disposition pour une utilisation par des tiers sous une licence Creative Commons Attribution ShareAlike (CC-BY-SA). Vous acceptez également que l'attribution des données structurées selon les termes de la licence Creative Commons soit attribuée à Growstuff.</p>
        <h3>3.2 Contenu publié sur d'autres sites Web</h3>
        <p>Nous n'avons pas examiné et ne pouvons pas examiner tout le matériel, y compris les logiciels informatiques, mis à disposition via les sites Web et les pages Web vers lesquels nous, tout utilisateur ou tout fournisseur de contenu renvoie, ou qui renvoient vers nous. Nous n'avons aucun contrôle sur ces sites Web et pages Web et ne sommes pas responsables de leur contenu ou de leur utilisation. En créant un lien vers un site Web ou une page Web externe, nous ne représentons ni n’impliquons que nous approuvons ce site Web ou cette page Web. Vous êtes responsable de prendre les précautions nécessaires pour vous protéger, ainsi que vos systèmes informatiques, contre les virus, vers, chevaux de Troie et autres contenus nuisibles ou destructeurs. Nous déclinons toute responsabilité pour tout préjudice résultant de votre utilisation de sites Web et de pages Web externes, que ce lien soit fourni par nous ou par tout fournisseur de contenu sur le Service.</p>
        <h3>3.3 Comment nous traitons les problèmes Contenu</h3>
        <p>Vous acceptez qu'en utilisant le Service, vous puissiez être exposé à du Contenu que vous trouvez offensant ou répréhensible.</p>
        <p>Nous ne présélectionnons pas le contenu. Cependant, vous reconnaissez que nous avons le droit (mais pas l'obligation), à notre seule discrétion, de supprimer ou de refuser de supprimer tout contenu du service. Si un tel contenu nous est signalé, les mesures à prendre, le cas échéant, seront à notre seule discrétion.</p>
        <p>Si un contenu que vous avez soumis nous est signalé comme violant le présent accord, vous acceptez que nous puissions vous demander de changer, modifier ou supprimer ce contenu, dans un délai raisonnable, tel que défini par nous. Si vous ne suivez pas cette directive, nous pouvons résilier votre compte.</p>
        <h2>4. Conduite des membres</h2>
        <p>Vous acceptez de ne pas utiliser le Service pour :</p>
        <ol>
        <li>Télécharger, publier ou transmettre de toute autre manière tout contenu qui est préjudiciable, menaçant, abusif, haineux, envahissant la vie privée et les droits de publicité de toute personne, ou qui viole toute loi locale, étatique, nationale ou internationale applicable, y compris toute réglementation ayant force de loi ;</li>
        <li>Télécharger, publier ou transmettre de toute autre manière tout contenu qui est du spam ou contient du contenu commercial contraire à l'éthique ou indésirable conçu pour générer du trafic vers des sites tiers ou améliorer le classement des sites tiers dans les moteurs de recherche, ou pour commettre des actes illégaux (tels que le phishing) ou induire les destinataires en erreur quant à la source du matériel (comme l'usurpation d'identité) ;</li>
        <li>Usurper de manière malveillante l'identité d'une personne ou d'une entité réelle, y compris, mais sans s'y limiter, un membre du personnel ou un bénévole de Growstuff, ou déformer de toute autre manière votre affiliation avec une personne ou une entité ;</li>
        <li>Télécharger, publier ou transmettre de toute autre manière tout contenu que vous n'avez pas le droit de transmettre en vertu d'une quelconque loi ou dans le cadre de relations contractuelles ou fiduciaires (telles que des informations privilégiées, des informations exclusives et confidentielles apprises ou divulguées dans le cadre de relations de travail ou dans le cadre d'accords de non-divulgation) ;</li>
        <li>Télécharger, publier ou transmettre de toute autre manière tout contenu qui enfreint un brevet, une marque commerciale, un secret commercial, un droit d'auteur ou d'autres droits de propriété de toute partie ;</li>
        <li>Interférer avec ou perturber le Service ou les serveurs ou réseaux connectés au Service, ou désobéir à toute exigence, procédure, politique ou réglementation des réseaux connectés au Service ;</li>
        <li>Solliciter des mots de passe ou des informations d'identification personnelle à des fins involontaires, commerciales ou illégales auprès d'autres utilisateurs ;</li>
        <li>Télécharger, publier ou transmettre de toute autre manière tout contenu contenant des virus, des vers, des logiciels malveillants, des chevaux de Troie ou tout autre contenu nuisible ou destructeur ;</li>
        <li>Autoriser l'utilisation par des tiers de manière à violer le présent Accord ;</li>
        <li>Faire une utilisation automatisée excessive ou autrement nuisible du Service ;</li>
        <li>Accéder au compte de toute autre personne ou dépasser la portée du Service auquel vous vous êtes inscrit ; par exemple, accéder et utiliser des fonctionnalités que vous n'avez pas le droit d'utiliser.</li>
        </ol>
        <p>Vous acceptez de respecter les directives de la communauté, qui sont actuellement disponibles à l'adresse <a href="http://www.growstuff.org/policy/community">http://www.growstuff.org/policy/community</a>.</p>
        <h2>5. Bénévoles</h2>
        <p>Nous apprécions le service des bénévoles dans de nombreux aspects des opérations de Growstuff. Les activités bénévoles comprennent, sans toutefois s'y limiter, le développement de logiciels, la fourniture d'un support technique, la rédaction de documentation, l'exécution de tâches d'administration du site, la fourniture de conseils d'experts, la recherche, la rédaction technique, la révision, la catégorisation et d'autres tâches nécessaires pour soutenir le fonctionnement du Service.</p>
        <p>Tous les bénévoles doivent être majeurs ou faire du bénévolat avec le consentement d'un parent ou d'un tuteur légal.</p>
        <p>En faisant du bénévolat, vous acceptez que toute œuvre créée à la suite de vos activités bénévoles soit autorisée à Growstuff sur une base perpétuelle, irrévocable et mondiale, dans la mesure permise par la loi. Vous acceptez que Growstuff puisse déterminer la base sur laquelle votre travail bénévole sera concédé sous licence à des tiers, y compris sous des licences Open Source ou Creative Commons qui peuvent permettre la modification ou la diffusion ultérieure de votre travail. Si les lois empêchent une telle licence, vous acceptez de ne jamais poursuivre Growstuff en justice pour l'utilisation de ladite œuvre.</p>
        <p>En faisant du bénévolat, vous acceptez de fournir votre travail sans attente de salaire ni de contrepartie future de la part de Growstuff. Vous reconnaissez également avoir exercé une diligence raisonnable pour vous assurer que le travail est correct, précis et exempt de défauts. Vous acceptez de ne pas divulguer ni partager aucune information exclusive ou confidentielle qui vous est fournie dans le cadre de votre travail bénévole.</p>
        <p>Aucun utilisateur n'est tenu de faire du bénévolat, et les utilisateurs qui ne font pas de bénévolat recevront les mêmes soins, soutien et attention.</p>
        <h2>6. Politique de confidentialité</h2>
        <p>Votre utilisation du site Web est régie par la politique de confidentialité, actuellement située à <a href="http://www.growstuff.org/policy/privacy">http://www.growstuff.org/policy/privacy</a>.</p>
        <h2>7. Politique d'utilisation des API et des données</h2>
        <p>Votre utilisation de notre API et/ou de nos données est régie par notre Politique d'utilisation de l'API et des données, actuellement située à <a href="http://www.growstuff.org/policy/api">http://www.growstuff.org/policy/api</a>.</p>
        <h2>8. Violation du droit d'auteur</h2>
        <p>Si vous pensez que du matériel situé sur le site Web viole vos droits d'auteur, vous pouvez nous en informer conformément à notre politique de violation des droits d'auteur, actuellement située à <a href="http://www.growstuff.org/policy/copyright">http://www.growstuff.org/policy/copyright</a>.</p>
        <h2>9. Revente de services</h2>
        <p>Vous acceptez de ne pas reproduire, dupliquer, copier, vendre, revendre ou exploiter toute partie du Service, l'utilisation du Service ou l'accès au Service, sauf dans la mesure permise par notre API et notre Politique d'utilisation des données, la licence open source relative au code source du Service ou les licences Creative Commons relatives au Contenu ou à tout autre matériel publié sur le Service.</p>
        <h2>10. Indemnisation</h2>
        <p>Vous acceptez d'indemniser et de dégager Growstuff, ses sous-traitants, ses concédants de licence et leurs directeurs, dirigeants, employés et agents respectifs de et contre toutes réclamations et dépenses, y compris les honoraires d'avocat, découlant de votre utilisation du Service, y compris, mais sans s'y limiter, de votre violation du présent Accord.</p>
        <h2>11. Résiliation</h2>
        <p>Growstuff peut résilier votre compte ou restreindre votre utilisation du Service à tout moment si nous pensons que vous avez violé le présent Accord. Si cela se produit, vous serez informé par e-mail et nous vous indiquerons quelle partie de l'accord nous pensons que vous avez violé. Nous pouvons, à notre discrétion, choisir d'émettre un avertissement plutôt que de résilier votre compte, auquel cas vous serez également informé par e-mail et vous indiquerez quelle partie de l'accord nous pensons que vous avez violé. Nous vous fournirons également une adresse de contact à laquelle vous pourrez faire appel de notre décision ; cependant, nous ne garantissons pas que nous changerons d’avis.</p>
        <p>Vous acceptez que toute résiliation de votre accès au Service puisse impliquer la suppression ou la suppression de tout contenu que vous avez fourni.</p>
        <p>Nous pouvons, à notre seule discrétion, interrompre la fourniture du Service à tout moment, avec ou sans préavis.</p>
        <p>Si vous souhaitez résilier le présent Contrat, vous pouvez supprimer votre compte et cesser d'utiliser le Service. Vous acceptez que, lors de la suppression de votre compte, nous puissions, sans y être obligés, supprimer tout contenu que vous avez fourni, à tout moment après la suppression de votre compte.</p>
        <p>Toutes les dispositions du présent Accord qui, de par leur nature, devraient survivre à la résiliation survivront à la résiliation, y compris, sans limitation, les dispositions sur la propriété, les exclusions de garantie, l'indemnisation et les limitations de responsabilité.</p>
        <h2>12. Changements</h2>
        <p>Nous nous réservons le droit, à notre seule discrétion, de modifier ou de remplacer toute partie de cet accord à tout moment. Un historique des modifications apportées à cet accord est disponible via notre référentiel de code source public à l'adresse <a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a>. Nous prendrons des mesures raisonnables pour vous informer de toute modification substantielle apportée au présent Contrat ; cependant, il est de votre responsabilité de vérifier périodiquement cet accord pour détecter les modifications. Votre utilisation continue du Service après la publication de toute modification apportée au présent Contrat constitue l'acceptation de ces modifications.</p>
        <p>Nous pourrons également, à l'avenir, proposer de nouvelles fonctionnalités ou services via le Service. Ces nouvelles fonctionnalités et/ou services seront soumis aux termes et conditions du présent Accord.</p>
        <h2>13. Exclusion de garanties</h2>
        <p>Ce Service est fourni « tel quel ». Les responsables de Growstuff, ses fournisseurs et concédants de licence déclinent par la présente toute garantie de quelque nature que ce soit, expresse ou implicite, y compris, sans limitation, les garanties de qualité marchande, d'adéquation à un usage particulier et de non-contrefaçon. Ni les responsables de Growstuff, ni ses fournisseurs et concédants de licence ne garantissent que le service sera exempt d'erreurs ou que l'accès au service sera continu ou ininterrompu. Vous acceptez que toute interruption du service ne donnera droit à aucun remboursement ou indemnisation. Vous comprenez que vous téléchargez ou obtenez autrement du contenu ou des services via le Service à votre propre discrétion et à vos propres risques.</p>
        <p>Aucun conseil ou information, qu'il soit oral ou écrit, obtenu par vous de quelque manière que ce soit ne créera une garantie non expressément énoncée dans le présent Accord.</p>
        <h2>14. Limitation de responsabilité</h2>
        <p>Vous comprenez et acceptez expressément qu'en aucun cas les responsables de Growstuff ou ses fournisseurs ou concédants de licence ne seront responsables de tout objet du présent accord en vertu d'un contrat, d'une négligence, d'une responsabilité stricte ou d'une autre théorie légale ou équitable pour : (i) tout dommage spécial, accidentel ou consécutif ; (ii) le coût d’achat ou de produits ou services de remplacement ; (iii) interruption d’utilisation ou perte ou corruption de données ; (iv) toute déclaration ou comportement d'un tiers sur le service ; ou (v) tout accès non autorisé ou modification de votre contenu. Nous ne pourrons être tenus responsables de tout échec ou retard dû à des questions indépendantes de notre volonté raisonnable.</p>
        <p>Ce qui précède ne s'applique pas dans la mesure interdite par la loi applicable.</p>
        <h2>15. Informations générales</h2>
        <p>Cet accord constitue l'intégralité de l'accord entre nous et vous concernant votre utilisation du Service. Cet accord ne peut être modifié que par un amendement écrit signé par un représentant autorisé des responsables de Growstuff, ou par la publication d'une version révisée à cet emplacement. Sauf dans la mesure où la loi applicable (le cas échéant) en dispose autrement, tout litige survenant entre vous et les responsables de Growstuff concernant les présentes Conditions d'utilisation et/ou votre utilisation ou accès au Service sera régi par les lois de l'État de Victoria et les lois fédérales de l'Australie, à l'exclusion de toute disposition relative aux conflits de lois. Vous acceptez de vous soumettre à la juridiction des tribunaux étatiques et fédéraux situés à Melbourne, en Australie, pour tout litige découlant de ou lié à votre utilisation du Service ou à votre acceptation du présent Contrat.</p>
        <p>Si une partie du présent accord est jugée invalide ou inapplicable, cette partie sera interprétée comme reflétant l'intention originale des parties, et les parties restantes resteront pleinement en vigueur. Une renonciation par l'une ou l'autre des parties à tout terme ou condition du présent Accord ou à toute violation de celui-ci, dans un cas donné, ne renoncera pas à ce terme ou condition ou à toute violation ultérieure de celui-ci.</p>
        <p>Les titres des sections de cet accord sont uniquement destinés à des fins de commodité et n'ont aucun effet juridique ou contractuel.</p>
        <h2>16. Signalement des violations</h2>
        <p>Pour signaler une violation de cet accord, veuillez envoyer un e-mail à <a href="mailto:support@growstuff.org">support@growstuff.org</a>.</p>
        <h2>17. Creative Commons</h2>
        <p>Ce document de conditions d'utilisation est basé sur celui développé par Automattic (<a href="http://wordpress.com/tos/">http://wordpress.com/tos/</a>) avec des modifications par Dreamwidth (<a href="http://www.dreamwidth.org/legal/tos">http://www.dreamwidth.org/legal/tos</a>) et est sous licence <a href="http://creativecommons.org/licenses/by-sa/2.5/">Creative Commons Attribution-ShareAlike 2.5 Licence</a>.</p>
