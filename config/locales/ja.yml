        <li>有害、脅迫、虐待、嫌悪感を与えるコンテンツ、個人のプライバシーや肖像権を侵害するコンテンツ、または法的強制力を持つ規制を含む適用される地方法、州法、国内法、または国際法に違反するコンテンツをアップロード、投稿、またはその他の方法で送信すること。</li>
        <li>スパムであるコンテンツ、または第三者のサイトへのトラフィックを誘導したり、第三者のサイトの検索エンジンのランキングを上昇させたり、さらなる違法行為 (フィッシングなど) や素材の出所について受信者に誤解を与えたり (なりすましなど) することを目的とした非倫理的または望ましくない商用コンテンツを含むコンテンツをアップロード、投稿、またはその他の方法で送信すること。</li>
