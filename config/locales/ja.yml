  pages:
    community_guidelines:
      title: "Growstuff コミュニティ ガイドライン"
      body_html: |
        <p>Growstuff は、食品園芸家による、食品園芸家のためのコミュニティです。私たちは協力して、経験、知識、収穫物を共有できるウェブサイトを構築しています。 Growstuff で最も重要なのは人材です。 Growstuff が繁栄するためには、作物を追加し、知識を共有し、サイト自体の構築を手伝ってくれる人々が必要です。</p>
        <p>Growstuff にどんな興味があっても、ここでは歓迎され、敬意を持って扱われます。特に:</p>
        <ul>
        <li>
        <p>私たちは、年齢、性自認や表現、民族、国籍、宗教の有無、政治的意見、性的指向、婚姻状況、家族構成、能力や障害、外見、サブカルチャー、その他のアイデンティティや自己認識を問わず、あらゆる人々を歓迎します。</p>
        </li>
        <li>
        <p>Growstuff は主に食品園芸に焦点を当てていますが、有機栽培者や従来の栽培者を含むあらゆる種類の園芸家を歓迎します。畑やバルコニー、水耕栽培システムで作物を栽培する人。商業的または非商業的にガーデニングをする人。作物で生計を立てている人たちと、他の理由でガーデニングをしている人たち。</p>
        </li>
        <li>
        <p>私たちは、あらゆるスキルや経験レベルの人々を歓迎します。新人または学習中であるという理由だけで、軽蔑したり、失礼なコメントをしたりすることはないと信じています。</p>
        </li>
        <li>
        <p>私たちのサイトにスキル、知識、情報を提供する庭師を含む、コミュニティ内のあらゆる役割が重要です。それを構築するのに役立つプログラマー、デザイナー、その他の技術者。モデレーターやコミュニティの繁栄を支援するその他の人々。またはその他の形式の参加。私たちは協力することを信じており、コミュニケーションと相互理解を優先します。</p>
        </li>
        </ul>
        <p>Growstuff コミュニティ (これには当社の Web サイトおよびメーリング リスト、IRC チャネルなどの補助フォーラムが含まれます) に参加したい場合は、包括性と相互尊重に対する当社の一般的な取り組み、および以下の特定のポリシーに同意する必要があります。</p>
        <ul>
        <li>
        <p>Growstuff コミュニティのメンバーに対する嫌がらせは禁止されています。ハラスメントには、個人またはグループに対する中傷が含まれます。あらゆる個人またはグループに向けられた望ましくない性的発言。公共の場での露骨な性的コメントや画像。ストーカー行為またはその他の度重なる望ましくない接触。または、他の人の Growstuff サイトまたはコミュニティの楽しみを妨害する反復的または継続的な行為。</p>
        </li>
        <li>
        <p>コミュニティメンバーのプライバシーは非常に重要です。お客様は、明示的な同意がない限り、メンバーの個人情報 (Growstuff 社外で知られている名前、所在地、雇用詳細、家族詳細、Growstuff 社外での連絡先詳細、またはその他の識別情報または個人情報を含む) を開示してはなりません。</p>
        </li>
        <li>
        <p>当社のサイトではお客様ご自身の名前を選択することができ、財布の中のカードに記載されている名前と同じ名前を当社のウェブサイトで使用することは要求されませんが、人々を誤解させたり、責任を回避したり、その他の問題を引き起こすために、偽名アカウントを作成または使用することは許可されていません。 (これは一般に「ソックパペット」アカウントとして知られています。)</p>
        </li>
        </ul>
        <p>これらのコミュニティ ガイドラインに反する行為を経験または目撃した場合は、support@growstuff.org に報告できます。私たちはあなたの報告に注意深く耳を傾け、真剣に受け止めます。状況を調査した後、必要と判断した措置を講じることがあります。たとえば、警告を発したり、深刻な場合にはコミュニティからの参加を停止または禁止したりする場合があります。このようなことが起こった場合、当社はポリシー文書を参照しながら、影響を受ける人に当社の行動の理由を常に伝えます。</p>
        <p>これらのガイドラインを長すぎたり、法律主義的にしたりしたくないので、最後のガイドラインを除いてそのままにしておきます。ビルとテッドが言ったように、<em>お互いに優れていてください</em>。そして物を育てます。</p>
        <h2>クリエイティブ・コモンズ・ライセンス</h2>
        <p>これらのコミュニティ ガイドラインは、<a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">クリエイティブ コモンズ表示-継承 (CC-BY-SA) 3.0 非移植ライセンス</a> に基づいてライセンスされています。</p>
    copyright:
      title: "著作権侵害ポリシー"
      body_html: |
        <p>私たちは法律用語が大嫌いなので、このポリシーを読みやすいものにするよう努めました。ご質問がございましたら、お気軽に<a href="mailto:support@growstuff.org">お問い合わせください</a>、最善を尽くしてお答えいたします。</p>
        <p>この著作権侵害ポリシーは、Growstuff の管理者 (「Growstuff」、「当社」、「私たち」、「当社」) が所有および運営するすべての Web サイト (<a href="http://www.growstuff.org">growstuff.org</a> など) およびすべての関連サービス (総称して「本サービス」といいます) を対象としています。サービス上の著作権侵害を報告する方法について説明します。</p>
        <p>Growstuff は他者の知的財産を尊重しており、ユーザーにも同様のことをお願いしています。 Growstuff メンバーは、<a href="http://www.growstuff.org/policy/tos">利用規約</a> により、サービスにコンテンツを投稿する法的権利を確実に持つことが求められています。</p>
        <p>Growstuff はオーストラリアのメルボルンに拠点を置いており、米国デジタル ミレニアム著作権法 (DMCA) の規定の対象ではありません。ただし、オーストラリアで運営される Web サービスのベスト プラクティスを構成すると考えているため、DMCA で要求されているものと同様のポリシーと手順を確立しました。</p>
        <h2>1.権利侵害の通知</h2>
        <p>Growstuff メンバーがコンテンツをサービスに投稿することによってあなたの知的財産権を侵害していると思われる場合は、次の手順に従って当社に通知し、コンテンツの削除を要求することができます。</p>
        <p>通知は<a href="mailto:support@growstuff.org">support@growstuff.org</a> に電子メールで送信できます。</p>
        <p>通知は電子メールで受け取ることを希望します。</p>
        <p>他のメカニズムやフォーラムを通じて送信された著作権侵害通知には対応しません。</p>
        <p>次の情報を提供する必要があります:</p>
        <ul>
        <li>侵害されている著作物を特定するのに十分な情報。たとえば、作品が出版された本の場合は、タイトル、著者、ISBN を入力します。作品が雑誌記事の場合は、タイトル、著者、雑誌名、雑誌の号を入力します。作品がインターネット上で入手可能な場合は、作品の URL を入力してください。</li>
        <li>あなたの作品が無断転載されたGrowstuffの特定ページのURL。一般的な説明や非特定のリンク (Growstuff のホームページなど) には対応できません。</li>
        <li>あなたの住所、電話番号、電子メールアドレス。</li>
        <li>上記の情報が正確であり、あなたが著作権または知的財産の所有者であるか、著作権または知的財産の所有者に代わって行動する権限を与えられているという、あなたによる声明。</li>
        <li>著作権または知的財産の所有者、またはその代理人として行動する権限を与えられた人物の、PGP などの業界標準形式で認められた物理署名またはデジタル署名。署名されていない通知は処理されません。</li>
        </ul>
        <h2>2.通知への応答</h2>
        <p>著作権侵害の通知には 2 営業日以内に対応いたします。</p>
        <p>上記のセクションに記載されているすべての項目を含め、通知に基づいて行動するのに十分な情報が提供されていない場合、当社は通知を拒否し、送信者に通知に基づいて行動できないことを通知します。</p>
        <p>コンテンツが当社のサーバーでホストされていない場合（たとえば、通知が、単に表示されている、または当社のサイトからリンクされている別のサイトでホストされている画像に関するものである場合）、当社はこれに応答し、コンテンツが当社によってホストされていないことを送信者に通知し、ホスティングサイトを参照します。</p>
        <p>通知に基づいて対応できる場合、当社はコンテンツを投稿したメンバーに連絡し、通知と知的財産権の請求について通知します。</p>
        <p>メンバーは 2 営業日以内に返信します。彼らは次のように反応するかもしれません。</p>
        <ul>
        <li>知的財産権を保有していないものを投稿したことを認めます。この場合、会員は本サービスからコンテンツを削除し、またはコンテンツにアクセスできなくすることができるものとします。</li>
        <li>コンテンツを投稿する権利があり、法廷でこの主張を支持する用意があることを記載した異議申し立て通知を提出します。このプロセスの概要を以下に示します。</li>
        <li>知的財産権を侵害しているとは思わないが、正式に異議申し立て通知を提出することは望まないと回答します。この場合、会員は、本サービスからコンテンツを削除し、またはコンテンツにアクセスできなくすることができるものとします。</li>
        <li>会員が応答しない場合、当社はコンテンツにアクセスできないようにします。</li>
        </ul>
        <p>コンテンツが削除されるか、アクセス不能になった場合、当社は、サービス経由でコンテンツにアクセスできないように合理的な努力を行います。ただし、キャッシュまたは外部参照により、サードパーティのサイトやアプリケーションを含め、コンテンツがしばらくアクセス可能なままになる場合があります。サードパーティのサイトおよびアプリケーションは Growstuff の管理下にありません。侵害コンテンツが削除されたり、サービス経由でアクセスできなくなったりしても、サードパーティのサイトやアプリケーションからは引き続き利用できる場合、著作権または知的財産所有者は、それらのサイト/アプリケーションの運営者に連絡して侵害を通知することがあります。</p>
        <h2>3.異議申し立て通知と復元のプロセス</h2>
        <p>異議申し立て通知は、自分のコンテンツが他人の権利を侵害しているとは思わない、または他人の著作権で保護された素材の使用が法律で保護されているカテゴリーに該当すると信じているという声明です。</p>
        <p>異議申し立て通知を提出することにより、著作権所有者があなたの素材の使用に対してあなたに対して訴訟を起こすことを選択した場合、あなたは法廷であなたの素材の使用を弁護する用意があることを示していることになります。これには、民事罰および/または刑事罰が含まれる場合があります。法律に基づく自分の権利と義務を認識するために、これを行う前に、あなたの管轄区域で弁護士の資格を有する知的財産弁護士に相談することを強くお勧めします。</p>
        <p>異議申し立て通知には以下の項目を含める必要があります。</p>
        <ul>
        <li>あなたのサイン。署名は、物理署名、または PGP などの認識された業界標準形式のデジタル署名の場合があります。</li>
        <li>問題となっているコンテンツの URL (これは元の通知で提供されます)。</li>
        <li>著作権侵害通知が素材の間違いまたは誤認の結果として送信されたものであると誠実に信じているという声明。これには、素材の使用が侵害していないと考える理由を含める必要があります。</li>
        <li>お名前、ご住所、電話番号。</li>
        </ul>
        <p>私たちはあなたの異議申し立て通知の全文を元の通知の提出者に転送します。その後、14 日以内に法的措置を開始し、その旨を当社に通知する必要があります。</p>
        <p>それまでの間、コンテンツにアクセスできないようにします。</p>
        <p>14 日経過しても法的手続きが開始された旨の通知がない場合、当社はコンテンツを復元します。</p>
        <p>異議申し立て通知を提出した場合、待機期間が終了したことを通知するまで、侵害の疑いのある素材を再投稿することはできません。</p>
        <h2>4.再犯</h2>
        <p>有効な著作権侵害通知を 3 件以上受け取ったメンバーは、アカウントを停止されます。</p>
        <p>異議申し立て通知が提出された場合、または会員が著作権侵害の申し立てを受け入れないが正式に異議申し立て通知を提出することを希望しないと述べた場合、その通知は終了にはカウントされません。</p>
        <p>また、当社は、他のメンバーに対する著作権侵害通知プロセスを悪用または悪用したと当社が判断した者のアカウントを停止する権利を留保します。</p>
        <h2>5.変更点</h2>
        <p>当社は著作権侵害ポリシーを随時変更することがあります。このポリシーの変更履歴は、<a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a> のパブリック ソース コード リポジトリから入手できます。当社は、本ポリシーの大幅な変更については合理的な措置を講じてお客様に通知します。ただし、このポリシーに変更がないか定期的に確認するのはあなたの責任です。本ポリシーの変更後も本サイトを継続して使用することにより、かかる変更を承諾したものとみなされます。</p>
        <h2>6.クリエイティブ・コモンズ・ライセンス</h2>
        <p>この著作権侵害ポリシーは、Dreamwidth (<a href="http://www.dreamwidth.org/legal/dmca">http://www.dreamwidth.org/legal/dmca</a>) によって開発されたポリシーに基づいており、<a href="http://creativecommons.org/licenses/by-sa/2.5/">クリエイティブ・コモンズ表示-継承 2.5 ライセンス</a> に基づいてライセンスされています。</p>
    data_use:
      title: "API およびデータ使用ポリシー"
      body_html: |
        <p>私たちは法律用語が大嫌いなので、このポリシーを読みやすいものにするよう努めました。ご質問がございましたら、お気軽に<a href="mailto:support@growstuff.org">お問い合わせください</a>、最善を尽くしてお答えいたします。</p>
        <p>この API およびデータ使用ポリシーは、Growstuff メンテナー (「Growstuff」、「当社」、「私たち」、「当社」) が所有および運営するすべての Web サイト (<a href="http://www.growstuff.org">growstuff.org</a> など) およびすべての関連サービス (総称して「本サービス」といいます) を対象としています。</p>
        <p>特に、このポリシーは、アプリケーション プログラミング インターフェイス、フィード、スパイダーリング、スクレイピング、またはサービス経由で利用可能な構造化データまたはコンテンツへのその他の自動化またはプログラムによるアクセス (総称して「API」) を介したサービスへのアクセスを対象とします。このポリシーは、API を使用するすべての人 (「あなた」、「開発者」) に適用されます。</p>
        <h2>1. API は現状のまま提供され、変更される可能性があります</h2>
        <p>Growstuff は、<a href="http://www.growstuff.org/policy/tos">利用規約</a> の「保証の免責事項」に記載されているとおり、API を現状のまま提供します。</p>
        <p>Growstuff の API は変更される可能性があります。当社は、API 機能の変更およびリリース状況を開発者に通知するために合理的な努力を払います。フォーラム、メーリング リスト、またはその他のチャネルを通じて Growstuff の技術ニュースを常に最新の状態に保つために、合理的な努力を払う必要があります。</p>
        <h2>2.サーバーに過負荷をかけないでください</h2>
        <p>サービスへの過度の負荷を防ぐ方法で API へのアクセスを制限することに同意します。 Growstuff は、サービスのパフォーマンスを維持するために必要な場合、API へのアクセスを制限またはレート制限する権利を留保します。</p>
        <h2>3. Growstuff データとコンテンツの使用</h2>
        <p>あなたは、当社の構造化データが利用可能になる<a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">クリエイティブ・コモンズ表示-継承 (CC-BY-SA) 3.0非移植ライセンス</a>の条件を遵守することに同意します。投稿、コメント、画像などを含むがこれらに限定されない、サービスに投稿されたコンテンツに関する Growstuff のメンバーの著作権および知的財産権を遵守することに同意します。</p>
        <p>API 経由でアクセスする構造化データまたはコンテンツに関連するプライバシー設定を尊重することに同意します。あなたは、構造化データまたはコンテンツを、投稿したメンバーが当初意図したものよりも許容度の高いアクセスで再公開しないことに同意するものとします。</p>
        <p>Growstuff は、API の下で利用可能になった構造化データおよびコンテンツが、任意の期間にわたって第三者によってキャッシュまたは保持される可能性があることを認めます。ただし、現在の構造化データおよびコンテンツを使用してアプリケーションを構築している場合は、サービスから削除された構造化データまたはコンテンツを削除し、それに関連するプライバシー設定の変更を反映するなど、アプリケーションを定期的に更新するための合理的な努力を行うことをお願いします。</p>
        <p>Growstuff には、CC-BY-4.0 ライセンスに基づいて、<a href="https://www.foodstandards.gov.au/legal-policies/copyright">Food Standards Australia New Zealand</a> による<a href="https://www.foodstandards.gov.au/science-data/food-nutrient-databases/afcd">オーストラリア食品成分データベース</a> のデータが含まれています。</p>
        <h2>4.認証</h2>
        <p>Growstuff は、API およびデータの使用条件として認証および/またはアプリ登録を要求する権利を留保します。</p>
        <p>ユーザーに Growstuff へのログイン機能を提供する場合は、OAuth 経由で行う必要があります。ユーザーに Growstuff のログイン名とパスワードの提供を要求しない場合があります。</p>
        <h2>5.罰則</h2>
        <p>本ポリシーの条件に違反した場合、Growstuff は API へのアクセスを制限することがあります。</p>
        <h2>6.変更点</h2>
        <p>当社はAPIおよびデータ使用ポリシーを随時変更する場合があります。このポリシーの変更履歴は、<a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a> のパブリック ソース コード リポジトリから入手できます。当社は、本ポリシーの大幅な変更については合理的な措置を講じてお客様に通知します。ただし、このポリシーに変更がないか定期的に確認するのはあなたの責任です。本ポリシーの変更後も本サイトを継続して使用することにより、かかる変更を承諾したものとみなされます。</p>
        <h2>7.クリエイティブ・コモンズ・ライセンス</h2>
        <p>この API およびデータ使用ポリシーは、<a href="http://creativecommons.org/licenses/by-sa/3.0/deed.en_US">クリエイティブ コモンズ表示-継承 (CC-BY-SA) 3.0 非移植ライセンス</a> に基づいてライセンスされています。</p>
    privacy:
      title: "プライバシーポリシー"
      body_html: |
        <p>私たちは法律用語が大嫌いなので、このポリシーを読みやすいものにするよう努めました。ご質問がございましたら、お気軽に<a href="mailto:support@growstuff.org">お問い合わせください</a>、最善を尽くしてお答えいたします。</p>
        <p>このプライバシーに関する声明 (「プライバシー ポリシー」) は、Growstuff の管理者 (「Growstuff」、「当社」、「私たち」、「当社の」) が所有および運営するすべての Web サイト (<a href="http://www.growstuff.org/">growstuff.org</a> など) およびすべての関連サービス (総称して「本サービス」といいます) を対象としています。</p>
        <p>当社は、お客様が当社と共有する情報を社内業務の目的で使用します。当社はあなたの情報を販売しません。この通知では、当社が収集する情報、その使用方法、および情報を保護し安全に保つために当社が講じる手順について説明します。</p>
        <h2>1.当社が収集する情報</h2>
        <h3>1.1 非個人データ</h3>
        <p>ほとんどのウェブサイト運営者と同様に、当社はブラウザの種類、言語設定、参照サイト、各訪問者のリクエストの日時などの非個人データを収集します。</p>
        <p>当社は、訪問者やメンバーが当社のサービスをどのように利用しているかを理解し、サービスをどのように変更および適応させるかを決定するためにこれを使用します。</p>
        <p>当社は、意思決定の根拠を説明するために、非個人データを集合的な形式で（たとえば、サイトの使用傾向を公開するなどして）公開する場合があります。当社は、集計情報のみを公開し、個別の情報は公開しません。</p>
        <h3>1.2 個人データ</h3>
        <p>個人データとは、お客様の正式な名前、電子メール アドレス、IP アドレス、物理的な場所など、お客様を特定したり連絡したりするために使用できるものすべてを指します。</p>
        <h4>1.2.1 自動的に収集される個人データ</h4>
        <p>当社は、お客様が当社のウェブサイトにアクセスするたびに、お客様のブラウザやコンピュータから提供される IP アドレスなどの一部の個人データを自動的に収集します。</p>
        <p>当社はこの情報をいくつかの目的で収集します。</p>
        <ul>
        <li>サイトの使用に関するネットワークの問題を診断し、修復するため。</li>
        <li>特定の地理的地域からサービスにアクセスするユーザーの数を推定するため。</li>
        <li>詐欺や虐待の防止に役立ちます。</li>
        </ul>
        <h4>1.2.2 メールアドレス</h4>
        <p>サービスに登録するには、メールアドレスを入力する必要があります。当社は、パスワードを変更するときなど、特定のアクションの確認を送信するためにお客様の電子メール アドレスを使用します。お客様が開始したリクエストを完了する必要がある場合、またはサービスの使用に影響する重大な問題または管理上の問題がある場合、当社はお客様に連絡します。</p>
        <p>アカウントを作成したら、特定のイベントを購読することを選択し、それらのイベントの通知を電子メールで送信することができます。いつでも気が変わって、電子メールによる通知の受信をオプトアウトすることができます。</p>
        <p>当社は、以下に定める場合を除き、マーケティング目的またはその他の理由で、お客様の電子メール アドレスを第三者に販売または提供することはありません。</p>
        <h4>1.2.3 お客様が当社に提供するオプションの個人データ</h4>
        <p>サービスを使用する際、プロフィールやサイト上のその他のアクティビティを通じて、より多くの個人データを提供するオプションがあります。この情報の提供は厳密に任意です。</p>
        <p>あなたの所在地を当社に提供するオプションがあります。これは、希望する詳細レベルで提供できます。たとえば、住所や居住国を入力することも、何も入力しないこともできます。この場所は、関連コンテンツを提供するために使用されます。</p>
        <p>本サービス上での活動の多くでは、個人データを投稿したり、あなた自身に関する個人データを直接的または間接的に開示したりすることが可能になる場合があります。たとえば、写真をアップロードしたり、使用している別の Web サイトにリンクしたり、ガーデニング活動を詳細に記録したりすることによって、サイト上の投稿やコメントで個人データを開示する場合があります。これらのアクティビティはすべてオプションです。サービス上での活動を通じて個人データを開示する場合には、十分な注意を払う必要があります。</p>
        <p>当社は、お客様が選択したプライバシー オプションに従って、お客様が提供した情報（それに含まれる個人データを含む）を、サイトを閲覧している他の人に表示します。</p>
        <p>お客様が提供した情報は、お客様が選択したプライバシー オプションに従い、<a href="http://www.growstuff.org/policy/api">http://www.growstuff.org/policy/api</a> で入手できる当社の API およびデータ使用ポリシーの条件に従い、当社の API およびフィードを介して第三者にも利用可能になります。</p>
        <p>お客様が提供する情報の一部は構造化データとして分類されており、これについては当社の<a href="/policy/tos">利用規約</a>でより詳しく定義されています。当社では、お客様が選択したプライバシー オプションに従って、第三者による使用のために、クリエイティブ コモンズ表示継承 (CC-BY-SA) 3.0 非移植ライセンスに基づいて構造化データを自由に利用できるようにしています。</p>
        <p>当社は、サービスの変更および適応方法についての決定を行うために、お客様から提供された個人データを集合的に使用する場合があります。当社は、意思決定の根拠を説明するために、集合的な形式で情報を公開することがあります (たとえば、サイトの使用状況の傾向を公開するなど)。当社は、集計情報のみを公開し、個別の情報は公開しません。</p>
        <h2>2.個人データの開示</h2>
        <p>当社は、お客様が提供した任意の個人情報を含む個人データを開示しますが、通常は他のサイト ユーザーには公開されません。これは、(i) サービスを運営するためにその情報を知る必要があり、(ii) 他者に開示しないことに同意した当社の従業員、請負業者、およびボランティアの人々にのみ開示されます。これが必要な状況には、技術的な問題のトラブルシューティングと診断、利用規約違反の可能性の調査、および法的コンプライアンスの問題が含まれますが、これらに限定されません。</p>
        <p>当社は、一部のサイト機能を提供するためにサードパーティベンダーと契約を結んでいます。当社は、これらのサイト機能を提供するために必要な範囲でのみ、サードパーティベンダーと個人情報を共有します。当社は、サードパーティベンダーに対して、当社と同じレベルのプライバシー保護を提供することを要求しており、サードパーティベンダーには、これらのサイト機能を提供する以外の目的で個人情報を共有または使用する権利はありません。</p>
        <p>当社は、法律または裁判所命令によって公開が要求されている場合、または当社、第三者、または一般大衆の安全や権利を保護するために開示が合理的に必要であると誠意を持って判断する場合、個人データまたは潜在的に個人を特定できるデータを開示することがあります。</p>
        <p>当社は、当社の資産のすべてまたは実質的にすべての売却、合併、清算、管財人就任または譲渡の場合に、第三者が Growstuff プライバシー ポリシーの条項を遵守することに同意し、お客様が当社に提供した目的でのみお客様の個人データを使用することを条件として、お客様の個人データを第三者に転送する権利を留保します。このような転送が行われた場合には通知され、オプトアウトする機会が与えられます。</p>
        <h2>3.クッキー</h2>
        <p>Cookie は、Web サイトが訪問者のコンピュータに保存し、訪問者が戻るたびに訪問者のブラウザが Web サイトに提供する一連の情報です。当社は Cookie を使用して、訪問者、Web サイトの使用状況、Web サイトへのアクセス設定を識別および追跡します。また、アカウントへのログインを管理するために Cookie も使用します。</p>
        <p>自分のコンピュータに Cookie を配置したくない訪問者は、サイトを使用する前に Cookie を拒否するようにブラウザを設定する必要があります。ただし、サイトの特定の機能が Cookie の助けなしでは正しく機能しない可能性があります。</p>
        <h2>4.機密保持とセキュリティ</h2>
        <p>インターネット上のデータ送信は 100% 安全であると保証できません。このサービスはご自身の責任でご利用ください。ただし、当社はお客様の個人データを保護するためにあらゆる合理的な措置を講じます (適切な技術的および組織的措置を含む)。</p>
        <p>あなたのアカウント情報はパスワードで保護されています。強力で安全なパスワードを選択することをお勧めします。当社は業界標準の暗号化を使用して、サーバー上のパスワードを保護します。</p>
        <p>システムセキュリティ侵害が判明した場合は、お客様が身を守るために適切な措置を講じられるよう、電子的に通知します。</p>
        <h2>5.あなたの情報を削除する</h2>
        <p>お客様が当社に提供したオプション情報はいつでも変更または削除できます。提供したオプション情報を変更または削除すると、変更はサービス上で直ちに反映されます。ただし、本サービスに基づくサードパーティ アプリケーションを含め、データのキャッシュまたは参照により、以前に利用可能だったデータがしばらく利用可能なままになる場合があります。</p>
        <p>サービスの日常業務の一環として、当社はバックアップを目的としてデータベースに含まれるデータのコピーを定期的に作成します。これらのバックアップには、数週間または数か月分の削除されたデータが含まれる可能性があります。これらのバックアップには、個人データの開示に関する規則も適用されます。</p>
        <h2>6.変更点</h2>
        <p>当社はプライバシーポリシーを随時変更する場合があります。このポリシーの変更履歴は、<a href="https://github.com/Growstuff/policy">https://github.com/Growstuff/policy</a> のパブリック ソース コード リポジトリから入手できます。当社は、本ポリシーの大幅な変更については合理的な措置を講じてお客様に通知します。ただし、このポリシーに変更がないか定期的に確認するのはあなたの責任です。このプライバシー ポリシーの変更後もこのサイトを継続的に使用すると、かかる変更に同意したものとみなされます。</p>
        <h2>7.お問い合わせ</h2>
        <p>このポリシーについてご質問がある場合は、<a href="mailto:support@growstuff.org">support@growstuff.org</a>までご連絡ください。</p>
        <h2>8.クリエイティブ・コモンズ</h2>
        <p>このプライバシー ポリシーは、Automattic (<a href="http://automattic.com/privacy/">http://automattic.com/privacy/</a>) によって開発され、Dreamwidth (<a href="http://dreamwidth.org/legal/privacy">http://dreamwidth.org/legal/privacy</a>) によって修正されたものに基づいており、<a href="http://creativecommons.org/licenses/by-sa/2.5/">クリエイティブ コモンズ表示-継承 2.5 に基づいてライセンスされています。ライセンス</a>。</p>
    support:
      title: "サポート - よくある質問"
      body_html: |
        <h2>グロースタッフについて</h2>
        <h3>Growstuff を運営しているのは誰ですか?</h3>
        <p>Growstuff は、オーストラリアのメルボルン出身のオープンソース ソフトウェア開発者で熱心な野菜作りの専門家である Alex Bayley (<a href="/members/skud">Skud</a>) によって設立されました。現在はコミュニティによって維持されています。</p>
        <h3>Growstuff はどのようにして始まったのですか?</h3>
        <p>Growstuff のアイデアは、2012 年にスペインで開催されたオープンソース カンファレンスでのディスカッションから生まれました。私たちは作物の植え付けと栽培に関する情報の無料のオープン ソースを望んでおり、これを行うための最良の方法は世界中の園芸家から情報をクラウドソーシングすることであると認識しました。</p>
        <p>私たちは 2012 年 8 月に初めて Growstuff をオープンソース プロジェクトとして設立し、2013 年 3 月にひっそりと立ち上げました。</p>
        <h3>グロースタッフは非営利ですか?</h3>
        <p>Growstuff はコミュニティ運営のプロジェクトです。また、作物とその栽培者に関するソフトウェアと集約データは、オープン ライセンスの下で自由に利用できることも知っておく必要があります。</p>
        <h3>Growstuff に広告を掲載できますか?</h3>
        <p>申し訳ありませんが、100% 広告が表示されません。</p>
        <p>メンバーであれば、トレーディングポストエリアに取引または販売するものを投稿できますが、バナー広告などはありませんし、今後もありません。外部広告を通じてウェブサイトをサポートすることは、メンバーや訪問者にとって快適な体験を損なうものであり、持続可能なビジネス モデルではないと私たちは考えています。</p>
        <h3>グロースタッフの状況はどうですか？ベータ版ですか？</h3>
        <p>私たちは「ベータ」という言葉やそれが表す考え方をあまり好きではありません。 Growstuff は常に変化と改善を続けており、常に新しい機能を追加し、メンバーにとってより良いものにしていきたいと考えています。</p>
        <p>バグや問題を見つけた場合は、サポートフォーラムを通じてお知らせください。必要な機能がまだ利用できない場合は、すぐにもう一度確認してください。</p>
        <h2>メンバーシップ</h2>
        <h3>Growstuff は無料で使用できますか?</h3>
        <p>絶対に！このサイトを気に入っていただけましたら、寄付をご検討いただければ幸いです (フッターのリンクをご覧ください)。</p>
        <h3>家族、学校、地域グループのメンバーシップを取得できますか?</h3>
        <p>そうだ！ 「JonesFamily」や「SmithfieldCommunity」など、あなたのボートに浮かぶものであれば何でもお気軽にサインアップしてください。</p>
        <p>そのアカウントで起こったすべてのことについてはあなたが責任を負うので、そのアカウントの使用を誰に許可するか注意してください。やがて、コミュニティ ガーデンがそのメンバーや庭師と共有できるようにする機能を開発して、コミュニティ ガーデンのアカウントとしてログインしなくても、コミュニティ ガーデンに何が植えられているかを追跡できるようにしたいと考えています。準備が整い次第広く公表しますので、注目してください。</p>
        <h2>プロフィール、設定、プライバシー</h2>
        <h3>プロフィールに写真を追加するにはどうすればよいですか?</h3>
        <p>プロフィール写真は、WordPress ブログ プラットフォームを運営する人々が運営する「世界的に認められたアバター」を提供するサービスである <a href="https://gravatar.com">Gravatar</a> によって提供されています。</p>
        <p>Growstuff にサインアップしたときと同じアドレスを使用して、過去に Gravatar にサインアップしたことがある場合は、すでにプロフィール用の写真を持っているでしょう。</p>
        <p>Gravatar アドレスとは異なるメール アドレスで Growstuff にサインアップした場合は、Gravatar にアドレスを追加する必要があります。</p>
        <p>これまで Gravatar にサインアップしたことがない場合は、アカウントを作成して写真をアップロードすると、Growstuff だけでなく、同じメール アドレスを使用する Gravatar をサポートする他のサイトにも表示されます。</p>
        <h3>個人的なことをすべて入力する必要がありますか?</h3>
        <p>あなたのプロフィールにはあなたについていくつかの質問があり、必要に応じて答えるかどうかを選択できます。当社では、追跡や人口統計の目的でお客様の本名、性別、年齢などの個人情報を必要としません。これは、当社のサイトに広告がないことの利点の 1 つです。</p>
        <p>場所に関しては、成長するものを提案するために Growstuff に提供していただけると非常に助かります。ただし、納得のいく詳細レベルで行うことができます。おそらく、あなたの町の名前、あなたの州や地方、またはその国が十分に小さく、かなり安定した気候を持っている場合は、あなたの国の名前でも構いません。成長に関する正確なアドバイスを与えるのに十分近く、安心できるほど曖昧なものを選択してください。</p>
        <p>お客様の情報のプライバシーについて詳しくは、<a href="http://growstuff.org/policy/privacy">プライバシー ポリシー</a>をご覧ください。</p>
        <h2>作物、庭園、植栽</h2>
        <h3>新しい作物を追加するにはどうすればよいですか?</h3>
        <p>現時点では、<a href="http://www.growstuff.org/forums/growstuff-feedback-support">フィードバック&amp;サポートフォーラム</a>の<a href="http://www.growstuff.org/posts/skud-20130319-requests-for-new-crops">新しい作物のリクエスト</a>にメモを残してください。</p>
        <h3>非食用植物を追加しますか?</h3>
        <p>現在、食用ではない植物、または食品栽培や持続可能性の観点から「役に立たない」植物を追加する計画はありません。これには、コンパニオン プランツ、緑肥作物、害虫や病気の管理に使用される植物などが含まれる可能性があります。純粋に観賞用の植物を考えているのであれば、おそらくすぐには追加しないでしょう。</p>
        <p>ただし、将来的には、作物データベースにない「非公式」植物をメンバーが植えることができるようにしたいと考えています。</p>
        <h2>投稿、コメント、フォーラム</h2>
        <h3>投稿やコメントではどのような書式を使用できますか?</h3>
        <p>私たちは <a href="http://daringfireball.net/projects/markdown/syntax/">Markdown</a> 構文を使用します。これは、単純な強調 (太字と斜体) からリンク、画像などまで、かなり幅広いオプションを提供します。私たちは、正しい構文を生成するのに役立つツールバーをインストールしたいと考えていますが、それまでの間、私たちが提供できるのは上にリンクされているかなり技術的なドキュメントだけになると思います。</p>
        <h2>今後の機能</h2>
        <h3>どのような機能が計画されているかはどこで確認できますか?</h3>
        <p>当社のソフトウェア開発者は Pivotal Tracker と呼ばれる追跡ツールを使用しています。当社のツールは <a href="http://tracker.growstuff.org">http://tracker.growstuff.org/</a> でご覧いただけます。これにより、現在どのような機能に取り組んでいるか、またすぐに取り組む予定であるかがわかります。</p>
        <p>Pivotal Tracker のインターフェイスには、次の 3 つの情報列が表示されます。</p>
        <ul>
        <li>「現在」セクションには、現在取り組んでいる機能 (「ストーリー」と呼ばれる) が表示されます。</li>
        <li>「Backlog」では、近い将来に取り組む予定のストーリーを表示します。</li>
        <li>「Icebox」には、やりたいことは決まっているものの、まだ期限が決まっていないストーリーが含まれています。</li>
        </ul>
        <h3>見たい機能はどこで提案できますか?</h3>
        <p>まず <a href="http://tracker.growstuff.org/">tracker</a> をチェックして (上記を参照)、それがすでに計画していることや話し合っていることであるかどうかを確認することをお勧めします。それが完了したら、まだ計画されていない場合、または他にコメントしたい場合は、<a href="/forums/growstuff-feedback-support">フィードバック&amp;サポートフォーラム</a>に提案を投稿できます。</p>
        <h2>開発者とAPI</h2>
        <h3>Growstuff API はありますか?</h3>
        <p>私たちのサイトはまだ急速に変化しているため、現時点では公式 API はありません。ただし、データの一部は JSON フィードや RSS フィードを介して公開されており、変更される可能性があることを理解した上で、自由に操作してください。 <a href="https://github.com/Growstuff/growstuff/wiki/API">API ドキュメントは wiki</a> で見つけることができます。</p>
        <p>当社の API およびデータの使用には、<a href="http://www.growstuff.org/policy/api">API およびデータ使用ポリシー</a> が適用されます。</p>
        <h3>あなたのデータにはどのようなライセンスが適用されますか?</h3>
        <p>Growstuff のデータは、<a href="http://creativecommons.org/licenses/by-sa/3.0/">クリエイティブ コモンズ表示 - 継承 (CC-BY-SA) 3.0 非移植ライセンス</a> の下で利用可能です。これは、(当社のサイトにリンクバックすることにより) Growstuff に帰属する限り、また、自分のアプリ/サイト/プロジェクトが CC-BY-SA に基づいて独自のコンテンツまたはデータを共有している限り、それを再利用できることを意味します。</p>
        <p>詳細については、<a href="http://growstuff.org/policy/api">API およびデータ使用ポリシー</a> を参照してください。</p>
        <h2>ボランティアと仕事</h2>
        <h3>採用してますか？</h3>
        <p>残念ながら、いいえ。私たちは自己資金で運営されているコミュニティ グループです。</p>
        <p>参加したい方は下記をご覧ください。</p>
        <h3>Growstuff を支援するボランティアをするにはどうすればよいですか?</h3>
        <p>何よりもまず、サイトのアクティブなメンバーになることで、作物を栽培し、収穫物を追跡し、フォーラムに投稿し、他のメンバーと知り合うことで、データベースとコミュニティの構築に貢献できます。それがなければ、Growstuff はまったく意味がありません。ということで、ありがとうございました！</p>
        <p>次に、自分で食べ物を育てている、または試してみたいと考えている友人に Growstuff についての情報を広めていただければ幸いです。その方法については、以下でいくつかのヒントをご覧ください。</p>
        <p>Growstuff のソフトウェアもボランティア開発者の協力を得て構築されています。あなたがプログラマーであるか、コーディング方法を学びたいのであれば、ぜひ参加してください。経験問わず、どなたでも大歓迎です。</p>
        <p>また、作物データベースを管理するボランティアの作物管理者や、フォーラムの円滑な運営を支援するモデレーターもいます。これらは通常、最も活動的で役立つメンバーの中から選ばれます。</p>
        <h3>コーダーとして参加するにはどうすればよいですか?</h3>
        <p>まず、<a href="https://github.com/Growstuff/growstuff/wiki/">wiki</a>、<a href="http://github.com/Growstuff/growstuff">GitHub</a>、<a href="http://tracker.growstuff.org">tracker</a> のコードをチェックして、私たちがどのように機能するかを理解してください。</p>
        <p>参加したい場合は、<a href="http://lists.growstuff.org/mailman/listinfo/discuss">ディスカッションメーリングリスト</a>に参加してください。</p>
        <h3>私のコーディングスキルは錆びているか、存在しません。まだ参加できますか?</h3>
        <p>もちろん！私たちは、新しいプログラマー、しばらくコーディングをしていない人、または初めて私たちのプラットフォーム (Ruby on Rails) を学習している人を指導するのが大好きです。私たちはペア プログラミングで作業しており、タイプミスや HTML タグの修正などの簡単な作業から始めて、簡単なストーリーを始めることができます (いくつかの例については、<a href="http://tracker.growstuff.org">tracker</a> の「easy」タグを確認してください)。</p>
        <h3>Growstuff についての情報を広めるにはどうすればよいですか?</h3>
        <p>何よりもまず、友達に伝えて、参加するよう招待してください。私たちはスパム行為をしたくないので、あなたのアドレス帳をスクレイピングしたり、Facebook の最新情報を自動的に投稿したり、あなたに代わってツイートしたりすることは決してありません。でも、あなたが自分の言葉で人々に伝えてくれたら本当に嬉しいです。</p>
        <p>オンラインで情報を広める場所: Facebook、Twitter、その他のソーシャル メディア。自分のブログやウェブサイト。あなたが参加しているガーデニングや持続可能性のフォーラム。</p>
        <p>またはオフライン: 友人、家族、近所の人に伝えます。地元のコミュニティガーデン、ファーマーズマーケット、または農産物交換を通じて情報を広めてください。地元の持続可能性グループまたは移行グループに連絡してください。または、食料生産者がいると思われるその他の場所。</p>
        <h2>利用規約、著作権、その他の不正行為</h2>
        <h3>利用規約またはコミュニティガイドラインの違反はどこに報告すればよいですか?</h3>
        <p><a href="http://www.growstuff.org/forums/growstuff-feedback-support"> フィードバック &amp; サポート フォーラム</a> に投稿するか、<a href="mailto:support@growstuff.org">support@growstuff.org</a> に電子メールを送信できます。</p>
        <h3>何をスパムと考えますか?どのように報告すればよいですか?</h3>
        <p>スパムにはさまざまな種類があります。最も明らかなのは、繰り返される望ましくない商業広告です。多くのスパマーは、ユーザーにリンクをクリックさせようとしたり、単に何が逃げられるかを確認するために、無関係、無意味、または価値の低いコンテンツをフォーラムに投稿します。</p>
        <p>このようなスパムはすべて報告してください。</p>
        <p>今のところ、私たちは非常に新しいため、適切なスパム報告メカニズムがセットアップされていません。ただし、<a href="http://www.growstuff.org/forums/growstuff-feedback-support">フィードバック &amp; サポートフォーラム</a> にリンクをドロップしていただければ、できる限りの対応をさせていただきます。</p>
        <h3>誰かが著作権を侵害していると思われるものを投稿しました。どこに報告すればよいですか?</h3>
        <p>あなたが著作権所有者の場合は、当社の<a href="http://growstuff.org/policy/copyright">著作権侵害ポリシー</a>に記載されている手順に従って苦情を提出できます。</p>
        <h3>グロースタッフは子供が使用しても安全ですか?</h3>
        <p>食品の栽培に焦点を当てた Web サイトとして、Growstuff がかなり安全でフレンドリーな環境であることを期待しています。ただし、サイトの一部 (メンバーによる投稿など) には、成人向けの概念や粗暴な言葉などが含まれる場合があります。お子様をこれらにさらしたくない場合は、お子様の Growstuff の使用を監督することを強くお勧めします。また、お子様が Growstuff で共有する個人情報には注意することをお勧めします。</p>
        <h2>さらなるサポート</h2>
        <h3>サイトの既知の問題のリストはどこで見つけられますか?</h3>
        <p>GitHub <a href="https://github.com/Growstuff/growstuff/issues">既知の問題</a>。</p>
        <h3>私の質問はここでは答えられていません。さらにサポートをどこに求めればよいですか?</h3>
        <p><a href="http://www.growstuff.org/forums/growstuff-feedback-support">フィードバック&amp;サポートフォーラム</a>。投稿する前に既知の問題のリストを確認してください。</p>
        <h3>フィードバックや称賛をどこに投稿できますか?</h3>
        <p>フィードバックは大歓迎です! <a href="http://www.growstuff.org/forums/growstuff-feedback-support">フィードバック&amp;サポートフォーラム</a>にメモを残してください。 （ここにエコーはありますか？）</p>
        <h3>他にどのように連絡できますか?</h3>
        <p>ここで説明されていないことについてサポートが必要な場合は、<a href="mailto:support@growstuff.org">support@growstuff.org</a> に電子メールを送信してください。</p>
        <p>メディア/プレスに関するお問い合わせは、<a href="mailto:media@growstuff.org">media@growstuff.org</a>までご連絡ください。</p>
        <p>サイト全般に関するお問い合わせがある場合 (例: ビジネス的な内容、またはサポート以外の方法で関係者に連絡したいだけ) は、<a href="mailto:info@growstuff.org">info@growstuff.org</a> に電子メールを送信できます。</p>
    tos:
      title: "グロースタッフ利用規約"
      body_html: |
        <p>私たちは法律用語が嫌いなので、利用規約を読みやすくするよう努めました。ご質問がございましたら、お気軽に<a href="mailto:support@growstuff.org">お問い合わせください</a>、最善を尽くしてお答えいたします。</p>
        <p>Growstuff の管理者 (「当社」、「当社」、「当社の」、「Growstuff」) は、以下の利用規約を提示します。これは、Growstuff Web サイト (<a href="http://www.growstuff.org">growstuff.org</a>) および Web サイト上で、または Web サイトを通じて利用できるすべてのコンテンツ、サービス、製品 (当社が総称して「サービス」と呼びます) の使用を管理するものです。</p>
        <p>サービスを使用するには、これらの利用規約と、当社が公開する他のすべてのポリシー (Growstuff のプライバシー ポリシー、API およびデータ使用ポリシー、著作権侵害ポリシー、コミュニティ ガイドラインを含みますがこれらに限定されません) に同意する必要があります。当社はこれを「本契約」と呼びます。</p>
        <p>サービスにアクセスまたは使用する前に、本契約をよくお読みください。サービスの一部にアクセスまたは使用すると、本契約の利用規約に拘束されることに同意したものとみなされます。本契約のすべての条件に同意しない場合は、サービスにアクセスすることはできません。</p>
        <h2>1.あなたのアカウント</h2>
        <p>本サービスでアカウントを作成する場合、お客様はアカウントのセキュリティを維持する責任があります。あなたは、アカウントの下で発生するすべての活動に対して責任を負います。アカウントのセキュリティを守るために適切な措置を講じる必要があります。お客様がアカウントの保護を怠った結果、アカウントのセキュリティが侵害された場合、当社はいかなる責任も負いません。</p>
        <h2>2.アカウントの構造</h2>
        <p>Growstuff のアカウントは 1 種類で、無料です。</p>
        <p>このサービスを使用することにより、お客様は、お客様のアカウントで利用可能な機能をいつでも変更、修正、または中止する Growstuff の権利に同意したものとみなされます。</p>
        <h2>3.コンテンツポリシー</h2>
        <p>当社のコンテンツ ポリシーは、お客様が Growstuff Web サイトまたはサービスを通じて投稿できる、当社が「コンテンツ」と呼ぶあらゆるマテリアルに関するものです。これには、プロフィール情報、投稿とコメント、食品栽培活動に関する情報、および Growstuff 自体に投稿したり、Growstuff からリンクしたりできるその他の素材 (テキスト、グラフィック、その他の形式を問わず) が含まれます。</p>
        <p>本サービスに投稿されたすべてのコンテンツは、いかなる方法であっても所有者の責任となります。コンテンツがお客様を管轄する法律によって違法であるとみなされた場合、お客様は、当社が必要な情報を適切な当局に提出することに同意するものとします。</p>
        <p>当社は、お客様が本サービスに投稿するコンテンツに対する所有権や管理権を一切主張しません。あなたは、適用法に従って、投稿したコンテンツに対する知的財産権を保持します。コンテンツを投稿することにより、お客様は、第三者の権利を侵害することなく、そのコンテンツを複製する権利 (および当社がそのようなコンテンツを提供できるようにする権利) を持っていることを表明するものとします。あなたは、投稿する権利を持たないコンテンツの投稿によって生じるあらゆる責任を負うことに同意するものとします。</p>
        <p>お客様は、当社の API、フィード、外部クライアントを含むサービスのあらゆる部分を通じて、お客様のアカウントのコンテンツを表示、配布、宣伝する目的のみで、コンテンツを複製、変更、翻案、公開するための世界規模でロイヤリティフリーの非独占的なライセンスを当社に付与するものとします。</p>
        <p>お客様がコンテンツを削除する場合、当社はサービスからコンテンツを削除するために合理的な努力を払いますが、お客様は、コンテンツのキャッシュや参照が直ちに利用できなくなる可能性があることを了承するものとします。</p>
        <h3>3.1 構造化データ</h3>
        <p>「構造化データ」と呼ばれるコンテンツのサブセットがあります。構造化データは、創造的な努力ではなく、単純な事実を表すコンテンツです。たとえば、場所、日付、または植えた作物の種類と数は構造化データです。構造化データは、お客様によって明示的に作成される場合もあれば、お客様のアクティビティに応じて Web サイトによって暗黙的に作成される場合もあります。</p>
        <p>本サービスを使用することにより、お客様は、構造化データが Growstuff によって収集および保存されること、およびお客様またはお客様のアクティビティに関する構造化データがクリエイティブ コモンズ表示継承 (CC-BY-SA) ライセンスに基づいて第三者によって使用可能になる可能性があることを承認するものとします。また、クリエイティブ コモンズ ライセンスの条項に基づく構造化データの帰属が Growstuff に与えられることにも同意するものとします。</p>
        <h3>3.2 他のウェブサイトに投稿されたコンテンツ</h3>
        <p>当社、ユーザー、またはコンテンツのプロバイダーがリンクしている Web サイトや Web ページ、または当社へのリンク先の Web サイトおよび Web ページを通じて利用できる、コンピューター ソフトウェアを含むすべてのマテリアルを当社はレビューしておらず、またレビューすることはできません。当社はこれらの Web サイトや Web ページを管理することはできず、その内容や使用については責任を負いません。外部の Web サイトまたは Web ページにリンクすることによって、当社はそのような Web サイトまたは Web ページを推奨することを表明または示唆するものではありません。あなたには、ウイルス、ワーム、トロイの木馬、その他の有害または破壊的なコンテンツから自分自身とコンピュータ システムを保護するために、必要に応じて予防措置を講じる責任があります。当社は、そのリンクが当社によって提供されたものであるか、サービス上のコンテンツのプロバイダーによって提供されているかにかかわらず、外部の Web サイトおよび Web ページの使用から生じるいかなる損害についても責任を負いません。</p>
