        <p>お客様は、本サービスを使用することにより、攻撃的または好ましくないと思われるコンテンツにさらされる可能性があることに同意します。</p>
        <p>コンテンツの事前審査は行っておりません。ただし、お客様は、当社が独自の裁量で、サービスからコンテンツを削除または削除を拒否する権利を有する（義務ではない）ことを承認するものとします。かかるコンテンツが当社に報告された場合、どのような措置を講じるべきかについては、当社の独自の裁量となります。</p>
        <p>お客様が送信したコンテンツが本契約に違反していると当社に報告された場合、お客様は、当社が定める合理的な期間内に、そのコンテンツを変更、修正、または削除するよう当社に求めることができることに同意するものとします。この指示に従わない場合、当社はあなたのアカウントを停止することがあります。</p>
