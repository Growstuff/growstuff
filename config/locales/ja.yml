        <h2>5.ボランティア</h2>
        <p>Growstuff の運営のさまざまな面でのボランティアの奉仕に感謝します。ボランティア活動には、ソフトウェアの開発、技術サポートの提供、ドキュメントの作成、サイト管理業務の実行、専門家によるアドバイスの提供、調査、技術文書の作成、レビュー、分類、およびサービスの運営をサポートするために必要なその他の業務が含まれますが、これらに限定されません。</p>
        <p>すべてのボランティアは法定年齢に達しているか、法的な親または保護者の同意を得てボランティアを行うことが期待されます。</p>
        <p>ボランティア活動を行うことにより、お客様は、法律で認められる範囲で、ボランティア活動の結果として作成された作品が永久的、取消不能かつ世界規模で Growstuff にライセンス供与されることに同意するものとします。お客様は、Growstuff が、お客様のボランティア作品を他者にライセンスする根拠を決定する場合があることに同意するものとします。これには、お客様の作品のさらなる改変や配布を許可するオープンソース ライセンスまたはクリエイティブ コモンズ ライセンスに基づくものも含まれます。法律によりそのようなライセンス供与が禁止されている場合、お客様は、当該作品の使用を理由に Growstuff を決して訴訟しないことに同意するものとします。</p>
        <p>ボランティア活動を行うことにより、Growstuff による報酬や将来の対価を期待せずに作品を提供することに同意したことになります。また、作業が正しく、正確で、欠陥がないことを確認するために合理的な注意を払ったことにも同意するものとします。あなたは、ボランティア活動の過程で提供された専有情報または機密情報を開示または共有しないことに同意します。</p>
        <p>ユーザーがボランティアをする必要はなく、ボランティアをしないユーザーも同等のケア、サポート、注意を受けます。</p>
