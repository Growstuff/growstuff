# i18n-tasks finds and manages missing and unused translations https://github.com/glebm/i18n-tasks

base_locale: en
## i18n-tasks detects locales automatically from the existing locale files
## uncomment to set locales explicitly
# locales: [en, es, fr]

## i18n-tasks report locale, default: en, available: en, ru
# internal_locale: ru

# Read and write locale data
data:
  ## by default, translation data are read from the file system, or you can provide a custom data adapter
  # adapter: I18n::Tasks::Data::FileSystem

  # Locale files to read from
  read:
    - config/locales/%{locale}.yml
    # - config/locales/*.%{locale}.yml
    # - config/locales/**/*.%{locale}.yml

  # key => file routes, matched top to bottom
  write:
    ## E.g., write devise and simple form keys to their respective files
    # - ['{devise, simple_form}.*', 'config/locales/\1.%{locale}.yml']
    # Catch-all
    - config/locales/%{locale}.yml
    # `i18n-tasks normalize -p` will force move the keys according to these rules

  # YAML / JSON serializer options, passed to load / dump / parse / serialize
  yaml:
    write:
      # do not wrap lines at 80 characters
      line_width: -1
  json:
    write:
      # pretty print JSON
      indent: '  '
      space: ' '
      object_nl: "\n"
      array_nl: "\n"

# Find translate calls
search:
  ## Default scanner finds t() and I18n.t() calls
  # scanner: I18n::Tasks::Scanners::PatternWithScopeScanner

  ## Paths to search in, passed to File.find
  paths:
    - app/

  ## Root for resolving relative keys (default)
  # relative_roots:
  #   - app/views

  ## File.fnmatch patterns to exclude from search. Binary files, which the scanner can't read as text.
  exclude: ["*.jpg", "*.png", "*.gif", "*.svg", "*.ico", "*.eot", "*.ttf", "*.woff", "*.woff2", "*.pdf", "*.xcf", "*.webp"]

  ## Or, File.fnmatch patterns to include
  # include: ["*.rb", "*.html.slim"]

  ## Lines starting with # or / are ignored by default
  # ignore_lines:
  #  - "^\\s*[#/](?!\\si18n-tasks-use)"

## Google Translate
# translation:
#   # Get an API key and set billing info at https://code.google.com/apis/console to use Google Translate
#   api_key: "AbC-dEf5"

## Consider these keys not missing
ignore_missing:
  # Provided by Rails, rails-i18n and Devise, not by this app's locale files.
  - 'date.{abbr_month_names,month_names}'
  - 'support.array.*'
  - 'errors.messages.not_saved'
  - 'devise.sessions.signed_in'

## Consider these keys used
ignore_unused:
  # Looked up by Rails and CanCan from the model or the ability, not by a t() call in app/.
  - 'activerecord.*'
  - 'unauthorized.*'
  # Built at runtime from a variable, such as t("frost.verdicts.#{key}"), so the scanner can't see the call.
  - 'frost.verdicts.*'
  - 'job_ideas.reason.*'
  - 'photos.licence.summary.*'
  - '{harvests,jobs,plantings,seeds}.index.title.*' # ApplicationHelper#title
  - 'home.stats.*'
  - 'neighbours.group.*'
  - 'seeds.crop_changes.show.*'
  - 'stalls.seeds.new.*'
  # Used with a conditional or a variable in the key, such as t(draft? ? 'posts.draft_saved' : 'posts.created').
  - 'buttons.{add,plant}'
  - 'admin.features.index.switch_{on,off}'
  - 'gardens.layout_section.*'
  - 'crop_jobs.added.*'
  - 'gardens.created'
  - 'members.follow_button.{follow,follow_named}'
  - 'posts.{created,draft_saved,updated}'

## Exclude these keys from `i18n-tasks eq-base' report
# ignore_eq_base:
#   all:
#     - common.ok
#   fr,es:
#     - common.brand

## Exclude these keys from all of the reports
# ignore:
#  - kaminari.*
